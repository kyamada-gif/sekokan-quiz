name: Slack学習リマインダー

# JST(UTC+9) で 朝 ≈07:47 / 夕 ≈17:47 に起動（cron は UTC 基準。JapanはDST無し＝常にUTC+9）。
# ★分を「00」から外しているのは GitHub Actions の schedule が毎時00分に集中して
#   大幅遅延・稀に欠落するため。混雑帯を避けて定刻±数分に収める狙い。少し前倒しして〜8時/〜18時に着地させる。
# 平日判定・カリキュラム進度は post.py 側で JST 日付から判断する。
on:
  schedule:
    - cron: '47 22 * * *'   # 07:47 JST（前日22:47 UTC）= morning
    - cron: '47 8 * * *'    # 17:47 JST（08:47 UTC）   = evening
  workflow_dispatch:        # 手動テスト用
    inputs:
      slot:
        description: 'morning / evening'
        required: true
        default: 'morning'
      dry_run:
        description: 'true なら投稿せず内容のみ出力'
        required: false
        default: 'false'
      override_date:
        description: 'YYYY-MM-DD でJST日付を固定（テスト用。通常は空欄）'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve slot from trigger
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "47 22 * * *") echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
              "47 8 * * *")  echo "slot=evening" >> "$GITHUB_OUTPUT" ;;
              *)             echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      # 手動Run(workflow_dispatch)＝テスト扱い。テスト用Webhookが未設定なら本番へ誤爆させず即fail。
      - name: Guard test webhook on manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          TEST: ${{ secrets.SLACK_WEBHOOK_URL_TEST }}
        run: |
          if [ -z "$TEST" ]; then
            echo "::error::手動Runはテストchへのみ可。Secret SLACK_WEBHOOK_URL_TEST を設定してください。"
            exit 1
          fi

      # schedule → 本番ch / workflow_dispatch → テストch に振り分け（post.py は SLACK_WEBHOOK_URL を読むだけ）
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.SLACK_WEBHOOK_URL_TEST || secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          OVERRIDE_DATE: ${{ github.event.inputs.override_date }}
        run: python3 slackbot/post.py "${{ steps.slot.outputs.slot }}"
