e,"verified":true,"flags":[],"src":{"text":"kakomonn:43039","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-45","season":"R1_early","no":45,"sectionId":"hoki","field":"法規","topicName":"建設業の許可","topic":"t34","body":"建設業の許可に関する記述として、建設業法上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"特定建設業の許可は、国土交通大臣又は都道府県知事によって与えられる。"},{"text":"建築工事業で一般建設業の許可を受けている者が、建築工事業で特定建設業の許可を受けた場合、一般建設業の許可は効力を失う。"},{"text":"建設業の許可を受けようとする者は、営業所ごとに所定の要件を満たした専任の技術者を置かなければならない。"},{"text":"一般建設業と特定建設業の許可の違いは、発注者から直接請け負うことができる工事の請負代金の額の違いによる。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43040","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-46","season":"R1_early","no":46,"sectionId":"hoki","field":"法規","topicName":"主任技術者・監理技術者","topic":"t34","body":"工事現場における技術者に関する記述として、建設業法上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"請負代金の額が6,000万円の共同住宅の建築一式工事を請け負った建設業者が、工事現場に置く主任技術者は、専任の者でなければならない。"},{"text":"発注者から直接建築一式工事を請け負った建設業者は、下請代金の総額が6,000万円未満の下請契約を締結して工事を施工する場合、工事現場に主任技術者を置かなければならない。"},{"text":"主任技術者を設置する工事で専任が必要とされるものでも、密接な関係のある２以上の建設工事を同一の建設業者が同一の場所において施工するものについては、これらの工事を同じ主任技術者が管理することができる。"},{"text":"建築一式工事に関し10年以上実務の経験を有する者は、建築一式工事における主任技術者になることができる。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43041","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-47","season":"R1_early","no":47,"sectionId":"hoki","field":"法規","topicName":"労働基準法","topic":"t35","body":"次の記述のうち、「労働基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"親権者又は後見人は、未成年者に代って労働契約を締結することができる。"},{"text":"使用者は、満18歳に満たない者について、その年齢を証明する戸籍証明書を事業場に備え付けなければならない。"},{"text":"未成年者は、独立して賃金を請求することができる。"},{"text":"使用者は、原則として満18歳に満たない者を午後10時から午前５時までの間において使用してはならない。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43042","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-48","season":"R1_early","no":48,"sectionId":"hoki","field":"法規","topicName":"主要構造部が鉄骨造である建築物","topic":null,"body":"主要構造部が鉄骨造である建築物の建設工事の現場において、店社安全衛生管理者を選任しなければならない常時就労する労働者の最小人員として、「労働安全衛生法」上、正しいものはどれか。\nただし、統括安全衛生責任者が選任される場合を除くものとする。","bodyImgs":[],"choices":[{"text":"10人"},{"text":"20人"},{"text":"30人"},{"text":"50人"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43043","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-49","season":"R1_early","no":49,"sectionId":"hoki","field":"法規","topicName":"建設工事","topic":null,"body":"建設工事に係る次の資材のうち、「建設工事に係る資材の再資源化等に関する法律（建設リサイクル法）」上、特定建設資材に該当しないものはどれか。","bodyImgs":[],"choices":[{"text":"木造住宅の新築工事に伴って生じた木材の端材"},{"text":"木造住宅の新築工事に伴って生じたせっこうボードの端材"},{"text":"駐車場の解体撤去工事に伴って生じたコンクリート平板"},{"text":"駐車場の解体撤去工事に伴って生じたアスファルト・コンクリート塊"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43044","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-50","season":"R1_early","no":50,"sectionId":"hoki","field":"法規","topicName":"建設作業","topic":null,"body":"次の建設作業のうち、「騒音規制法」上、特定建設作業に該当しないものはどれか。\nただし、作業は開始した日に終わらないものとする。","bodyImgs":[],"choices":[{"text":"環境大臣が指定するものを除く、原動機の定格出力が80kWのバックホウを使用する作業"},{"text":"環境大臣が指定するものを除く、原動機の定格出力が70kWのトラクターショベルを使用する作業"},{"text":"くい打機をアースオーガーと併用するくい打ち作業"},{"text":"圧入式を除く、くい打くい抜機を使用する作業"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43045","answer":"answers/R1_early_answers.csv"}},{"id":"R1_late-1","season":"R1_late","no":1,"sectionId":"gaku","field":"建築学","topicName":"採光・照明・日射","topic":"t3","body":"日照及び日射に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"北緯 35度付近の冬至における終日日射量は、南向きの鉛直面が他のどの向きの鉛直面よりも大きい。"},{"text":"日照時間は、日の出から日没までの時間をいう。"},{"text":"北緯 35度付近の夏至における終日日射量は、東向きの鉛直面よりも水平面の方が大きい。"},{"text":"大気透過率が高くなるほど、直達日射が強くなり、天空日射は弱くなる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46568","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-2","season":"R1_late","no":2,"sectionId":"gaku","field":"建築学","topicName":"採光・照明・日射","topic":"t3","body":"昼光に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"直射日光は、大気を透過して直接地表に届く昼光の成分である。"},{"text":"昼光率は、屋外の全天空照度が大きくなると、低くなる。"},{"text":"室内のある点における昼光率は、時刻や天候によって変化しない。"},{"text":"室内の要求される基準昼光率は、居間より事務室の方が高い。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46569","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-3","season":"R1_late","no":3,"sectionId":"gaku","field":"建築学","topicName":"音","topic":"t4","body":"音に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"吸音率は、入射する音のエネルギーに対する反射音以外の音のエネルギーの割合である。"},{"text":"床衝撃音には、重くて軟らかい衝撃源による重量衝撃音と、比較的軽量で硬い物体の落下による軽量衝撃音がある。"},{"text":"単層壁の音響透過損失は、一般に、壁体の面密度が高くなるほど、大きくなる。"},{"text":"劇場の後方部は、エコーを防ぐため、壁や天井に反射板を設置する。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46570","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-4","season":"R1_late","no":4,"sectionId":"gaku","field":"建築学","topicName":"RC構造","topic":"t6","body":"鉄筋コンクリート構造に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"耐震壁の壁量は、地震力などの水平力を負担させるため、下階よりも上階が多くなるようにする。"},{"text":"大梁は、床の鉛直荷重を支えるとともに、柱をつなぎ地震力などの水平力にも抵抗する部材である。"},{"text":"柱と梁の接合部を剛接合とした純ラーメン構造は、骨組みで地震力などの水平力に抵抗する構造である。"},{"text":"床スラブは、床の鉛直荷重を梁に伝えるとともに、架構を一体化し地震力などの水平力に抵抗させる役割も持っている。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46571","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-5","season":"R1_late","no":5,"sectionId":"gaku","field":"建築学","topicName":"鉄骨構造","topic":"t7","body":"鉄骨構造の一般的な特徴に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"軽量鉄骨構造に用いる軽量形鋼は、通常の形鋼に比べて、部材にねじれや局部座屈が生じやすい。"},{"text":"鉄筋コンクリート構造に比べ、鉄骨構造の方が架構の変形能力が高い。"},{"text":"鋼材は不燃材料であるため、骨組は十分な耐火性能を有する。"},{"text":"鉄筋コンクリート構造に比べ、鉄骨構造の方が大スパンの建築物を構築できる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46572","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-6","season":"R1_late","no":6,"sectionId":"gaku","field":"建築学","topicName":"鉄骨構造","topic":"t7","body":"鉄骨構造に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"丸鋼を用いる筋かいは、主に引張力に働く部材である。"},{"text":"スチフナーは、節点に集まる部材相互の接合に用いられる鋼板である。"},{"text":"エンドタブは、溶接時に溶接線の始終端に取り付けられる補助部材である。"},{"text":"裏当て金は、完全溶込み溶接を片面から行うために、溶接線に沿って開先ルート部の裏側に取り付けられる鋼板である。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46573","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-7","season":"R1_late","no":7,"sectionId":"gaku","field":"建築学","topicName":"基礎・地盤","topic":"t9","body":"基礎構造に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"独立フーチング基礎は、一般に基礎梁で連結する。"},{"text":"同一建築物に杭基礎と直接基礎など異種の基礎を併用することは、なるべく避ける。"},{"text":"直接基礎の鉛直支持力は、基礎スラブの根入れ深さが大きくなるほど大きくなる。"},{"text":"直接基礎の底面は、冬季の地下凍結深度より浅くする。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46574","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-8","season":"R1_late","no":8,"sectionId":"gaku","field":"建築学","topicName":"荷重・外力","topic":"t10","body":"建築物の構造設計における荷重及び外力に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"地震力は、建築物の弾性域における固有周期及び地盤の種類に応じて算定する。"},{"text":"バルコニーの積載荷重は、共同住宅の用途に供する建築物より学校の方が大きい。"},{"text":"多雪区域における地震力の算定に用いる荷重は、建築物の固定荷重と積載荷重の和に積雪荷重の 1/2 を加えたものとする。"},{"text":"建築物を風の方向に対して有効にさえぎる防風林がある場合は、その方向における速度圧を 1/2 まで減らすことができる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46575","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-9","season":"R1_late","no":9,"sectionId":"gaku","field":"建築学","topicName":"荷重・外力","topic":"t10","body":"図に示す単純梁にモーメント荷重が作用したとき、支点 Bに生じる鉛直反力の値の大きさとして、正しいものはどれか。","bodyImgs":["exam_img/R1_late/q9.png"],"choices":[{"text":"12 kN"},{"text":"６ kN"},{"text":"４ kN"},{"text":"３ kN"}],"answer":[3],"answerMode":"single","hasImage":true,"verified":true,"flags":[],"src":{"text":"kakomonn:46576","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-10","season":"R1_late","no":10,"sectionId":"gaku","field":"建築学","topicName":null,"topic":null,"body":"図に示す単純梁に集中荷重２P及び３Pが作用したときの曲げモーメント図として、正しいものはどれか。\nただし、曲げモーメントは材の引張側に描くものとする。","bodyImgs":["exam_img/R1_late/q10.png"],"choices":[{"img":"exam_img/R1_late/a10_1.png"},{"img":"exam_img/R1_late/a10_2.png"},{"img":"exam_img/R1_late/a10_3.png"},{"img":"exam_img/R1_late/a10_4.png"}],"answer":[2],"answerMode":"single","hasImage":true,"verified":true,"flags":[],"src":{"text":"kakomonn:46577","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-11","season":"R1_late","no":11,"sectionId":"gaku","field":"建築学","topicName":"鋼材の性質","topic":"t11","body":"JIS（日本工業規格/現日本産業規格）に規定する構造用鋼材に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"建築構造用圧延鋼材は、SN材と呼ばれ、性能により A種、B種、C種に分類される。"},{"text":"溶接構造用圧延鋼材は、SM材と呼ばれ、溶接性に優れた鋼材である。"},{"text":"建築構造用炭素鋼鋼管は、STKN材と呼ばれ、材質をSN材と同等とした円形鋼管である。"},{"text":"一般構造用圧延鋼材は、SSC材と呼ばれ、一般的に使用される鋼材である。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46578","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-12","season":"R1_late","no":12,"sectionId":"gaku","field":"建築学","topicName":"JIS（日本工業規格／現日本産","topic":null,"body":"JIS（日本工業規格／現日本産業規格）に規定する建具の試験項目と測定項目の組合せとして、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"結露防止性試験 ―― 熱貫流率"},{"text":"耐風圧性試験 ――― 変位・たわみ"},{"text":"気密性試験 ―――― 通気量"},{"text":"水密性試験 ―――― 漏水"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46579","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-13","season":"R1_late","no":13,"sectionId":"gaku","field":"建築学","topicName":"シーリング材の特徴","topic":"t14","body":"シーリング材の特徴に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ポリサルファイド系シーリング材は、表面の仕上塗材や塗料を変色、軟化させることがある。"},{"text":"ポリウレタン系シーリング材は、ガラスまわり目地に適している。"},{"text":"シリコーン系シーリング材は、紫外線による変色が少ない。"},{"text":"アクリルウレタン系シーリング材は、表面にタックが残ることがある。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46580","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-14","season":"R1_late","no":14,"sectionId":"gaku","field":"建築学","topicName":"床仕上(カーペット・フローリング)","topic":null,"body":"カーペットに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"タフテッドカーペットは、パイル糸をうね状に並べて基布に接着固定した敷物である。"},{"text":"ウィルトンカーペットは、基布とパイル糸を同時に織り込んだ、機械織りの敷物である。"},{"text":"ニードルパンチカーペットは、シート状の繊維で基布を挟み、針で刺して上下の繊維を絡ませた敷物である。"},{"text":"タイルカーペットは、バッキング材を裏打ちしたタイル状敷物である。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46581","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-15","season":"R1_late","no":15,"sectionId":"setsu","field":"建築設備等","topicName":"給排水設備","topic":"t15","body":"屋外排水設備に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"地中埋設排水管の長さが、その内径又は内法幅の 120倍を超えない範囲内で、桝又はマンホールを設ける。"},{"text":"地中埋設排水経路に桝を設ける場合、雨水桝にはインバートを、汚水桝には泥だめを設ける。"},{"text":"排水管を給水管に平行して埋設する場合、原則として、両配管は 500 mm以上のあきを設ける。"},{"text":"地中埋設排水経路が合流する箇所には、桝又はマンホールを設ける。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46582","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-16","season":"R1_late","no":16,"sectionId":"setsu","field":"建築設備等","topicName":"採光・照明・日射","topic":"t3","body":"照明設備に関する一般的な記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"LEDは、高効率で他の照明器具に比べ寿命が長く、省エネ対策として広く用いられる。"},{"text":"Hf 蛍光ランプは、ちらつきが少なく、主に事務所などの照明に用いられる。"},{"text":"ハロゲン電球は、低輝度であり、主に道路やトンネルの照明に用いられる。"},{"text":"メタルハライドランプは、演色性がよく、主にスポーツ施設などの照明に用いられる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46583","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-17","season":"R1_late","no":17,"sectionId":"setsu","field":"建築設備等","topicName":"空気調和設備","topic":"t16","body":"空気調和設備に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"単一ダクト方式における CAV 方式は、室内に吹き出す風量が一定であり、室内環境を一定に保つことができる。"},{"text":"二重ダクト方式は、別々の部屋で同時に冷房と暖房を行うことができる。"},{"text":"パッケージユニット方式は、熱源機器でつくられた冷水や温水を各室のパッケージユニットに供給し、冷風や温風が吹き出るようにしたものである。"},{"text":"各階ユニット方式は、各階ごとに空調機を分散設置して空調を行う方式で、各階ごとの負荷変動に対応できる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46584","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-18","season":"R1_late","no":18,"sectionId":"seko","field":"建築施工","topicName":"墨出し・遣方","topic":"t18","body":"やり方及び墨出しに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"水貫は、水杭に示した一定の高さに上端を合わせて、水杭に水平に取り付ける。"},{"text":"やり方は、建物の高低、位置、方向、心の基準を明確にするために設ける。"},{"text":"高さの基準点は、複数設置すると相互に誤差を生じるので、設置は１箇所とする。"},{"text":"鋼製巻尺は、同じ精度を有する巻尺を２本以上用意して、１本は基準巻尺として保管する。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46585","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-19","season":"R1_late","no":19,"sectionId":"seko","field":"建築施工","topicName":"地業工事","topic":"t19","body":"地業工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"砂利地業に用いる再生クラッシャランは、岩石を破砕したものであり、品質にばらつきがある。"},{"text":"土間コンクリートの下の防湿層は、断熱材がある場合、断熱材の直下に設ける。"},{"text":"砂利地業の締固めは、床付地盤を破壊したり、さらに深い地盤を乱さないよう、注意して行う。"},{"text":"砂利地業の締固めによるくぼみが生じた場合は、砂又は砂利を補充して再度転圧する。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46586","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-20","season":"R1_late","no":20,"sectionId":"seko","field":"建築施工","topicName":"鉄筋の加工・組立","topic":"t20","body":"異形鉄筋の加工に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄筋の加工寸法の表示及び計測は、突当て長さ（外側寸法）を用いて行う。"},{"text":"鉄筋の種類と径が同じ帯筋とあばら筋は、折曲げ内法直径の最小値は同じである。"},{"text":"壁の開口部補強筋の末端部には、フックを付けなければならない。"},{"text":"鉄筋の折曲げ加工は、常温で行う。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46587","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-21","season":"R1_late","no":21,"sectionId":"seko","field":"建築施工","topicName":"型枠支保工","topic":"t22","body":"型枠支保工に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"支柱にパイプサポートを使用する場合、継手は差込み継手としてはならない。"},{"text":"支柱にパイプサポートを使用する場合、パイプサポートを３以上継いで用いてはならない。"},{"text":"柱、壁及び梁側型枠のせき板を保持する場合、支保工は一般に内端太及び外端太により構成する。"},{"text":"軽量型支保梁を受ける梁型枠の支柱にパイプサポートを使用する場合、パイプサポートは２列に設ける。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46588","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-22","season":"R1_late","no":22,"sectionId":"seko","field":"建築施工","topicName":"コンクリートの養生","topic":"t21","body":"コンクリートの養生に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"湿潤養生期間の終了前であっても、コンクリートの圧縮強度が所定の値を満足すれば、せき板を取り外すことができる。"},{"text":"打込み後のコンクリートが透水性の小さいせき板で保護されている場合は、湿潤養生と考えてよい。"},{"text":"早強ポルトランドセメントを用いたコンクリートの材齢による湿潤養生期間は、普通ポルトランドセメントより短くできる。"},{"text":"寒中コンクリート工事における加熱養生中は、コンクリートの湿潤養生を行わない。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46589","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-23","season":"R1_late","no":23,"sectionId":"seko","field":"建築施工","topicName":"鉄骨建方","topic":null,"body":"鉄骨の建方に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"溶接継手のエレクションピースに使用する仮ボルトは、高力ボルトを用いて全数締め付けた。"},{"text":"ターンバックル付き筋かいを有する鉄骨構造物は、その筋かいを用いて建入れ直しを行った。"},{"text":"柱現場溶接接合部に建入れ及び食違い調整機能の付いた治具を使用したため、ワイヤロープを用いず、建入れ直しを行った。"},{"text":"建方精度の測定は、温度の影響を避けるため、早朝の一定時間に実施した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46590","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-24","season":"R1_late","no":24,"sectionId":"seko","field":"建築施工","topicName":"木造在来軸組","topic":"t8","body":"在来軸組構法の木工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"土台を固定するアンカーボルトは、土台の両端部や継手の位置、耐力壁の両端の柱に近接した位置に設置した。"},{"text":"柱に使用する心持ち材には、干（ひ）割れ防止のため、見え隠れ部分に背割りを入れた。"},{"text":"根太の継手は、大引の心を避けて突付け継ぎとし、釘打ちとした。"},{"text":"軒桁の継手は、柱心から持ち出して、追掛け大栓（せん）継ぎとした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46591","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-25","season":"R1_late","no":25,"sectionId":"seko","field":"建築施工","topicName":"シーリング工事","topic":null,"body":"シーリング工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"充填箇所以外の部分に付着したシリコーン系シーリング材は、硬化後に除去した。"},{"text":"目地深さがシーリング材の寸法より深かったため、ボンドブレーカーを用いて充填深さを調整した。"},{"text":"ノンワーキングジョイントでは、３面接着で施工した。"},{"text":"コンクリート打継目地のシーリング目地幅は、20 mmとした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46592","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-26","season":"R1_late","no":26,"sectionId":"seko","field":"建築施工","topicName":"タイル張り工事","topic":"t24","body":"セメントモルタルによるタイル後張り工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"改良積上げ張りは、張付けモルタルを塗り付けたタイルを、下部から上部に張り上げる工法である。"},{"text":"密着張りは、下地面に張付けモルタルを塗り付け、振動機を用いてタイルを張り付ける工法である。"},{"text":"マスク張りは、下地面に張付けモルタルを塗り付け、表張りユニットをたたき込んで張り付ける工法である。"},{"text":"改良圧着張りは、下地面とタイル裏面とに張付けモルタルを塗り付け、タイルを張り付ける工法である。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46593","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-27","season":"R1_late","no":27,"sectionId":"seko","field":"建築施工","topicName":"折板葺","topic":null,"body":"金属製折板葺の工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"重ね形折板のボルト孔は、折板を１枚ずつ、呼び出しポンチで開孔した。"},{"text":"重ね形折板は、各山ごとにタイトフレーム上の固定ボルトに固定した。"},{"text":"折板葺のけらばの変形防止材には、折板の３山ピッチ以上の長さのものを用いた。"},{"text":"折板葺の棟包みの水下側には、雨水を止めるために止水面戸を用いた。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46594","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-28","season":"R1_late","no":28,"sectionId":"seko","field":"建築施工","topicName":"床コンクリートの直均し仕上げ","topic":null,"body":"床コンクリートの直均し仕上げに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"床仕上げレベルを確認できるガイドレールを、床コンクリートを打ち込んだ後に４m間隔で設置した。"},{"text":"コンクリート面を指で押しても少ししか入らない程度になった時に、木ごてで中むら取りを行った。"},{"text":"機械式ごてを用いた後、最終仕上げは金ごて押えとした。"},{"text":"張物下地は、最終こて押えの後、12時間程度を経てから、３日間散水養生を行った。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46595","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-29","season":"R1_late","no":29,"sectionId":"seko","field":"建築施工","topicName":"建具工事","topic":null,"body":"建具工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鋼製両面フラッシュ戸の表面板裏側の見え隠れ部分は、防錆塗装を行わなかった。"},{"text":"木製フラッシュ戸の中骨は、杉のむく材を使用した。"},{"text":"アルミニウム製建具のアルミニウムに接する小ねじは、鉛めっき処理したものを使用した。"},{"text":"樹脂製建具は、建具の加工及び組立てからガラスの組込みまでを建具製作所で行った。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46596","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-30","season":"R1_late","no":30,"sectionId":"seko","field":"建築施工","topicName":"塗装工事","topic":"t25","body":"木部の塗装工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"オイルステイン塗りは、耐候性が劣るため、建築物の屋外には使用しなかった。"},{"text":"つや有合成樹脂エマルションペイント塗りの下塗り後のパテかいは、耐水形の合成樹脂エマルションパテを使用した。"},{"text":"クリヤラッカー塗りの下塗り材は、サンジングシーラーを使用した。"},{"text":"木材保護塗料塗りにおいて、塗料は希釈せず原液で使用した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46597","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-31","season":"R1_late","no":31,"sectionId":"seko","field":"建築施工","topicName":"床仕上(カーペット・フローリング)","topic":null,"body":"カーペット敷きに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"タイルカーペットは、粘着はく離形の接着剤を用いて張り付けた。"},{"text":"全面接着工法によるカーペットは、ニーキッカーを用いて、十分伸長させながら張り付けた。"},{"text":"グリッパー工法のグリッパーは、壁際からのすき間を均等にとって打ち付けた。"},{"text":"ウィルトンカーペットは、はぎ合わせを手縫いでつづり縫いとした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46598","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-32","season":"R1_late","no":32,"sectionId":"seko","field":"建築施工","topicName":"モルタル塗り","topic":null,"body":"モルタル塗り仕上げ外壁の改修におけるアンカーピンニング部分エポキシ樹脂注入工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"モルタルの浮き部分に使用するアンカーピンの本数は、一般部分を 16 本/m2とした。"},{"text":"アンカーピン固定部の穿孔の深さは、構造体コンクリート面から 30 mmとした。"},{"text":"穿孔後は、孔内をブラシで清掃し、圧搾空気で接着の妨げとなる切粉を除去した。"},{"text":"アンカーピン固定用エポキシ樹脂は、手動式注入器を用いて、孔の表面側から徐々に充填した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46599","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-33","season":"R1_late","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"施工計画と事前調査の組合せとして、最も関係の少ないものはどれか。","bodyImgs":[],"choices":[{"text":"場所打ちコンクリート杭工事の計画 ----- 敷地内の地中障害物の有無の調査"},{"text":"鉄骨の建方計画 ----------------------- 近隣の商店や工場の業種の調査"},{"text":"地下水の排水計画 --------------------- 公共桝の有無と下水道の排水能力の調査"},{"text":"山留工事の計画 ----------------------- 試験掘削による土質性状の追加調査"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46600","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-34","season":"R1_late","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工事用ゲートを複数設置するため、守衛所をメインのゲート脇に設置し、その他は警備員だけを配置することとした。"},{"text":"作業員詰所は、職種数や作業員の増減に対応するため、大部屋方式とすることとした。"},{"text":"塗料や溶剤等の保管場所は、管理をしやすくするため、資材倉庫の一画を不燃材料で間仕切り設置することとした。"},{"text":"工事用ゲートにおいて、歩行者が多いため、車両の入退場を知らせるブザー及び標示灯を設置することとした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:46601","answer":"answers/R1_late_answers.csv"}},{"id":"R1_late-35","season":"R1_late","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"材料の保管","topic":null,"body":"工事現場における材料の保管に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄筋は、直接地面に接しないように角材間に渡し置き、シートを掛けて保管した。"},{"text":"壁紙は、ポリエチレンフィルムを掛けて養生し、屋内に立てて保管した。"},{"text":"ALCパネルは、台木を水平に置いた上に平積みで保管した。"},{"text":"ガラスは、クッション材を挟み、屋内の乾燥した場所に平積みで保管した。"}],"answer":[4],"answer t":"kakomonn:46617","answer":"answers/R1_late_answers.csv"}},{"id":"R2_late-1","season":"R2_late","no":1,"sectionId":"gaku","field":"建築学","topicName":"換気","topic":"t1","body":"換気に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"第1種機械換気方式は、地下街や劇場など外気から遮断された大きな空間の換気に適している。"},{"text":"第2種機械換気方式は、室内で発生した汚染物質が他室に漏れてはならない室の換気に適している。"},{"text":"事務室における必要換気量は、在室者の人数でその値が変動し、室の床面積に関係しない。"},{"text":"室内外の空気の温度差による自然換気では、温度差が大きくなるほど換気量は多くなる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53029","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-2","season":"R2_late","no":2,"sectionId":"gaku","field":"建築学","topicName":"採光・照明・日射","topic":"t3","body":"照明に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"光束は、視感度に基づいて測定された単位時間当たりの光のエネルギー量である。"},{"text":"照度は、単位面積当たりに入射する光束の量である。"},{"text":"輝度は、光源の光の強さを表す量である。"},{"text":"グレアは、高輝度な部分や極端な輝度対比などによって感じるまぶしさである。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53030","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-3","season":"R2_late","no":3,"sectionId":"gaku","field":"建築学","topicName":"音","topic":"t4","body":"吸音及び遮音に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"遮音とは、壁などに入射する音を吸収又は透過させて反射させないようにすることをいう。"},{"text":"遮音による騒音防止の効果を上げるには、壁や窓などの透過損失の値を高めるようにする。"},{"text":"有孔板と剛壁の間に空気層があるとき、主に中音域の音を吸音する。"},{"text":"グラスウールなどの多孔質材料は、主に高音域の音を吸音する。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53031","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-4","season":"R2_late","no":4,"sectionId":"gaku","field":"建築学","topicName":"RC構造","topic":"t6","body":"鉄筋コンクリート構造に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"片持ちスラブの厚さは、原則として、持出し長さの1/10以上とする。"},{"text":"柱の最小径は、原則として、その構造耐力上主要な支点間の距離の1/20以上とする。"},{"text":"腰壁やたれ壁が付いた柱は、地震時にせん断破壊を起こしやすい。"},{"text":"大梁は、せん断破壊よりも曲げ降伏が先行するように設計する。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53032","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-5","season":"R2_late","no":5,"sectionId":"gaku","field":"建築学","topicName":"鉄骨構造","topic":"t7","body":"鉄骨構造の一般的な特徴に関する記述として、鉄筋コンクリート構造と比べた場合、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"骨組の部材は、工場で加工し、現場で組み立てるため、工期を短縮しやすい。"},{"text":"骨組の部材は、強度が高いため、小さな断面の部材で大きな荷重に耐えることができる。"},{"text":"構造体は、剛性が大きく、振動障害が生じにくい。"},{"text":"同じ容積の建築物では、構造体の軽量化が図れる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53033","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-6","season":"R2_late","no":6,"sectionId":"gaku","field":"建築学","topicName":"鉄骨構造","topic":"t7","body":"鉄骨構造に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ガセットプレートは、節点に集まる部材相互の接合のために設ける部材である。"},{"text":"添え板（スプライスプレート）は、梁のウェブの座屈防止のために設ける補強材である。"},{"text":"ダイアフラムは、柱と梁の接合部に設ける補強材である。"},{"text":"合成梁に用いる頭付きスタッドは、鉄骨梁と鉄筋コンクリート床スラブが一体となるように設ける部材である。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53034","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-7","season":"R2_late","no":7,"sectionId":"gaku","field":"建築学","topicName":"基礎・地盤","topic":"t9","body":"杭基礎に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"場所打ちコンクリート杭工法には、アースオーガーを使用するプレボーリング拡大根固め工法がある。"},{"text":"SC杭（外殻鋼管付きコンクリート杭）は、一般に継杭の上杭として、PHC杭（遠心力高強度プレストレストコンクリート杭）と組み合わせて用いられる。"},{"text":"鋼杭は、地中での腐食への対処法として、塗装やライニングを行う方法、肉厚を厚くする方法等が用いられる。"},{"text":"既製杭工法には、鋼管の先端を加工した鋼管杭本体を回転させて地盤に埋設させる回転貫入工法がある。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53035","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-8","season":"R2_late","no":8,"sectionId":"gaku","field":"建築学","topicName":"荷重・外力","topic":"t10","body":"建築物の構造設計における荷重及び外力に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"固定荷重は、建築物各部自体の体積にその部分の材料の単位体積質量及び重力加速度を乗じて計算する。"},{"text":"積雪荷重は、雪下ろしを行う慣 る避難設備である。"},{"text":"劇場の客席に設ける客席誘導灯は、客席から一番近い避難口の方向の明示を主な目的とする避難設備である。"},{"text":"自動火災報知設備は、火災発生時に煙又は熱を感知し、自動的にベルやサイレンを鳴らす警報設備である。"},{"text":"非常用の照明装置は、火災等で停電した場合に自動的に点灯し、避難上必要な床面照度を確保する照明設備である。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53044","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-17","season":"R2_late","no":17,"sectionId":"setsu","field":"建築設備等","topicName":"空気調和設備","topic":"t16","body":"空気調和設備に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"定風量単一ダクト方式は、一定の風量で送風するシステムであり、負荷変動の異なる複数の空間に適するものである。"},{"text":"二重ダクト方式は、冷風、温風の2系統のダクトを設置するシステムであり、混合ボックスで温度を調節して室内に吹き出すものである。"},{"text":"パッケージユニット方式は、機内に冷凍機、ファン、冷却コイル、加熱コイル等を内蔵した一体型の空調機を使用するものである。"},{"text":"ファンコイルユニット方式は、熱源機器でつくられた冷水や温水を各室のファンコイルユニットに供給し、冷風や温風を吹き出すものである。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53045","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-18","season":"R2_late","no":18,"sectionId":"seko","field":"建築施工","topicName":"墨出し・遣方","topic":"t18","body":"墨出しに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"平面上の位置を示すために床面に付ける墨を、地墨という。"},{"text":"垂直を示すために壁面に付ける墨を、たて墨という。"},{"text":"基準墨から一定の距離をおいて平行に付ける墨を、逃げ墨という。"},{"text":"逃げ墨をもとにして型枠などの位置に付ける墨を、親墨という。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53046","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-19","season":"R2_late","no":19,"sectionId":"seko","field":"建築施工","topicName":"地業工事","topic":"t19","body":"地業工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"砂利地業で用いる砕石は、硬質なものとする。"},{"text":"砂利地業で用いる砂利は、砂が混じったものよりも粒径の揃ったものとする。"},{"text":"捨てコンクリートは、墨出しをしやすくするため、表面を平坦にする。"},{"text":"捨てコンクリートは、床付け地盤が堅固で良質な場合、地盤上に直接打ち込むことができる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53047","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-20","season":"R2_late","no":20,"sectionId":"seko","field":"建築施工","topicName":"鉄筋の継手・定着","topic":"t20","body":"鉄筋の継手及び定着に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"耐圧スラブが付く基礎梁主筋の継手の位置は、上端筋、下端筋ともスパンの中央部とする。"},{"text":"一般階の大梁の下端筋を柱内に折り曲げて定着する場合は、原則として曲げ上げる。"},{"text":"鉄筋の重ね継手の長さは、コンクリートの設計基準強度の相違により異なる場合がある。"},{"text":"フック付き定着とする場合の定着の長さは、定着起点からフックの折曲げ開始点までの距離とする。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53048","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-21","season":"R2_late","no":21,"sectionId":"seko","field":"建築施工","topicName":"型枠支保工","topic":"t22","body":"型枠支保工に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"パイプサポートに設ける水平つなぎは、番線を用いて緊結する。"},{"text":"上下階の支柱は、できるだけ平面上の同一位置になるように設置する。"},{"text":"梁下の支柱は、コンクリートの圧縮強度が設計基準強度以上で、かつ、所要の安全性が確認されれば取り外すことができる。"},{"text":"スラブ下の支柱は、コンクリートの圧縮強度によらない場合、存置期間中の平均気温から存置日数を決定する。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53049","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-22","season":"R2_late","no":22,"sectionId":"seko","field":"建築施工","topicName":"コンクリートの調合","topic":"t21","body":"コンクリートの調合に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"耐久性を確保するためには、水セメント比は小さいほうがよい。"},{"text":"スランプの大きいコンクリートでは、細骨材率が小さすぎると分離しやすくなる。"},{"text":"スランプは、工場出荷時における値を指定する。"},{"text":"AE減水剤を用いると、所定のスランプを得るのに必要な単位水量を減らすことができる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53050","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-23","season":"R2_late","no":23,"sectionId":"seko","field":"建築施工","topicName":"鉄骨の加工","topic":null,"body":"鉄骨の加工に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ひずみの矯正を常温加圧で行う場合は、ローラー又はプレスを使用する。"},{"text":"溶融亜鉛めっき高力ボルトの孔径は、同じ呼び径の高力ボルトの孔径よりも大きくする。"},{"text":"柱の十字形鉄骨に設ける梁主筋の貫通孔は、耐力低下の大きいフランジを避けて、ウェブに設ける。"},{"text":"開先の加工は、自動ガス切断、機械加工等により行う。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53051","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-24","season":"R2_late","no":24,"sectionId":"seko","field":"建築施工","topicName":"木造在来軸組","topic":"t8","body":"在来軸組構法における木工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"土台の継手は腰掛けあり継ぎとし、継手付近の下木をアンカーボルトで締め付けた。"},{"text":"隅通し柱の仕口は土台へ扇ほぞ差しとし、ホールダウン金物を用いてボルトで締め付けた。"},{"text":"建入れ直し完了後、接合金物や火打材を固定し、本筋かいを取り付けた。"},{"text":"垂木の継手は母屋の上でそぎ継ぎとし、釘で取り付けた。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53052","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-25","season":"R2_late","no":25,"sectionId":"seko","field":"建築施工","topicName":"シーリング工事","topic":null,"body":"シーリング工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"マスキングテープは、シーリング材のへら仕上げ終了後、直ちに取り除いた。"},{"text":"コンクリートの目地等のノンワーキングジョイントは、シーリング材の充填深さの最小値を10mmとした。"},{"text":"裏面に粘着剤が付いているバックアップ材は、目地幅より1～2mm小さい幅のものを使用した。"},{"text":"異種シーリング材を打ち継ぐため、先打ちシーリング材が硬化しないうちに、後打ちシーリング材を施工した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53053","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-26","season":"R2_late","no":26,"sectionId":"seko","field":"建築施工","topicName":"タイル張り工事","topic":"t24","body":"セメントモルタルによる床タイル圧着張りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"タイルの張付けモルタルは、塗り付ける厚さを5～7mmとし、1度に塗り付けた。"},{"text":"タイルの張付けモルタルは、1回に塗り付ける面積をタイル工1人当たり2m2以下とした。"},{"text":"タイルの張付け面積が小さかったため、下地となる敷きモルタルは貧調合とした。"},{"text":"タイルの張付けは、目地部分に張付けモルタルが盛り上がるまで、木づちでたたき押さえた。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53054","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-27","season":"R2_late","no":27,"sectionId":"seko","field":"建築施工","topicName":"防水工事","topic":"t23","body":"硬質塩化ビニル雨どいの工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"たてどいの継手は、専用の部品により接着剤を用いて取り付けた。"},{"text":"たてどいの受け金物は、900mm間隔で通りよく取り付けた。"},{"text":"軒どいの両端は、集水器に接着剤を用いて堅固に取り付けた。"},{"text":"軒どいの受け金物は、所定の流れ勾配をとり、600mm間隔で取り付けた。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53055","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-28","season":"R2_late","no":28,"sectionId":"seko","field":"建築施工","topicName":"セルフレベリング","topic":null,"body":"セルフレベリング材塗りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"セルフレベリング材塗りは、下地となるコンクリートの打込み後、1か月経過したのちに行った。"},{"text":"セルフレベリング材の流し込みは、吸水調整材塗布後、直ちに行った。"},{"text":"セルフレベリング材の流し込み作業中は、できる限り通風を避けるよう窓や開口部をふさいだ。"},{"text":"セルフレべリング材の流し込み後の乾燥養生期間は、外気温が低い冬季であったため、14日間とした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53056","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-29","season":"R2_late","no":29,"sectionId":"seko","field":"建築施工","topicName":"ガラス工事","topic":null,"body":"外部に面するサッシのガラス工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"熱線反射ガラスは、反射膜コーティング面を室内側とした。"},{"text":"建具下辺のガラス溝内に置くセッティングブロックは、ガラス1枚につき2箇所設置した。"},{"text":"グレイジングチャンネルの継目の位置は、ガラスの下辺中央部とした。"},{"text":"厚さ8mmの単板ガラスの留付けは、不定形シーリング材構法とした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53057","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-30","season":"R2_late","no":30,"sectionId":"seko","field":"建築施工","topicName":"塗装工事","topic":"t25","body":"塗装工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"上塗りに用いる塗料が少量だったため、同一製造所の同種塗料を用いて現場調色とした。"},{"text":"合成樹脂エマルションペイント塗りにおいて、天井面等の見上げ部分では研磨紙ずりを省略した。"},{"text":"木部のクリヤラッカー塗りの下塗りに、ウッドシーラーを用いた。"},{"text":"高粘度、高濃度の塗料による厚膜塗装は、エアレススプレーではなくエアスプレーにより吹き付けた。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53058","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-31","season":"R2_late","no":31,"sectionId":"seko","field":"建築施工","topicName":"ビニル床シート","topic":null,"body":"ビニル床シート張りにおける熱溶接工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"床シートの幅木部への巻上げは、シートをニトリルゴム系接着剤により張り付けた。"},{"text":"継目の溝はV字形とし、シート厚さの2/3程度まで溝切りした。"},{"text":"溶接部のシートの溝部分と溶接棒は、250～300℃の熱風で加熱溶融した。"},{"text":"溶接完了後、溶接部が完全に冷却したのち、余盛りを削り取り平滑にした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53059","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-32","season":"R2_late","no":32,"sectionId":"seko","field":"建築施工","topicName":"改修工事","topic":null,"body":"内装改修工事における既存床仕上げ材の除去に関する記述として、最も不適当なものはどれか。\nただし、除去する資材は、アスベストを含まないものとする。","bodyImgs":[],"choices":[{"text":"コンクリート下地の合成樹脂塗床材は、ブラスト機械を用いてコンクリート表面とともに削り取った。"},{"text":"モルタル下地面に残ったビニル床タイルの接着剤は、ディスクサンダーを用いて除去した。"},{"text":"モルタル下地の磁器質床タイルの張替え部は、はつりのみを用いて手作業で存置部分と縁切りをした。"},{"text":"根太張り工法の単層フローリングボードは、丸のこを用いて適切な寸法に切断し、根太下地を損傷しないように除去した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53060","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-33","season":"R2_late","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"事前調査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"解体工事の事前調査として、近接する建物や工作物の現況の調査をすることとした。"},{"text":"鉄骨工事の建方の事前調査として、日影による近隣への影響の調査をすることとした。"},{"text":"敷地内の排水工事の事前調査として、排水管の勾配が公設桝まで確保できるか調査をすることとした。"},{"text":"根切り工事の事前調査として、前面道路や周辺地盤の高低の調査をすることとした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53061","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-34","season":"R2_late","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"施工者用事務所と監理者用事務所は、機能が異なるため、それぞれ分けて設ける。"},{"text":"仮囲いの出入り口は、管理をしやすくするため、人や車両の入退場の位置を限定する。"},{"text":"ハンガー式門扉は、扉を吊る梁が車両の積荷高さを制約する場合があるため、有効高さを検討する必要がある。"},{"text":"仮囲いは、工事現場の周辺の状況が危害防止上支障がない場合であっても、設ける必要がある。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53062","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-35","season":"R2_late","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"材料の保管","topic":null,"body":"工事現場における材料の保管に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"高力ボルトは、箱の積上げ高さを5段までとして保管する。"},{"text":"型枠用合板は、直射日光が当たらないよう、シートを掛けて保管する。"},{"text":"袋詰めセメントは、風通しのよい倉庫に保管する。"},{"text":"防水用の袋入りアスファルトは、積重ねを10段までとして保管する。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53063","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-36","season":"R2_late","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"総合工程表の立案に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工程計画上のマイルストーン（管理日）は、工程上の重要な区切りを避けて計画する。"},{"text":"工区分割を行い、後続作業を並行して始めることにより、工期短縮が可能か検討する。"},{"text":"型枠工事の工程計画では、型枠存置期間を考慮して、せき板や支保工の転用を検討する。"},{"text":"工事を行う地域における労務、資材、機材等の調達状況を調査して、手配を計画する。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53064","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-37","season":"R2_late","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"バーチャート/ネットワーク工程表","topic":"t29","body":"バーチャート工程表に関する記述として、最も適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工事全体を掌握することが容易で、作成しやすい。"},{"text":"工事を構成する各作業を縦軸に記載し、工事の達成度を横軸にして表す。"},{"text":"工程上のキーポイント、重点管理しなければならない作業が判断しやすい。"},{"text":"多種類の関連工事間の工程調整に有利である。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53065","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-38","season":"R2_late","no":38,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"品質管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"検査とは、性質又は状態を調べた結果と判定基準を比較して、良否の判断を下すことである。"},{"text":"施工品質管理表（QC工程表）には、検査の時期、方法、頻度を明示する。"},{"text":"工程間検査は、作業工程の途中で、ある工程から次の工程に移ってもよいかどうかを判定するために行う。"},{"text":"品質管理とは、品質計画に従って試験又は検査を行うことをいう。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53066","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-39","season":"R2_late","no":39,"sectionId":"kanri","field":"施工管理法","topicName":"試験・検査","topic":"t30","body":"工事現場における試験に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"吹付けロックウールによる耐火被覆材の厚さの確認は、確認ピンを用いて行った。"},{"text":"外壁タイル張り後のタイル接着力試験は、油圧式簡易引張試験器を用いて行った。"},{"text":"鉄筋のガス圧接部のふくらみの直径の測定は、ダイヤルゲージを用いて行った。"},{"text":"コンクリートのスランプフロー試験は、スランプコーンを用いて行った。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53067","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-40","season":"R2_late","no":40,"sectionId":"kanri","field":"施工管理法","topicName":"鉄筋の継手・定着","topic":"t20","body":"鉄筋のガス圧接継手部の試験方法として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"圧縮試験"},{"text":"引張試験"},{"text":"外観試験"},{"text":"超音波探傷試験"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53068","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-41","season":"R2_late","no":41,"sectionId":"kanri","field":"施工管理法","topicName":"安全管理","topic":"t31","body":"工事現場の安全管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"安全施工サイクル活動とは、施工の安全を図るため、毎日、毎週、毎月に行うことをパターン化し、継続的に取り組む活動である。"},{"text":"新規入場者教育とは、作業所の方針、安全施工サイクルの具体的な内容、作業手順などを教育する活動である。"},{"text":"TBM（ツールボックスミーティング）とは、職長を中心に、作業開始前の短時間で、当日の安全作業について話し合う活動である。"},{"text":"ZE（ゼロエミッション）とは、作業に伴う危険性又は有害性に対し、作業グループが正しい行動を互いに確認し合う活動である。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53069","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-42","season":"R2_late","no":42,"sectionId":"kanri","field":"施工管理法","topicName":"型わく支保工の組立","topic":"t22","body":"型わく支保工の組立て等に関し、事業者の講ずべき措置として、「労働安全衛生法」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"型わく支保工の材料、器具又は工具を上げ、又はおろすときは、つり綱、つり袋等を労働者に使用させること。"},{"text":"型わく支保工の組立て等作業主任者を選任すること。"},{"text":"型わく支保工の組立て等の作業を行う区域内には、関係労働者以外の労働者の立入りを禁止すること。"},{"text":"型わく支保工の組立て等の作業の方法を決定し、作業を直接指揮すること。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53070","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-43","season":"R2_late","no":43,"sectionId":"hoki","field":"法規","topicName":"用語の定義","topic":"t32","body":"用語の定義に関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"建築物を移転することは、建築である。"},{"text":"公衆浴場の浴室は、居室ではない。"},{"text":"コンクリートや石は、耐水材料である。"},{"text":"基礎は、構造耐力上主要な部分であるが、主要構造部ではない。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53071","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-44","season":"R2_late","no":44,"sectionId":"hoki","field":"法規","topicName":"換気","topic":"t1","body":"居室の採光及び換気に関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"温湿度調整を必要とする作業を行う作業室については、採光を確保するための窓その他の開口部を設けなくてもよい。"},{"text":"ふすま、障子その他随時開放することができるもので仕切られた2室は、居室の採光の規定の適用に当たっては、1室とみなすことはできない。"},{"text":"換気設備を設けるべき調理室等に設ける給気口は、原則として、天井の高さの1/2以下の高さに設けなければならない。"},{"text":"居室には、政令で定める技術的基準に従って換気設備を設けた場合、換気のための窓その他の開口部を設けなくてもよい。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53072","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-45","season":"R2_late","no":45,"sectionId":"hoki","field":"法規","topicName":"建設業の許可","topic":"t34","body":"建設業の許可に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"工事1件の請負代金の額が1,500万円に満たない建築一式工事のみを請け負う場合、建設業の許可を必要としない。"},{"text":"建設業の許可は、建設工事の種類ごとに、29業種に分けて与えられる。"},{"text":"国又は地方公共団体が発注者である建設工事を請け負う者は、特定建設業の許可を受けていなければならない。"},{"text":"下請負人として建設業を営もうとする者が建設業の許可を受ける場合、一般建設業の許可を受ければよい。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53073","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-46","season":"R2_late","no":46,"sectionId":"hoki","field":"法規","topicName":"建設業 請負契約","topic":"t34","body":"建設工事の請負契約書に記載しなければならない事項として、「建設業法」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"注文者が工事の全部又は一部の完成を確認するための検査の時期及び方法並びに引渡しの時期"},{"text":"工事の完成又は出来形部分に対する下請代金の支払の時期及び方法並びに引渡しの時期"},{"text":"工事の施工により第三者が損害を受けた場合における賠償金の負担に関する定め"},{"text":"天災その他不可抗力による工期の変更又は損害の負担及びその額の算定方法に関する定め"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53074","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-47","season":"R2_late","no":47,"sectionId":"hoki","field":"法規","topicName":"労働基準法","topic":"t35","body":"労働契約の締結に際し、「労働基準法」上、使用者が定め、原則として、労働者に書面で交付しなければならない労働条件はどれか。","bodyImgs":[],"choices":[{"text":"職業訓練に関する事項"},{"text":"安全及び衛生に関する事項"},{"text":"災害補償及び業務外の傷病扶助に関する事項"},{"text":"就業の場所及び従事すべき業務に関する事項"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53075","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-48","season":"R2_late","no":48,"sectionId":"hoki","field":"法規","topicName":"建設業において、Y労働安全","topic":null,"body":"建設業において、「労働安全衛生法」上、事業者が安全衛生教育を行わなくてもよい者はどれか。","bodyImgs":[],"choices":[{"text":"新たに選任した作業主任者"},{"text":"新たに職務につくこととなった職長"},{"text":"新たに建設現場の事務職として雇い入れた労働者"},{"text":"新たに雇い入れた短時間（パートタイム）労働者"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53076","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-49","season":"R2_late","no":49,"sectionId":"hoki","field":"法規","topicName":"廃棄物処理法","topic":"t35","body":"次の記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"建築物の新築に伴って生じた段ボールは、産業廃棄物である。"},{"text":"建築物の地下掘削に伴って生じた土砂は、産業廃棄物である。"},{"text":"建築物の除去に伴って生じた木くずは、産業廃棄物である。"},{"text":"建築物の杭工事に伴って生じた汚泥は、産業廃棄物である。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53077","answer":"answers/R2_late_answers.csv"}},{"id":"R2_late-50","season":"R2_late","no":50,"sectionId":"hoki","field":"法規","topicName":"記述","topic":null,"body":"次の記述のうち、「道路法」上、道路の占用の許可を受ける必要のないものはどれか。","bodyImgs":[],"choices":[{"text":"歩道の一部にはみ出して、工事用の仮囲いを設置する。"},{"text":"道路の上部にはみ出して、防護棚（養生朝顔）を設置する。"},{"text":"工事用電力の引込みのために、仮設電柱を道路に設置する。"},{"text":"屋上への設備機器揚重のために、ラフタークレーンを道路上に設置する。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:53078","answer":"answers/R2_late_answers.csv"}},{"id":"R3_early-1","season":"R3_early","no":1,"sectionId":"gaku","field":"建築学","topicName":"湿度・結露","topic":"t2","body":"湿度及び結露に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"絶対湿度が100％になる温度を露点温度という。"},{"text":"壁体の中に熱伝導率の大きい場所がある場合に、熱が集中して流れるこの部分を熱橋という。"},{"text":"冬季暖房時に、室内の水蒸気により外壁などの室内側表面で生じる結露を表面結露という。"},{"text":"乾燥空気1kg当たりに含まれている水蒸気の質量を絶対湿度という。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56886","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-2","season":"R3_early","no":2,"sectionId":"gaku","field":"建築学","topicName":"採光・照明・日射","topic":"t3","body":"照明に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"一般に直接照明による陰影は、間接照明と比べ濃くなる。"},{"text":"点光源による照度は、光源からの距離の2乗に反比例する。"},{"text":"色温度は、絶対温度で示し、単位はlm（ルーメン）である。"},{"text":"タスク・アンビエント照明は、全般照明と局部照明を併せて行う方式である。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56887","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-3","season":"R3_early","no":3,"sectionId":"gaku","field":"建築学","topicName":"色","topic":"t5","body":"色に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"一般に明度が高い色ほど膨張して見える。"},{"text":"一般に同じ色でもその面積が小さいほど、明るさや鮮やかさが増して見える。"},{"text":"2つの有彩色を混ぜて灰色になるとき、その2色は互いに補色の関係にある。"},{"text":"補色どうしを対比すると、互いに強調しあい、鮮やかさが増して見える。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56888","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-4","season":"R3_early","no":4,"sectionId":"gaku","field":"建築学","topicName":"木造在来軸組","topic":"t8","body":"木造在来軸組構法に関する記述として、最も不適 確保する。"},{"text":"屋内の耐力壁は、耐久性上有効な仕上げがある場合とない場合では、最小かぶり厚さが異なる。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56904","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-20","season":"R3_early","no":20,"sectionId":"seko","field":"建築施工","topicName":"鉄骨の加工","topic":null,"body":"鉄骨製作工場における錆止め塗装に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"組立てによって肌合せとなる部分は、錆止め塗装を行わなかった。"},{"text":"柱ベースプレート下面のコンクリートに接する部分は、錆止め塗装を行わなかった。"},{"text":"素地調整を行った鉄鋼面は、素地が落ち着くまで数日あけて錆止め塗装を行った。"},{"text":"錆止め塗装を行う部材は、原則として塗装検査以外の検査を終了した後に塗装を行った。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56905","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-21","season":"R3_early","no":21,"sectionId":"seko","field":"建築施工","topicName":"木造在来軸組","topic":"t8","body":"在来軸組構法における木工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"せいが異なる胴差の継手は、受材心より150mm程度持ち出し、腰掛けかま継ぎとし、ひら金物両面当て釘打ちとした。"},{"text":"束立て床組の大引の継手は、床束心で腰掛けあり継ぎとし、釘打ちとした。"},{"text":"筋かいと間柱の交差する部分は、間柱を筋かいの厚さだけ欠き取って筋かいを通した。"},{"text":"ラグスクリューのスクリュー部の先孔の径は、スクリュー径の70％程度とした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56906","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-22","season":"R3_early","no":22,"sectionId":"seko","field":"建築施工","topicName":"解体工事","topic":null,"body":"木造2階建住宅の解体工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"作業の効率を高めるため、障子、襖、ドア等の建具は、1階部分から撤去した。"},{"text":"外壁の断熱材として使用されているグラスウールは、可能な限り原形のまま取り外した。"},{"text":"蛍光ランプは、窓ガラスと共に専用のコンテナ容器内で破砕して、ガラス類として処分した。"},{"text":"屋根葺き材は、内装材を撤去した後、手作業で取り外した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56907","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-23","season":"R3_early","no":23,"sectionId":"seko","field":"建築施工","topicName":"防水工事","topic":"t23","body":"アスファルト防水工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"防水下地となるコンクリートの入隅の形状は、通りよく45°の面取りとした。"},{"text":"平場部のアスファルトルーフィングの重ね幅は、長手及び幅方向とも100mm以上とした。"},{"text":"平場部のストレッチルーフィングの流し張りは、ルーフィングの両端からアスファルトがはみ出さないように押し付けながら張り付けた。"},{"text":"砂付あなあきルーフィングを用いる絶縁工法の立上り部は、砂付あなあきルーフィングを省略した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56908","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-24","season":"R3_early","no":24,"sectionId":"seko","field":"建築施工","topicName":"石工事","topic":null,"body":"外壁の張り石工事において、湿式工法と比較した場合の乾式工法の特徴として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"台車等の衝突で張り石が破損しやすい。"},{"text":"白華現象が起こりにくい。"},{"text":"地震時の躯体の挙動に追従しにくい。"},{"text":"工期短縮を図りやすい。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56909","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-25","season":"R3_early","no":25,"sectionId":"seko","field":"建築施工","topicName":"金属の表面仕上","topic":null,"body":"アルミニウム合金の表面処理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"陽極酸化皮膜の上に、クリア塗装する。"},{"text":"硫黄を用いた硫化処理を行い、褐色に発色させる。"},{"text":"化成皮膜の上に、樹脂塗料を焼付け塗装する。"},{"text":"有機酸を用いた陽極酸化処理を行い、皮膜の生成と同時に発色させる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56910","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-26","season":"R3_early","no":26,"sectionId":"seko","field":"建築施工","topicName":"建具工事","topic":null,"body":"鋼製建具に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"建具枠の取付け精度は、対角寸法差を3mm以内とした。"},{"text":"外部に面する鋼製ドアのステンレス製くつずりは、両端を縦枠より延ばし、縦枠の裏面で溶接した。"},{"text":"外部に面する両面フラッシュ戸の見込み部は、上下を除いた左右2方のみ、表面板で包んだ。"},{"text":"くつずりは、あらかじめ裏面に鉄線を付けておき、モルタル詰めを行った後、取り付けた。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56911","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-27","season":"R3_early","no":27,"sectionId":"seko","field":"建築施工","topicName":"塗装の素地ごしらえ","topic":"t25","body":"塗装工事における素地ごしらえに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"モルタル面の吸込み止めは、パテかいを行った後に、シーラーを全面に塗り付けた。"},{"text":"せっこうボード面のパテかいには、合成樹脂エマルションパテを使用した。"},{"text":"不透明塗料塗りの木部面は、節止めにセラックニスを塗り付けた。"},{"text":"鉄鋼面に付着した機械油の除去には、石油系溶剤を使用した。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56912","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-28","season":"R3_early","no":28,"sectionId":"seko","field":"建築施工","topicName":"カーテン工事","topic":null,"body":"カーテン工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"カーテン上端の折返し長さは、使用するフック（ひるかん）の長さにより定めた。"},{"text":"引分け式遮光用カーテンは、中央召合せを300mmとした。"},{"text":"レースカーテンのカーテンボックスは、窓幅に対して片側各々150mm長くした。"},{"text":"レースカーテンの上端の縁加工は、カーテン心地を入れないで袋縫いとした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56913","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-29","season":"R3_early","no":29,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"事前調査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"総合仮設計画に当たり、敷地周辺の電柱及び架空電線の調査を行った。"},{"text":"解体工事計画に当たり、発生する木くずを再生するため、再資源化施設の調査を行った。"},{"text":"根切り工事に当たり、埋蔵文化財の有無について調査を行った。"},{"text":"防護棚の設置に当たり、敷地地盤の高低及び地中埋設配管の調査を行った。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56914","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-30","season":"R3_early","no":30,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"仮囲いには、合板パネルなどの木製材料を使用することとした。"},{"text":"仮囲いを設けなければならないため、その高さは周辺の地盤面から1.5mとすることとした。"},{"text":"ハンガー式門扉は、重量と風圧を軽減するため、上部を網状の構造とすることとした。"},{"text":"工事ゲートは、トラックアジテータが通行するため、有効高さを3.8mとすることとした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56915","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-31","season":"R3_early","no":31,"sectionId":"kanri","field":"施工管理法","topicName":"申請・届出","topic":"t33","body":"建築工事に係る申請や届出等に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"道路上に高所作業車を駐車して作業するため、道路使用許可申請書を警察署長宛てに届け出た。"},{"text":"振動規制法による特定建設作業を指定地域内で行うため、特定建設作業実施届出書を市町村長宛てに届け出た。"},{"text":"延べ面積が20m2の建築物を建築するため、建築工事届を市町村長宛てに届け出た。"},{"text":"支柱の高さが3.5m以上の型枠支保工を設置するため、設置の届けを労働基準監督署長宛てに届け出た。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56916","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-32","season":"R3_early","no":32,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"工程計画及び工程管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ネットワーク工程表は、工程における複雑な作業間の順序関係を視覚的に表現することができる工程表である。"},{"text":"基本工程表は、工事全体を一つの工程表としてまとめたもので、工事の主要な作業の進捗を表示する。"},{"text":"工程計画を立てるに当たり、その地域の雨天日や強風日等を推定して作業不能日を設定する。"},{"text":"各作業の所要期間は、作業の施工数量に投入数量と1日当たりの施工能力を乗じて求める。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56917","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-33","season":"R3_early","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"バーチャート/ネットワーク工程表","topic":"t29","body":"バーチャート工程表に関する記述として、最も適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工事出来高の累積値を表現しているため、工事進捗度合が把握しやすい工程表である。"},{"text":"各作業に対する先行作業、並列作業、後続作業の相互関係が把握しやすい工程表である。"},{"text":"作業間調整に伴う修正が容易な工程表である。"},{"text":"各作業ごとの日程及び工事全体の工程計画が、比較的容易に作成できる工程表である。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56918","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-34","season":"R3_early","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"次の用語のうち、品質管理に最も関係の少ないものはどれか。","bodyImgs":[],"choices":[{"text":"SMW"},{"text":"PDCA"},{"text":"ばらつき"},{"text":"トレーサビリティ"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56919","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-35","season":"R3_early","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"品質管理のための試験及び検査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄骨工事において、高力ボルト接合部の締付けの検査のため、超音波探傷試験を行った。"},{"text":"シーリング工事において、接着性の確認のため、簡易接着性試験を行った。"},{"text":"コンクリート工事において、フレッシュコンクリートの受入れ検査のため、空気量試験を行った。"},{"text":"鉄筋工事において、ガス圧接継手の検査のため、抜き取った接合部の引張試験を行った。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56920","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-36","season":"R3_early","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"コンクリート試験・受入","topic":"t21","body":"コンクリートの試験に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"スランプの測定値は、スランプコーンを引き上げた後の、平板からコンクリート最頂部までの高さとした。"},{"text":"材齢が28日の構造体コンクリート強度の判定に用いる供試体は、現場水中養生とした。"},{"text":"受入れ検査における圧縮強度試験は、3回の試験で1検査ロットを構成した。"},{"text":"スランプ試験は、コンクリートの打込み中に品質の変化が認められた場合にも行うこととした。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56921","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-37","season":"R3_early","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"作業主任者","topic":"t35","body":"作業主任者を選任すべき作業として、「労働安全衛生法」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"高さ5mの足場の変更の作業"},{"text":"土止め支保工の切りばりの取り外しの作業"},{"text":"軒高5mの木造建築物の構造部材の組立て作業"},{"text":"ALCパネルの建込み作業"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56922","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-38","season":"R3_early","no":38,"sectionId":"kanri","field":"施工管理法","topicName":"足場","topic":"t31","body":"足場に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"枠組足場に使用する作業床の幅は、30cmとした。"},{"text":"枠組足場の墜落防止設備として、交さ筋かい及び高さ15cm以上の幅木を設置した。"},{"text":"移動式足場（ローリングタワー）の作業台上では、脚立の使用を禁止とした。"},{"text":"移動式足場（ローリングタワー）の脚輪のブレーキは、移動中を除き、常に作動させた。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56923","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-39","season":"R3_early","no":39,"sectionId":"ability","field":"施工管理法","topicName":"型枠締付金物","topic":"t22","body":"型枠の締付け金物等に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"セパレータは、せき板に対して垂直となるよう配置した。"},{"text":"打放し仕上げとなる外壁コンクリートの型枠に使用するセパレータは、コーンを取り付けないものを用いた。"},{"text":"塗り仕上げとなる壁コンクリートの型枠に使用するフォームタイと座金は、くさび式を用いた。"},{"text":"柱の型枠に用いるコラムクランプは、セパレータと組み合わせて使用した。"}],"answer":[2,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56924","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-40","season":"R3_early","no":40,"sectionId":"ability","field":"施工管理法","topicName":"コンクリート試験・受入","topic":"t21","body":"レディーミクストコンクリートに関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"コンクリート荷卸し時のスランプの許容差は、スランプの値に関係なく一定である。"},{"text":"コンクリートに含まれる塩化物は、原則として塩化物イオン量で0.30kg/m3以下とする。"},{"text":"空気量の許容差は、普通コンクリートよりも高強度コンクリートの方が大きい。"},{"text":"単位水量は、最大値を185kg/m3とし、所定の品質が確保できる範囲内で、できるだけ少なくする。"}],"answer":[1,3],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56925","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-41","season":"R3_early","no":41,"sectionId":"ability","field":"施工管理法","topicName":"仕上塗材仕上げ","topic":null,"body":"仕上塗材仕上げに関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"各工程ごとに用いる下塗材、主材及び上塗材は、同一製造所のものとした。"},{"text":"仕上塗材の所要量は、被仕上塗材仕上面の単位面積に対する希釈前の仕上塗材の使用質量から算出した。"},{"text":"屋外や室内の湿潤になる場所の下地調整に用いるパテは、合成樹脂エマルションパテを使用した。"},{"text":"シーリング面への仕上塗材仕上げは、シーリング材の硬化前に行った。"}],"answer":[3,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56926","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-42","season":"R3_early","no":42,"sectionId":"ability","field":"施工管理法","topicName":"床仕上(カーペット・フローリング)","topic":null,"body":"床のフローリングボード張りに関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"フローリングボードに生じた目違いは、パテかいにより平滑にした。"},{"text":"フローリングボード張込み後、床塗装仕上げを行うまで、ポリエチレンシートを用いて養生をした。"},{"text":"フローリングボードの下張り用合板は、長手方向が根太と直交するように割り付けた。"},{"text":"隣り合うフローリングボードの木口の継手位置は、すべて揃えて割り付けた。"}],"answer":[1,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56927","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-43","season":"R3_early","no":43,"sectionId":"hoki","field":"法規","topicName":"建築確認手続き","topic":"t33","body":"建築確認手続き等に関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"特定工程後の工程に係る工事は、当該特定工程に係る中間検査合格証の交付を受けた後でなければ、これを施工してはならない。"},{"text":"建築主事は、木造3階建ての建築物の確認申請書を受理した場合、受理した日から35日以内に、建築基準関係規定に適合するかどうかを審査しなければならない。"},{"text":"工事施工者は、建築物の工事を完了したときは、建築主事又は指定確認検査機関の完了検査を申請しなければならない。"},{"text":"鉄骨造2階建ての建築物の建築主は、原則として、検査済証の交付を受けた後でなければ、当該建築物を使用し、又は使用させてはならない。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56928","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-44","season":"R3_early","no":44,"sectionId":"hoki","field":"法規","topicName":"記述","topic":null,"body":"次の記述のうち、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"居室の天井の高さは、室の床面から測り、1室で天井の高さの異なる部分がある場合は、その平均の高さによる。"},{"text":"映画館における客用の階段で高さが3mをこえるものには、3m以内ごとに踊場を設けなければならない。"},{"text":"木造3階建ての住宅の3階に設ける調理室の壁及び天井の内装は、準不燃材料としなければならない。"},{"text":"階段に代わる傾斜路には、原則として、手すり等を設けなければならない。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56929","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-45","season":"R3_early","no":45,"sectionId":"hoki","field":"法規","topicName":"建設業の許可","topic":"t34","body":"建設業の許可の変更に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"許可を受けた建設業の営業所の所在地について、同一の都道府県内で変更があったときは、その旨の変更届出書を提出しなければならない。"},{"text":"許可を受けた建設業の業種の区分について変更があったときは、その旨の変更届出書を提出しなければならない。"},{"text":"許可を受けた建設業の使用人数に変更を生じたときは、その旨を書面で届け出なければならない。"},{"text":"許可を受けた建設業の営業所に置く専任の技術者について、代わるべき者があるときは、その者について、書面を提出しなければならない。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56930","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-46","season":"R3_early","no":46,"sectionId":"hoki","field":"法規","topicName":"主任技術者・監理技術者","topic":"t34","body":"工事現場における技術者に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"主任技術者は、工事現場における建設工事を適正に実施するため、当該建設工事の施工計画の作成、工程管理、品質管理の職務を誠実に行わなければならない。"},{"text":"主任技術者を設置する工事で専任が必要とされるものは、同一の建設業者が同一の場所において行う密接な関係のある2以上の工事であっても、これらの工事を同一の主任技術者が管理してはならない。"},{"text":"建築一式工事に関し10年以上実務の経験を有する者は、建築一式工事における主任技術者になることができる。"},{"text":"工事現場における建設工事の施工に従事する者は、主任技術者又は監理技術者がその職務として行う指導に従わなければならない。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56931","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-47","season":"R3_early","no":47,"sectionId":"hoki","field":"法規","topicName":"次の業務のうち、Q労","topic":null,"body":"次の業務のうち、「労働基準法」上、満17才の者を就かせてはならない業務はどれか。","bodyImgs":[],"choices":[{"text":"屋外の建設現場での業務"},{"text":"動力により駆動される土木建築用機械の運転の業務"},{"text":"最大積載荷重1tの荷物用エレベーターの運転の業務"},{"text":"20kgの重量物を断続的に取り扱う業務"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56932","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-48","season":"R3_early","no":48,"sectionId":"hoki","field":"法規","topicName":"労働安全衛生(届出等)","topic":"t35","body":"「労働安全衛生法」上、事業者が、所轄労働基準監督署長へ報告書を提出する必要がないものはどれか。","bodyImgs":[],"choices":[{"text":"産業医を選任したとき"},{"text":"安全管理者を選任したとき"},{"text":"総括安全衛生管理者を選任したとき"},{"text":"安全衛生推進者を選任したとき"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:56933","answer":"answers/R3_early_answers.csv"}},{"id":"R3_early-49","season":"R3_early","no":49,"sectionId":"hoki","field":"法規","topicName":"建設工事に伴う次の副産物のうち、Q建設工事","topic":null,"body":"建設工事に伴う次の副産物のうち、「建設工事に係る資材の再資源化等に関する法律（建設リサイクル法）」上、特定建設資材廃棄物に該当するものはどれか。","bodyImgs":[],"choices":[{"text":"場所打ちコンクリート杭工事の杭頭処理に伴って生じたコンクリート塊
