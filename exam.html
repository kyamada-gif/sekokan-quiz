csv"}},{"id":"R3_late-11","season":"R3_late","no":11,"sectionId":"gaku","field":"建築学","topicName":"鋼材の性質","topic":"t11","body":"構造用鋼材に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"建築構造用圧延鋼材SN400の引張強さの下限値は、400N／mm2である。"},{"text":"引張強さは250〜300℃で最大となり、それ以上の高温になると急激に低下する。"},{"text":"線膨張係数は、約1.2 × 10−5（1／℃）である。"},{"text":"ヤング係数は、約3.14 × 105N／mm2である。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63859","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-12","season":"R3_late","no":12,"sectionId":"gaku","field":"建築学","topicName":"木材の性質","topic":"t12","body":"木材の樹種に関する一般的な圧縮強度の比較として、適当なものはどれか。","bodyImgs":[],"choices":[{"text":"スギ ＜ ヒノキ ＜ ケヤキ"},{"text":"ヒノキ ＜ スギ ＜ ケヤキ"},{"text":"ケヤキ ＜ スギ ＜ ヒノキ"},{"text":"ヒノキ ＜ ケヤキ ＜ スギ"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63860","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-13","season":"R3_late","no":13,"sectionId":"gaku","field":"建築学","topicName":"建具(JIS性能)","topic":null,"body":"日本産業規格（JIS）に規定する建具の性能試験方法に関する記述として、不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"耐風圧性の性能試験では、変位及びたわみを測定する。"},{"text":"遮音性の性能試験では、音響透過損失を測定する。"},{"text":"結露防止性の性能試験では、熱貫流率を測定する。"},{"text":"遮熱性の性能試験では、日射熱取得率を測定する。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63861","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-14","season":"R3_late","no":14,"sectionId":"gaku","field":"建築学","topicName":"防水材料","topic":"t23","body":"防水材料に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"金属系シート防水のステンレスシート又はチタンシートは、連続溶接することで防水層を形成する。"},{"text":"ウレタンゴム系の塗膜防水材は、塗り重ねることで連続的な膜を形成する。"},{"text":"アスファルトプライマーは、下地と防水層の接着性を向上させるために用いる。"},{"text":"防水モルタルに混入した防水剤は、塗り付ける下地に浸透して防水効果を高めるために用いる。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63862","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-15","season":"R3_late","no":15,"sectionId":"setsu","field":"建築設備等","topicName":"給排水設備","topic":"t15","body":"屋外排水工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"内法が600mmを超え、かつ、深さ1.2mを超える雨水用排水桝には、足掛け金物を取り付けた。"},{"text":"雨水用排水桝及びマンホールの底部には、深さ50mmの泥だめを設けた。"},{"text":"地中埋設排水管の長さが、その内径又は内法幅の120倍を超えない範囲内で、桝又はマンホールを設けた。"},{"text":"排水管を給水管に平行して埋設する場合、給水管を上方にして、両配管は500mm以上のあきを設けた。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63863","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-16","season":"R3_late","no":16,"sectionId":"setsu","field":"建築設備等","topicName":"LED照明","topic":"t3","body":"LEDランプに関する一般的な記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"他のランプ類に比べ耐熱性が低いため、高温にさらされないよう、発熱体の周辺への設置は避ける。"},{"text":"他のランプ類に比べ寿命が短いため、高い天井等、ランプの交換がしにくい場所への設置は避ける。"},{"text":"光線に紫外線をほとんど含まないため、屋外照明に使用しても虫が寄り付きにくい。"},{"text":"光の照射方向に熱をほとんど発しないため、生鮮食料品の劣化を助長しない。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63864","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-17","season":"R3_late","no":17,"sectionId":"setsu","field":"建築設備等","topicName":"建築設備","topic":null,"body":"建築設備とそれに関連する用語の組合せとして、最も関係の少ないものはどれか。","bodyImgs":[],"choices":[{"text":"給水設備 ――― バキュームブレーカー"},{"text":"排水設備 ――― 通気管"},{"text":"ガス設備 ――― マイコンメーター"},{"text":"空気調和設備 ― バスダクト"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63865","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-18","season":"R3_late","no":18,"sectionId":"seko","field":"建築施工","topicName":"墨出し・遣方","topic":"t18","body":"遣方及び墨出しに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ベンチマークは、移動するおそれのない既存の工作物に2箇所設けた。"},{"text":"2階より上階における高さの基準墨は、墨の引通しにより、順次下階の墨を上げた。"},{"text":"水貫は、水杭に示した一定の高さに上端を合わせて、水杭に水平に取り付けた。"},{"text":"鋼製巻尺は、同じ精度を有する巻尺を2本以上用意して、1本は基準巻尺として保管した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63866","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-19","season":"R3_late","no":19,"sectionId":"seko","field":"建築施工","topicName":"地業工事","topic":"t19","body":"地業工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"土間コンクリートに設ける防湿層のポリエチレンフィルムは、砂利地業の直下に敷き込んだ。"},{"text":"砂利地業の締固めによるくぼみが生じた場合は、砂利を補充して表面を平らにした。"},{"text":"砂利地業に、砕砂と砕石の混合した切込砕石を使用した。"},{"text":"捨てコンクリート地業は、基礎スラブ及び基礎梁のセメントペーストの流出等を防ぐために行った。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63867","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-20","season":"R3_late","no":20,"sectionId":"seko","field":"建築施工","topicName":"型枠工事","topic":"t22","body":"型枠工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"内柱の型枠の加工長さは、階高からスラブ厚さとスラブ用合板せき板の厚さを減じた寸法とした。"},{"text":"柱型枠の足元は、型枠の変形防止やセメントペーストの漏出防止等のため、桟木で根巻きを行った。"},{"text":"壁の窓開口部下部の型枠に、コンクリートの盛り上がりを防ぐため、端部にふたを設けた。"},{"text":"床型枠用鋼製デッキプレート（フラットデッキ）を受ける梁の側型枠は、縦桟木で補強した。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63868","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-21","season":"R3_late","no":21,"sectionId":"seko","field":"建築施工","topicName":"型枠存置","topic":"t22","body":"型枠の最小存置期間に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"コンクリートの圧縮強度による場合、柱とスラブ下のせき板は同じである。"},{"text":"コンクリートの圧縮強度による場合、壁とはり側のせき板は同じである。"},{"text":"コンクリートの材齢による場合、柱と壁のせき板は同じである。"},{"text":"コンクリートの材齢による場合、基礎と壁のせき板は同じである。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63869","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-22","season":"R3_late","no":22,"sectionId":"seko","field":"建築施工","topicName":"高力ボルト接合","topic":null,"body":"高力ボルト接合に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ナット側の座金は、座金の内側面取り部がナットに接する側に取り付ける。"},{"text":"高力ボルト接合部のフィラープレートは、両面とも摩擦面処理を行う。"},{"text":"摩擦面の錆の発生状態は、自然発錆による場合、鋼材の表面が一様に赤く見える程度とする。"},{"text":"ボルトの締付けは、ボルト群ごとに継手の周辺部より中央に向かう順序で行う。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63870","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-23","season":"R3_late","no":23,"sectionId":"seko","field":"建築施工","topicName":"防水工事","topic":"t23","body":"加硫ゴム系シート防水接着工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"プライマーを塗布する範囲は、その日にシートを張り付ける範囲とした。"},{"text":"下地への接着剤の塗布は、プライマーの乾燥後に行った。"},{"text":"シートは、接着剤を塗布後、オープンタイムを置かずに張り付けた。"},{"text":"仕上塗料塗りは、美観と保護を目的に行った。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63871","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-24","season":"R3_late","no":24,"sectionId":"seko","field":"建築施工","topicName":"折板葺","topic":null,"body":"金属製折板葺の工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"嵌合形折板は、折板を仮葺せずに本締めを行う。"},{"text":"はぜ締め形折板は、本締めの前にタイトフレームの間を1m程度の間隔で部分締めを行う。"},{"text":"けらばの変形防止材には、折板の3山ピッチ以上の長さのものを用いる。"},{"text":"タイトフレームと下地材との接合は、スポット溶接とする。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63872","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-25","season":"R3_late","no":25,"sectionId":"seko","field":"建築施工","topicName":"モルタル塗り","topic":null,"body":"コンクリート壁下地のセメントモルタル塗りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"下塗り、中塗り、上塗りの各層の塗り厚は、6mm程度とした。"},{"text":"下塗りは、吸水調整材塗りの後、3時間経過後に行った。"},{"text":"下塗り用の砂は、ひび割れを防止するため、粒度が粗いA種の砂を用いた。"},{"text":"吸水調整材は、下地とモルタルの接着力を増強するため、厚膜となるように十分塗布した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63873","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-26","season":"R3_late","no":26,"sectionId":"seko","field":"建築施工","topicName":"建具工事","topic":null,"body":"建具金物に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"モノロックは、押しボタンやシリンダーが設けられており、内外の握り玉の同一線上で施解錠することができる。"},{"text":"ピボットヒンジは、床に埋め込まれる扉の自閉金物で、自閉速度を調整することができる。"},{"text":"空錠は、鍵を用いずに、ハンドルでラッチボルトを操作することができる。"},{"text":"本締り錠は、鍵又はサムターンでデッドボルトを操作することができる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63874","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-27","season":"R3_late","no":27,"sectionId":"seko","field":"建築施工","topicName":"せっこうボード張り","topic":null,"body":"壁のせっこうボード張りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ボードを突付けとせず隙間を開けて底目地を取る目透し工法で仕上げる壁は、スクエアエッジのボードを使用した。"},{"text":"鋼製下地に張り付ける場合のドリリングタッピンねじの頭は、仕上げ面の精度確保のため、ボード面と同面となるように締め込んだ。"},{"text":"鋼製下地に張り付ける場合のドリリングタッピンねじの留付け間隔は、ボードの中間部より周辺部を小さくした。"},{"text":"ボードの重ね張りは、上張りと下張りのジョイント位置が同位置にならないように行った。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63875","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-28","season":"R3_late","no":28,"sectionId":"seko","field":"建築施工","topicName":"改修工事","topic":null,"body":"外部仕上げ改修工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"既存防水層撤去後の下地コンクリート面の軽微なひび割れは、新規防水がアスファルト防水のため、アスファルト防水用シール材により補修した。"},{"text":"コンクリート下地面の複層仕上塗材の既存塗膜の劣化部は、高圧水洗工法にて除去した。"},{"text":"既存露出アスファルト防水層の上に、アスファルト防水熱工法にて改修するため、下地調整材としてポリマーセメントモルタルを用いた。"},{"text":"外壁石張り目地のシーリング材の劣化した部分を再充填工法にて改修するため、既存シーリング材を除去し、同種のシーリング材を充填した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63876","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-29","season":"R3_late","no":29,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"事前調査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"既製杭の打込みが予定されているため、近接する工作物や舗装の現況の調査を行うこととした。"},{"text":"掘削中に地下水を揚水するため、周辺の井戸の使用状況の調査を行うこととした。"},{"text":"工事予定の建物による電波障害に関する調査は済んでいたため、タワークレーン設置による影響の調査を省くこととした。"},{"text":"地中障害物を確認するため、過去の土地利用の履歴について調査を行うこととした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63877","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-30","season":"R3_late","no":30,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"規模が小さい作業所のため、守衛所を設けず、警備員だけを出入口に配置することとした。"},{"text":"作業員詰所は、職種数や作業員の増減に対応するため、大部屋方式とすることとした。"},{"text":"下小屋は、材料置場の近くに設置し、電力及び水道等の設備を設けることとした。"},{"text":"鋼板製仮囲いの下端には、雨水が流れ出やすいように隙間を設けることとした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63878","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-31","season":"R3_late","no":31,"sectionId":"kanri","field":"施工管理法","topicName":"材料の保管","topic":null,"body":"工事現場における材料の保管に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"アスファルトルーフィングは、屋内の乾燥した場所に平積みで保管する。"},{"text":"ALCパネルは、台木を水平に置いた上に平積みで保管する。"},{"text":"巻いた壁紙は、くせが付かないように屋内に立てて保管する。"},{"text":"アルミニウム製建具は、平積みを避け、縦置きにして保管する。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63879","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-32","season":"R3_late","no":32,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"工程計画の立案段階で考慮すべき事項として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"敷地周辺の上下水道やガス等の公共埋設物を把握する。"},{"text":"敷地内の既存埋設物の状況を把握する。"},{"text":"全ての工種別の施工組織体系を把握する。"},{"text":"敷地における騒音及び振動に関する法的規制を把握する。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63880","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-33","season":"R3_late","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"バーチャート/ネットワーク工程表","topic":"t29","body":"バーチャート工程表に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"縦軸に工事項目を、横軸に月日を示し、各作業の開始から終了までを横線で表したものである。"},{"text":"主要な工事の節目をマイルストーンとして工程表に付加すると、工程の進捗状況が把握しやすくなる。"},{"text":"各作業の相互関係が表されていないため、工期に影響する作業がどれであるか掴みにくい。"},{"text":"工程表に示す作業を増やしたり、作業を細分化すると、工程の内容が把握しやすくなる。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63881","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-34","season":"R3_late","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"施工品質管理表（QC工程表）の作成に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工種別又は部位別に作成する。"},{"text":"管理項目は、目指す品質に直接関係している要因から取りあげる。"},{"text":"管理項目は、品質に関する重要度の高い順に並べる。"},{"text":"管理項目ごとに、管理担当者の分担を明確にする。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63882","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-35","season":"R3_late","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"トルシア形ボルト","topic":null,"body":"トルシア形高力ボルトの1次締め後に行うマーキングに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"マークのずれによって、軸回りの有無を確認できる。"},{"text":"マークのずれによって、トルク値を確認できる。"},{"text":"マークのずれによって、ナットの回転量を確認できる。"},{"text":"マークのずれによって、共回りの有無を確認できる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63883","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-36","season":"R3_late","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"コンクリート試験・受入","topic":"t21","body":"コンクリートの試験に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"フレッシュコンクリートの温度測定は、その結果を1℃単位で表示する。"},{"text":"圧縮強度の試験は、コンクリート打込み日ごと、打込み工区ごと、かつ、150m3以下にほぼ均等に分割した単位ごとに行う。"},{"text":"スランプ試験は、1cm単位で測定する。"},{"text":"スランプ試験時に使用するスランプコーンの高さは、300mmとする。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63884","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-37","season":"R3_late","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"危害・迷惑対策","topic":null,"body":"建築工事における危害又は迷惑と、それを防止するための対策の組合せとして、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"投下によるくずやごみの飛散 ―― ダストシュートの設置"},{"text":"工事用車両による道路の汚れ ―― 沈砂槽の設置"},{"text":"高所作業による工具等の落下 ―― 水平安全ネットの設置"},{"text":"解体工事による粉塵の飛散 ――― 散水設備の設置"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63885","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-38","season":"R3_late","no":38,"sectionId":"kanri","field":"施工管理法","topicName":"安全管理","topic":"t31","body":"特定元方事業者が行うべき安全管理に関する記述として、「労働安全衛生法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"毎作業日に、作業場所を巡視すること。"},{"text":"足場の組立て作業において、材料の欠点の有無を点検し、不良品を取り除くこと。"},{"text":"関係請負人が行う安全教育に対して、安全教育に使用する資料を提供すること。"},{"text":"クレーン等の運転についての合図を統一的に定めること。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63886","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-39","season":"R3_late","no":39,"sectionId":"ability","field":"施工管理法","topicName":"鉄筋の加工・組立","topic":"t20","body":"鉄筋の加工及び組立てに関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"鉄筋の折曲げ加工は、常温で行う。"},{"text":"壁筋は、鉄筋相互の交点の半数以上を結束する。"},{"text":"鉄筋相互のあきの最小寸法は、鉄筋の強度によって決まる。"},{"text":"鉄筋末端部のフックの余長の最小寸法は、折曲げ角度が大きいほど長くなる。"}],"answer":[3,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63887","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-40","season":"R3_late","no":40,"sectionId":"ability","field":"施工管理法","topicName":"木造在来軸組","topic":"t8","body":"在来軸組構法における木工事に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"土台を固定するアンカーボルトは、土台の両端部や継手の位置、耐力壁の両端の柱に近接した位置に設置した。"},{"text":"根太の継手は、大引の心を避けて突付け継ぎとし、釘打ちとした。"},{"text":"火打梁は、柱と梁との鉛直構面の隅角部に斜めに入れた。"},{"text":"内装下地や造作部材の取付けは、屋根葺き工事が終わった後に行った。"}],"answer":[2,3],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63888","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-41","season":"R3_late","no":41,"sectionId":"ability","field":"施工管理法","topicName":"タイル張り工事","topic":"t24","body":"セメントモルタルによるタイル後張り工法に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"密着張りにおいて、タイルの張付けは、下部から上部にタイルを張った。"},{"text":"改良積上げ張りにおいて、小口タイルの張付けは、1日の張付け高さを1.5mとした。"},{"text":"モザイクタイル張りのたたき押えは、紙張りの目地部分がモルタルの水分で濡れてくるまで行った。"},{"text":"改良圧着張りにおいて、張付けモルタルの1回に塗り付ける面積は、タイル工1人当たり3m2とした。"}],"answer":[1,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63889","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-42","season":"R3_late","no":42,"sectionId":"ability","field":"施工管理法","topicName":"塗装工事","topic":"t25","body":"塗装工事に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"強溶剤系塗料のローラーブラシ塗りに、モヘアのローラーブラシを用いた。"},{"text":"オイルステイン塗りの色濃度の調整は、シンナーによって行った。"},{"text":"モルタル面の塗装に、合成樹脂調合ペイントを用いた。"},{"text":"壁面をローラーブラシ塗りとする際、隅やちり回りなどは、小刷毛を用いて先に塗布した。"}],"answer":[1,3],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63890","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-43","season":"R3_late","no":43,"sectionId":"hoki","field":"法規","topicName":"用語の定義","topic":"t32","body":"用語の定義に関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"設計者とは、その者の責任において、設計図書を作成した者をいう。"},{"text":"コンビニエンスストアは、特殊建築物ではない。"},{"text":"建築物に関する工事用の仕様書は、設計図書である。"},{"text":"駅のプラットホームの上家は、建築物ではない。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63891","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-44","season":"R3_late","no":44,"sectionId":"hoki","field":"法規","topicName":"地上階にある次の居室のうち","topic":null,"body":"地上階にある次の居室のうち、「建築基準法」上、原則として、採光のための窓その他の開口部を設けなくてよいものはどれか。","bodyImgs":[],"choices":[{"text":"病院の診察室"},{"text":"寄宿舎の寝室"},{"text":"有料老人ホームの入所者用談話室"},{"text":"保育所の保育室"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63892","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-45","season":"R3_late","no":45,"sectionId":"hoki","field":"法規","topicName":"建設業の許可","topic":"t34","body":"建設業の許可に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"解体工事業で一般建設業の許可を受けている者は、発注者から直接請け負う1件の建設工事の下請代金の総額が4,000万円の下請契約をすることができない。"},{"text":"建築工事業で一般建設業の許可を受けている者は、発注者から直接請け負う1件の建設工事の下請代金の総額が6,000万円の下請契約をすることができない。"},{"text":"建設業を営もうとする者は、すべて、建設業の許可を受けなければならない。"},{"text":"建設業の許可を受けようとする者は、営業所の名称及び所在地を記載した許可申請書を国土交通大臣又は都道府県知事に提出しなければならない。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":["mergedFallback","override"],"src":{"text":"merged:No.44","answer":"answers/R3_late_answers.csv"},"lawRevised":true,"overrideNote":"過去問ドットコムに未収録(法改正で削除)。PDF由来本文の『T建設業法U』(かぎ括弧の文字化け)と欠落数字『1件』を手動修復。正答は公式CSV(3)。"},{"id":"R3_late-46","season":"R3_late","no":46,"sectionId":"hoki","field":"法規","topicName":"建設業 請負契約","topic":"t34","body":"建設工事の請負契約書に記載しなければならない事項として、「建設業法」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"工事内容及び請負代金の額"},{"text":"工事の履行に必要となる建設業の許可の種類及び許可番号"},{"text":"各当事者の履行の遅滞その他債務の不履行の場合における遅延利息、違約金その他の損害金"},{"text":"請負代金の全部又は一部の前金払の定めをするときは、その支払いの時期及び方法"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63894","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-47","season":"R3_late","no":47,"sectionId":"hoki","field":"法規","topicName":"労働基準法","topic":"t35","body":"労働契約に関する記述として、「労働基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"使用者は、労働することを条件とする前貸の債権と賃金を相殺することができる。"},{"text":"労働者は、使用者より明示された労働条件が事実と相違する場合においては、即時に労働契約を解除することができる。"},{"text":"使用者は、労働者が業務上の傷病の療養のために休業する期間及びその後30日間は、原則として解雇してはならない。"},{"text":"労働条件は、労働者と使用者が、対等の立場において決定すべきものである。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63895","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-48","season":"R3_late","no":48,"sectionId":"hoki","field":"法規","topicName":"労働安全衛生(届出等)","topic":"t35","body":"事業者が、新たに職務に就くことになった職長に対して行う安全衛生教育に関する事項として、「労働安全衛生法」上、定められていないものはどれか。ただし、作業主任者を除くものとする。","bodyImgs":[],"choices":[{"text":"労働者の配置に関すること"},{"text":"異常時等における措置に関すること"},{"text":"危険性又は有害性等の調査に関すること"},{"text":"作業環境測定の実施に関すること"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63896","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-49","season":"R3_late","no":49,"sectionId":"hoki","field":"法規","topicName":"次の記述のうち、T廃棄","topic":null,"body":"次の記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"工作物の新築に伴って生じた紙くずは、一般廃棄物である。"},{"text":"建設工事の現場事務所から排出された新聞、雑誌等は、一般廃棄物である。"},{"text":"工作物の除去に伴って生じたコンクリートの破片は、産業廃棄物である。"},{"text":"工作物の新築に伴って生じたゴムくずは、産業廃棄物である。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63897","answer":"answers/R3_late_answers.csv"}},{"id":"R3_late-50","season":"R3_late","no":50,"sectionId":"hoki","field":"法規","topicName":"消防法","topic":null,"body":"消防用設備等の種類と機械器具又は設備の組合せとして、「消防法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"警報設備 ― 自動火災報知設備"},{"text":"避難設備 ― 救助袋"},{"text":"消火設備 ― 連結散水設備"},{"text":"消防用水 ― 防火水槽"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:63898","answer":"answers/R3_late_answers.csv"}},{"id":"R4_early-1","season":"R4_early","no":1,"sectionId":"gaku","field":"建築学","topicName":"換気","topic":"t1","body":"換気に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"全般換気方式は、室内全体の空気を外気によって希釈しながら入れ替える換気のことである。"},{"text":"局所換気方式は、局所的に発生する汚染物質を発生源近くで捕集して排出する換気のことである。"},{"text":"第1種機械換気方式は、映画館や劇場等外気から遮断された大きな空間の換気に適している。"},{"text":"第2種機械換気方式は、室内で発生した汚染物質が他室に漏れてはならない室の換気に適している。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66246","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-2","season":"R4_early","no":2,"sectionId":"gaku","field":"建築学","topicName":"採光・照明・日射","topic":"t3","body":"採光及び照明に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"輝度は、光源からある方向への光度を、その方向への光源の見かけの面積で除した値をいう。"},{"text":"昼光率は、全天空照度に対する室内のある点の天空光による照度の割合である。"},{"text":"光源の色温度が低いほど青みがかった光に見え、高いほど赤みがかった光に見える。"},{"text":"照度の均斉度が高いほど、室内の照度分布は均一になる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66247","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-3","season":"R4_early","no":3,"sectionId":"gaku","field":"建築学","topicName":"音","topic":"t4","body":"音に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"吸音率は、壁面に入射した音のエネルギーに対する吸収された音のエネルギーの割合である。"},{"text":"正対する反射性の高い壁面が一組だけ存在する室内では、フラッターエコーが発生しやすい。"},{"text":"窓や壁体の音響透過損失が大きいほど、遮音性能は高い。"},{"text":"材料が同じ単層壁の場合、壁の厚さが厚いほど、一般に音響透過損失は大きくなる。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66248","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-4","season":"R4_early","no":4,"sectionId":"gaku","field":"建築学","topicName":"RC構造","topic":"t6","body":"鉄筋コンクリート構造に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"大梁は、曲げ破壊よりもせん断破壊を先行するように設計する。"},{"text":"柱は、軸方向の圧縮力、曲げモーメント及びせん断力に耐えられるように設計する。"},{"text":"床スラブの厚さは、8cm以上で設計する。"},{"text":"耐力壁の厚さは、12cm以上で設計する。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66249","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-5","season":"R4_early","no":5,"sectionId":"gaku","field":"建築学","topicName":"鉄骨構造","topic":"t7","body":"鉄骨構造に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"圧縮材は、細長比が小さいものほど座屈しやすい。"},{"text":"軽量鉄骨構造に用いる軽量形鋼は、通常の形鋼に比べ、部材にねじれや局部座屈が生じやすい。"},{"text":"鉄骨構造の柱は、鉄筋コンクリート構造の柱に比べ、小さな断面で大きな荷重に耐えることができる。"},{"text":"大空間を必要とする建築物に用いる長大な梁は、軽量化を図るためにトラス梁とすることが多い。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66250","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-6","season":"R4_early","no":6,"sectionId":"gaku","field":"建築学","topicName":"鉄骨構造","topic":"t7","body":"鉄骨構造に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"フィラープレートは、厚さの異なる板をボルト接合する際に、板厚の差による隙間を少なくするために設ける部材である。"},{"text":"添え板（スプライスプレート）は、梁のウェブの座屈防止のために設ける補強材である。"},{"text":"柱の形式には、形鋼等の単一材を用いた柱のほか、溶接組立箱形断面柱等の組立柱がある。"},{"text":"合成梁に用いる頭付きスタッドは、鉄骨梁と鉄筋コンクリート床スラブが一体となるように設ける部材である。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66251","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-7","season":"R4_early","no":7,"sectionId":"gaku","field":"建築学","topicName":"基礎・地盤","topic":"t9","body":"基礎構造に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"べた基礎は、地盤が軟弱で、独立基礎の底面が著しく広くなる場合に用いられる。"},{"text":"杭基礎は、一般に直接基礎で建築物自体の荷重を支えられない場合に用いられる。"},{"text":"同一建築物に杭基礎と直接基礎等、異種の基礎を併用することは、なるべく避ける。"},{"text":"直接基礎の底面は、冬季の地下凍結深度より浅くする。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66252","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-8","season":"R4_early","no":8,"sectionId":"gaku","field":"建築学","topicName":"鋼材の性質","topic":"t11","body":"構造材料の力学的性質に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"部材の材軸方向に圧縮力が生じているとき、その力がある限界を超えると、その部材が安定を失って曲がる現象を座屈という。"},{"text":"ヤング係数は、熱による材料の単位長さ当たりの膨張長さの割合である。"},{"text":"ポアソン比とは、一方向の垂直応力によって材料に生じる縦ひずみと、これに対する横ひずみの比をいう。"},{"text":"座屈荷重は、座屈軸まわりの断面二次モーメントに比例する。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66253","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-9","season":"R4_early","no":9,"sectionId":"gaku","field":"建築学","topicName":"図に示す単純梁ABに","topic":null,"body":"図に示す単純梁ABに集中荷重P1及びP2が作用するとき、CD間に作用するせん断力の値の大きさとして、正しいものはどれか。","bodyImgs":["exam_img/R4_early/q9.png"],"choices":[{"text":"1kN"},{"text":"3kN"},{"text":"4kN"},{"text":"5kN"}],"answer":[1],"answerMode":"single","hasImage":true,"verified":true,"flags":[],"src":{"text":"kakomonn:66254","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-10","season":"R4_early","no":10,"sectionId":"gaku","field":"建築学","topicName":null,"topic":null,"body":"図に示す片持ち梁ABの点Cに曲げモーメントMが作用する場合の曲げモーメント図として、正しいものはどれか。ただし、曲げモーメントは、材の引張側に描くものとする。","bodyImgs":["exam_img/R4_early/q10.png"],"choices":[{"img":"exam_img/R4_early/a10_1.png"},{"img":"exam_img/R4_early/a10_2.png"},{"img":"exam_img/R4_early/a10_3.png"},{"img":"exam_img/R4_early/a10_4.png"}],"answer":[2],"answerMode":"single","hasImage":true,"verified":true,"flags":[],"src":{"text":"kakomonn:66255","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-11","season":"R4_early","no":11,"sectionId":"gaku","field":"建築学","topicName":"鋼材の性質","topic":"t11","body":"鋼の一般的な性質に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"弾性限度内であれば、引張荷重を取り除くと元の状態に戻る。"},{"text":"炭素含有量が多くなると、溶接性は向上する。"},{"text":"熱処理によって、強度等の機械的性質を変化させることができる。"},{"text":"空気中で酸化し、錆を生じるため、防食を施す必要がある。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66256","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-12","season":"R4_early","no":12,"sectionId":"gaku","field":"建築学","topicName":"日本産業規格（JIS）に規","topic":null,"body":"日本産業規格（JIS）に規定する建具の性能試験における性能項目に関する記述として、不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"防火性とは、火災時の延焼防止の程度をいう。"},{"text":"面内変形追随性とは、地震によって生じる面内変形に追随し得る程度をいう。"},{"text":"水密性とは、風雨による建具室内側への水の浸入を防ぐ程度をいう。"},{"text":"遮熱性とは、熱の移動を抑える程度をいう。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66257","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-13","season":"R4_early","no":13,"sectionId":"gaku","field":"建築学","topicName":"シーリング材の特徴","topic":"t14","body":"シーリング材の特徴に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ポリウレタン系シーリング材は、紫外線によって黄変することがある。"},{"text":"ポリサルファイド系シーリング材は、表面に塗った塗料を変色させることがある。"},{"text":"シリコーン系シーリング材は、表面への塗料の付着性がよい。"},{"text":"アクリル系シーリング材は、未硬化の状態では水に弱く、雨に流されやすい。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66258","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-14","season":"R4_early","no":14,"sectionId":"gaku","field":"建築学","topicName":"内装材料・ボード","topic":null,"body":"内装材料に関する一般的な記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"インシュレーションボードは、断熱性に優れている。"},{"text":"ロックウール化粧吸音板は、吸音性、耐水性に優れている。"},{"text":"フレキシブル板は、セメント、無機質繊維を主原料とし、成形後に高圧プレスをかけた"},{"text":"せっこうボードは、せっこうを心材として両面をボード用原紙で被覆して成形したものである。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66259","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-15","season":"R4_early","no":15,"sectionId":"setsu","field":"建築設備等","topicName":"給排水設備","topic":"t15","body":"屋外排水工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"地中埋設排水管の勾配は、原則として、1／100以上とする。"},{"text":"硬質ポリ塩化ビニル管をコンクリート桝に接合する部分は、砂付きの桝取付け短管を用いる。"},{"text":"遠心力鉄筋コンクリート管のソケット管は、受口を下流に向けて敷設する。"},{"text":"雨水桝に接合する配管は、流入配管を上にして流出配管とは20mm程度の管底差をつける。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66260","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-16","season":"R4_early","no":16,"sectionId":"setsu","field":"建築設備等","topicName":"自動火災報知設備","topic":null,"body":"建築物に設ける自動火災報知設備の感知器として、最も関係の少ないものはどれか。","bodyImgs":[],"choices":[{"text":"熱感知器"},{"text":"煙感知器"},{"text":"炎感知器"},{"text":"地震感知器"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66261","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-17","season":"R4_early","no":17,"sectionId":"setsu","field":"建築設備等","topicName":"空気調和設備","topic":"t16","body":"空気調和設備に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"パッケージユニット方式は、機械室、配管、ダクト等のスペースが少なくてすむ。"},{"text":"ファンコイルユニット方式は、ユニットごとの温度調節はできない。"},{"text":"二重ダクト方式は、別々の部屋で同時に冷房と暖房を行うことができる。"},{"text":"単一ダクト方式は、主機械室の空気調和機から各室まで、一系統のダクトで冷風又は温風を送るものである。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66262","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-18","season":"R4_early","no":18,"sectionId":"seko","field":"建築施工","topicName":"墨出し・遣方","topic":"t18","body":"墨出し等に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"陸墨を柱主筋に移す作業は、台直し等を終え、柱主筋が安定した後に行った。"},{"text":"建物の位置を確認するための縄張りは、配置図に従ってロープを張り巡らせた。"},{"text":"通り心の墨打ちができないため、通り心より1m離れたところに逃げ墨を設け、基準墨とした。"},{"text":"建物四隅の基準墨の交点を上階に移す際、2点を下げ振りで移し、他の2点はセオドライトで求めた。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66263","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-19","season":"R4_early","no":19,"sectionId":"seko","field":"建築施工","topicName":"既製コンクリート杭工事","topic":"t19","body":"既製コンクリート杭工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"中掘り根固め工法は、杭の中空部に挿入したアースオーガーで掘削しながら杭を設置した後、根固め液を注入する工法である。"},{"text":"プレボーリング拡大根固め工法のアースオーガーの引上げ速度は、孔壁の崩壊が生じないように、速くする。"},{"text":"プレボーリング拡大根固め工法の杭周固定液は、杭と周囲の地盤との摩擦力を確保するために使用する。"},{"text":"セメントミルク工法において、支持地盤への到達の確認は、アースオーガーの駆動用電動機の電流値の変化により行う。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66264","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-20","season":"R4_early","no":20,"sectionId":"seko","field":"建築施工","topicName":"型枠支保工","topic":"t22","body":"型枠支保工に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"階段の斜めスラブ部分の支柱は、脚部にキャンバーを用い、斜めスラブに対して直角に建て込む。"},{"text":"支柱にパイプサポートを使用する場合、継手は差込み継手としてはならない。"},{"text":"柱、壁及び梁側型枠のせき板を保持する場合、支保工は一般に内端太及び外端太により構成する。"},{"text":"パイプサポートに水平つなぎを設ける場合、根がらみクランプ等を用いて緊結しなければならない。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66265","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-21","season":"R4_early","no":21,"sectionId":"seko","field":"建築施工","topicName":"コンクリートの養生","topic":"t21","body":"コンクリートの養生に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"打込み後の養生温度が高いほど、長期材齢における強度増進性が大きくなる。"},{"text":"湿潤養生期間は、早強ポルトランドセメントを用いた場合、普通ポルトランドセメントより短くできる。"},{"text":"打込み後、直射日光等による急速な乾燥を防ぐための湿潤養生を行う。"},{"text":"打込み後、少なくとも1日間はそのコンクリートの上で歩行又は作業をしないようにする。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66266","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-22","season":"R4_early","no":22,"sectionId":"seko","field":"建築施工","topicName":"木造在来軸組","topic":"t8","body":"在来軸組構法における木工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"土台の継手は腰掛けあり継ぎとし、継手付近の下木をアンカーボルトで締め付けた。"},{"text":"和小屋組の棟木や母屋には、垂木を取り付けるため、垂木当たり欠きを行った。"},{"text":"隅通し柱の仕口は土台へ扇ほぞ差しとし、ホールダウン金物を用いてボルトで締め付けた。"},{"text":"床束の転倒やずれを防止するため、床束の相互間に根がらみ貫を釘で打ち付けた。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66267","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-23","season":"R4_early","no":23,"sectionId":"seko","field":"建築施工","topicName":"花崗岩の表面仕上げ","topic":null,"body":"花崗岩の表面仕上げに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"びしゃん仕上げとは、石材表面を多数の格子状突起をもつハンマーでたたいた仕上げをいう。"},{"text":"小たたき仕上げとは、びしゃんでたたいた後、先端がくさび状のハンマーで平行線状に平坦な粗面を作る仕上げをいう。"},{"text":"ジェットバーナー仕上げとは、超高圧水で石材表面を切削して粗面とした仕上げをいう。"},{"text":"ブラスト仕上げとは、石材表面に鋼鉄の粒子等を圧縮空気でたたきつけて粗面とした仕上げをいう。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66268","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-24","season":"R4_early","no":24,"sectionId":"seko","field":"建築施工","topicName":"給排水設備","topic":"t15","body":"とい工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鋼板製谷どいの継手部は、シーリング材を入れ60mm重ね合わせて、リベットで留め付けた。"},{"text":"硬質塩化ビニル製縦どいは、継いだ長さが10mを超えるため、エキスパンション継手を設けた。"},{"text":"鋼板製丸縦どいの長さ方向の継手は、下の縦どいを上の縦どいの中に差し込んで継いだ。"},{"text":"硬質塩化ビニル製軒どいは、とい受け金物に金属線で取り付けた。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66269","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-25","season":"R4_early","no":25,"sectionId":"seko","field":"建築施工","topicName":"床コンクリートの直均し仕上げ","topic":null,"body":"床コンクリートの直均し仕上げに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"床仕上げレベルを確認できるガイドレールは、床コンクリートを打ち込んだ後に4m間隔で設置した。"},{"text":"コンクリート面を指で押しても少ししか入らない程度になった時に、木ごてで中むら取りを行った。"},{"text":"金ごて仕上げの中ずりで、ブリーディングが多かったため、金ごての代わりに木ごてを用いた。"},{"text":"最終こて押えの後、12時間程度を経てから、散水養生を行った。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66270","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-26","season":"R4_early","no":26,"sectionId":"seko","field":"建築施工","topicName":"建具工事","topic":null,"body":"建具工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"アルミニウム製建具のアルミニウムに接する小ねじは、亜鉛めっき処理した鋼製のものを使用した。"},{"text":"ステンレス製建具のステンレスに接する鋼製の重要な補強材は、錆止め塗装をした。"},{"text":"木製フラッシュ戸の中骨は、杉のむく材を使用した。"},{"text":"樹脂製建具は、建具の加工及び組立てからガラスの組込みまでを建具製作所で行った。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66271","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-27","season":"R4_early","no":27,"sectionId":"seko","field":"建築施工","topicName":"床仕上(カーペット・フローリング)","topic":null,"body":"カーペット敷きに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"タイルカーペットは、粘着はく離形の接着剤を用いて張り付けた。"},{"text":"タイルカーペットは、フリーアクセスフロアのパネル目地とずらして割り付けた。"},{"text":"グリッパー工法に用いるグリッパーは、壁に密着させて取り付けた。"},{"text":"グリッパー工法に用いる下敷き用フェルトは、グリッパーよりやや厚いものとした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66272","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-28","season":"R4_early","no":28,"sectionId":"seko","field":"建築施工","topicName":"改修工事","topic":null,"body":"内装改修工事における既存床仕上材の除去に関する記述として、最も不適当なものはどれか。ただし、除去する資材は、アスベストを含まないものとする。","bodyImgs":[],"choices":[{"text":"ビニル床シートの除去は、カッターで切断し、スクレーパーを用いて他の仕上材に損傷を与えないように行った。"},{"text":"モルタル下地の合成樹脂塗床は、電動斫り器具を用いてモルタル下地とも除去した。"},{"text":"根太張り工法の単層フローリングボードは、丸のこを用いて根太下地を損傷しないように切断し、除去した。"},{"text":"モルタル下地の磁器質床タイルの張替え部は、斫りのみを用いて手作業で存置部分と縁切りをした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66273","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-29","season":"R4_early","no":29,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"事前調査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"敷地内の排水工事に先立ち、排水管の勾配が公設桝まで確保できるか調査を行うこととした。"},{"text":"杭工事に先立ち、騒音規制及び振動規制と、近隣への影響の調査を行うこととした。"},{"text":"山留め工事に先立ち、設計時の地盤調査が不十分であったため、試掘調査を行うこととした。"},{"text":"鉄骨工事の建方に先立ち、日影による近隣への影響の調査を行うこととした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66274","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-30","season":"R4_early","no":30,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"騒音、塵埃、飛沫等の近隣への影響を抑制するため、仮囲いを設けることとした。"},{"text":"施工者用事務所と監理者用事務所は、機能が異なるため、それぞれ分けて設けることとした。"},{"text":"ハンガー式門扉は、扉を吊る梁が車両の積荷高さを制約する場合があるため、有効高さを検討することとした。"},{"text":"酸素やアセチレン等のボンベ類の貯蔵小屋は、ガスが外部に漏れないよう、密閉構造とすることとした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66275","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-31","season":"R4_early","no":31,"sectionId":"kanri","field":"施工管理法","topicName":"材料の保管","topic":null,"body":"工事現場における材料の保管に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"袋詰めセメントは、風通しのよい倉庫に保管した。"},{"text":"型枠用合板は、直射日光が当たらないよう、シートを掛けて保管した。"},{"text":"長尺のビニル床シートは、屋内の乾燥した場所に縦置きにして保管した。"},{"text":"鉄筋は、直接地面に接しないように角材間に渡し置き、シートを掛けて保管した。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66276","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-32","season":"R4_early","no":32,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"総合工程表の立案に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"上下階で輻輳する作業では、資材運搬、機器移動等の動線が錯綜しないように計画する。"},{"text":"鉄骨工事の工程計画では、建方時期に合わせた材料調達、工場製作期間を検討する。"},{"text":"工区分割を行い、後続作業を並行して始めることにより、工期短縮が可能か検討する。"},{"text":"工程計画上のマイルストーン（管理日）は、工程上の重要な区切りを避けて計画する。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66277","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-33","season":"R4_early","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"バーチャート/ネットワーク工程表","topic":"t29","body":"バーチャート工程表に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工事全体を掌握することが容易で、作成しやすい。"},{"text":"クリティカルパスが把握しやすい。"},{"text":"各作業の全体工期に与える影響度が把握しにくい。"},{"text":"各工事間の細かい作業工程の関連性が把握しにくい。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66278","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-34","season":"R4_early","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"品質管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工程間検査は、作業工程の途中で、ある工程から次の工程に移ってもよいかどうかを判定するために行う。"},{"text":"品質管理は、作業そのものを適切に実施するプロセス管理に重点を置くより、試験や検査に重点を置くほうが有効である。"},{"text":"品質管理とは、施工計画書に基づいて工事のあらゆる段階で問題点や改善方法等を見出しながら、合理的、かつ、経済的に施工を行うことである。"},{"text":"施工の検査に伴う試験は、試験によらなければ品質及び性能を証明できない場合に行う。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66279","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-35","season":"R4_early","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"品質管理のための試験及び検査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"木工事において、造作用木材の含水率の確認は、高周波水分計を用いて行った。"},{"text":"地業工事において、支持地盤の地耐力の確認は、平板載荷試験によって行った。"},{"text":"鉄筋工事において、鉄筋のガス圧接部の確認は、超音波探傷試験によって行った。"},{"text":"鉄骨工事において、隅肉溶接のサイズの確認は、マイクロメーターを用いて行った。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66280","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-36","season":"R4_early","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"コンクリート試験・受入","topic":"t21","body":"レディーミクストコンクリートの受入れ時において、検査及び確認を行わない項目はどれか。","bodyImgs":[],"choices":[{"text":"運搬時間"},{"text":"骨材の粒度"},{"text":"空気量"},{"text":"コンクリートの温度"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66281","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-37","season":"R4_early","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"安全管理","topic":"t31","body":"工事現場の安全管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"安全施工サイクルとは、施工の安全を図るため、毎日、毎週、毎月の基本的な実施事項を定型化し、継続的に実施する活動である。"},{"text":"新規入場者教育とは、新しく現場に入場した者に対して、作業所の方針、安全施工サイクルの具体的な内容、作業手順等を教育することである。"},{"text":"ゼロエミッションとは、作業に伴う危険性又は有害性に対し、作業グループが正しい行動を互いに確認し合う活動である。"},{"text":"リスクアセスメントとは、労働災害の要因となる危険性又は有害性を洗い出してリスクを見積もり、優先順位を定め、リスクの低減措置を検討することである。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66282","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-38","season":"R4_early","no":38,"sectionId":"kanri","field":"施工管理法","topicName":"足場","topic":"t31","body":"高さが2m以上の構造の足場の組立て等に関する事業者の講ずべき措置として、「労働安全衛生規則」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"組立て、解体又は変更の時期、範囲及び順序を当該作業に従事する労働者に周知させること。"},{"text":"組立て、解体又は変更の作業を行う区域内には、関係労働者以外の労働者の立入りを禁止すること。"},{"text":"作業の方法及び労働者の配置を決定し、作業の進行状況を監視すること。"},{"text":"材料、器具、工具等を上げ、又は下ろすときは、つり綱、つり袋等を労働者に使用させること。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66283","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-39","season":"R4_early","no":39,"sectionId":"ability","field":"施工管理法","topicName":"鉄筋の継手・定着","topic":"t20","body":"鉄筋の継手に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"鉄筋の継手には、重ね継手、圧接継手、機械式継手、溶接継手等がある。"},{"text":"重ね継手の長さは、コンクリートの設計基準強度にかかわらず同じである。"},{"text":"フック付き重ね継手の長さには、フック部分の長さを含める。"},{"text":"鉄筋の継手の位置は、原則として、構造部材における引張力の小さいところに設ける。"}],"answer":[2,3],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:66284","answer":"answers/R4_early_answers.csv"}},{"id":"R4_early-40","season":"R4_early","no":40,"sectionId":"ability","field":"施工管理法","topicName":"鉄骨建方","topic":null,"body":"鉄骨の建方に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"玉掛け用ワイヤロープでキンクしたものは、キンクを直してから使用した。"},{"text":"仮ボルトの本数は、強風や地震等の想定される外力に対して、接合部の安全性の検討を行って決定した。"},{"text":"油が付着している仮ボルトは、油を除去して使用した。"},{"text":"建方時に用いた仮ボルトを、本締めに用いるボルトとして使用した。"}],"answer":[1,4],"an y":"防水材料に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"シート防水には、合成ゴム系やプラスチック系のシートが用いられる。"},{"text":"網状アスファルトルーフィングは、天然又は有機合成繊維で作られた粗布にアスファルトを浸透、付着させたものである。"},{"text":"塗膜防水は、液状の樹脂が塗布後に硬化することで防水層を形成する。"},{"text":"砂付あなあきアスファルトルーフィングは、防水層と下地を密着させるために用いるものである。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68912","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-15","season":"R4_late","no":15,"sectionId":"setsu","field":"建築設備等","topicName":"測量","topic":"t17","body":"測量に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"水準測量は、地表面の高低差を求める測量で、レベル等を用いる。"},{"text":"角測量は、水平角と鉛直角を求める測量で、セオドライト等を用いる。"},{"text":"平板測量は、測点の距離と高さを間接的に求める測量で、標尺等を用いる。"},{"text":"距離測量は、2点間の距離を求める測量で、巻尺等を用いる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68913","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-16","season":"R4_late","no":16,"sectionId":"setsu","field":"建築設備等","topicName":"日本産業規格（JIS）に規","topic":null,"body":"日本産業規格（JIS）に規定する構内電気設備の名称とその配線用図記号の組合せとして、不適当なものはどれか。","bodyImgs":[],"choices":[{"img":"exam_img/R4_late/a16_1.png"},{"img":"exam_img/R4_late/a16_2.png"},{"img":"exam_img/R4_late/a16_3.png"},{"img":"exam_img/R4_late/a16_4.png"}],"answer":[4],"answerMode":"single","hasImage":true,"verified":true,"flags":[],"src":{"text":"kakomonn:68914","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-17","season":"R4_late","no":17,"sectionId":"setsu","field":"建築設備等","topicName":"給排水設備","topic":"t15","body":"給排水設備に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"水道直結直圧方式は、水道本管から分岐した水道引き込み管に増圧給水装置を直結し、建物各所に給水する方式である。"},{"text":"ウォーターハンマーとは、給水配管内の水流が急激に停止したとき、振動や衝撃音等が生じる現象をいう。"},{"text":"公共下水道の排水方式には、汚水と雨水を同一系統で排除する合流式と、別々の系統で排除する分流式がある。"},{"text":"排水トラップの破封を防止するため、排水系統に通気管を設ける。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68915","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-18","season":"R4_late","no":18,"sectionId":"seko","field":"建築施工","topicName":"土工事・埋戻し","topic":null,"body":"土工事の埋戻し及び締固めに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"埋戻し土に粘性土を用いるため、余盛りの量を砂質土を用いる場合より多くした。"},{"text":"埋戻し土は、最適含水比に近い状態で締め固めた。"},{"text":"入隅等狭い箇所での締固めを行うため、振動コンパクターを使用した。"},{"text":"動的荷重による締固めを行うため、重量のあるロードローラーを使用した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68916","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-19","season":"R4_late","no":19,"sectionId":"seko","field":"建築施工","topicName":"鉄筋のかぶり厚","topic":"t20","body":"鉄筋のかぶり厚さに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"杭基礎におけるベース筋の最小かぶり厚さは、杭頭から確保する。"},{"text":"腹筋を外付けするときの大梁の最小かぶり厚さは、幅止め筋の外側表面から確保する。"},{"text":"直接土に接する梁と布基礎の立上り部の最小かぶり厚さは、ともに30mmとする。"},{"text":"屋内では、柱と耐力壁の最小かぶり厚さは、ともに30mmとする。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68917","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-20","season":"R4_late","no":20,"sectionId":"seko","field":"建築施工","topicName":"型枠工事","topic":"t22","body":"型枠工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"梁の側型枠の寸法をスラブ下の梁せいとし、取り付く底型枠の寸法を梁幅で加工した。"},{"text":"柱型枠は、梁型枠や壁型枠を取り付ける前にチェーン等で控えを取り、変形しないようにした。"},{"text":"外周梁の側型枠の上部は、コンクリートの側圧による変形防止のため、スラブ引き金物で固定した。"},{"text":"階段が取り付く壁型枠は、敷き並べた型枠パネル上に現寸で墨出しをしてから加工した。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68918","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-21","season":"R4_late","no":21,"sectionId":"seko","field":"建築施工","topicName":"コンクリートの調合","topic":"t21","body":"コンクリートの調合に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"細骨材率は、乾燥収縮によるひび割れを少なくするためには、高くする。"},{"text":"単位セメント量は、水和熱及び乾燥収縮によるひび割れを防止する観点からは、できるだけ少なくする。"},{"text":"AE減水剤を用いると、所定のスランプを得るのに必要な単位水量を減らすことができる。"},{"text":"川砂利と砕石は、それぞれが所定の品質を満足していれば、混合して使用してもよい。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68919","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-22","season":"R4_late","no":22,"sectionId":"seko","field":"建築施工","topicName":"木造在来軸組","topic":"t8","body":"在来軸組構法における木工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"真壁の柱に使用する心持ち材には、干割れ防止のため、見え隠れ部分に背割りを入れた。"},{"text":"洋式小屋組における真束と棟木の取合いは、棟木が真束より小さかったため、長ほぞ差しとした。"},{"text":"建入れ直し完了後、接合金物や火打材を固定し、筋かいを取り付けた。"},{"text":"軒桁の継手は、柱心から持ち出して、追掛大栓継ぎとした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68920","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-23","season":"R4_late","no":23,"sectionId":"seko","field":"建築施工","topicName":"タイル張り工事","topic":"t24","body":"壁タイル密着張り工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"振動工具は、タイル面に垂直に当てて使用した。"},{"text":"振動工具による加振は、張付けモルタルがタイル周辺からはみ出すまで行った。"},{"text":"張付けモルタルの1回に塗り付ける面積は、60分でタイルを張り終える面積とした。"},{"text":"目地詰めは、タイル張付け後24時間以上経過してから行った。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68921","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-24","season":"R4_late","no":24,"sectionId":"seko","field":"建築施工","topicName":"金属の表面仕上","topic":null,"body":"ステンレス鋼板の表面仕上げに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"機械的に凹凸の浮出し模様を施した仕上げを、ヘアラインという。"},{"text":"冷間圧延後、熱処理、酸洗いを行うことで、にぶい灰色のつや消し仕上げにしたものを、No.2Dという。"},{"text":"化学処理により研磨板に図柄や模様を施した仕上げを、エッチングという。"},{"text":"研磨線がなくなるまでバフ仕上げをした最も反射率の高い仕上げを、鏡面という。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68922","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-25","season":"R4_late","no":25,"sectionId":"seko","field":"建築施工","topicName":"モルタル塗り","topic":null,"body":"コンクリート壁下地のセメントモルタル塗りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"下塗りは、14日以上放置し、十分にひび割れを発生させてから次の塗付けにかかった。"},{"text":"乾燥収縮によるひび割れの防止のため、保水剤を混和剤として使用した。"},{"text":"モルタルの1回の練混ぜ量は、60分以内に使い切れる量とした。"},{"text":"上塗りモルタルの調合は、下塗りモルタルよりも富調合とした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68923","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-26","season":"R4_late","no":26,"sectionId":"seko","field":"建築施工","topicName":"建具工事","topic":null,"body":"鋼製建具に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"くつずりの材料は、厚さ1.5mmのステンレス鋼板とした。"},{"text":"四方枠の気密材は、建具の気密性を確保するため、クロロプレンゴム製とした。"},{"text":"フラッシュ戸の組立てにおいて、中骨は600mm間隔で設けた。"},{"text":"大型で重量のある建具の仮止めは、位置調節用の金物を用いた。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68924","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-27","season":"R4_late","no":27,"sectionId":"seko","field":"建築施工","topicName":"塗装工事","topic":"t25","body":"塗装工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"アクリル樹脂系非水分散形塗料塗りにおいて、下塗りには上塗りと同一材料を用いた。"},{"text":"木部のクリヤラッカー塗りにおける着色は、下塗りのウッドシーラー塗布後に行った。"},{"text":"高粘度、高濃度の塗料による厚膜塗装とするため、エアレススプレーを用いて吹き付けた。"},{"text":"合成樹脂エマルションペイント塗りにおいて、天井面等の見上げ部分では研磨紙ずりを省略した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68925","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-28","season":"R4_late","no":28,"sectionId":"seko","field":"建築施工","topicName":"フリーアクセスフロア","topic":null,"body":"フリーアクセスフロアに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"電算機室では、床パネルの四隅の交点に共通の支持脚を設けて支持する共通独立脚方式としたため、方杖を設けて耐震性を高めた。"},{"text":"事務室では、1枚のパネルの四隅や中間に高さ調整のできる支持脚が付く、脚付きパネル方式とした。"},{"text":"床パネルの各辺の長さが500mmだったため、幅及び長さの寸法精度は、±0.5mm以内とした。"},{"text":"床パネル取付け後の水平精度は、隣接する床パネルどうしの高さの差を2mm以下とした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68926","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-29","season":"R4_late","no":29,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"事前調査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"山留め工事の計画に当たって、周辺地盤の高低について調査することとした。"},{"text":"工事用資材の搬入計画に当たって、幼稚園や学校の場所を確認し、輸送経路の制限の有無を調査することとした。"},{"text":"土の掘削計画に当たって、振動が発生するため、近隣の商店や工場の業種を調査することとした。"},{"text":"解体工事の計画に当たって、発生する木くずを処分するため、一般廃棄物の処分場所を調査することとした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68927","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-30","season":"R4_late","no":30,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"塗料や溶剤等の保管場所は、管理をしやすくするため、資材倉庫の一画を不燃材料で間仕切り、設置することとした。"},{"text":"所定の高さを有し、かつ、危害を十分防止し得る既存の塀を、仮囲いとして使用することとした。"},{"text":"工事用ゲートや通用口は必要な場合を除き閉鎖することとし、開放する場合は誘導員を配置することとした。"},{"text":"工事現場の敷地周囲の仮囲いに設置する通用口には、内開き扉を設けることとした。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68928","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-31","season":"R4_late","no":31,"sectionId":"kanri","field":"施工管理法","topicName":"労働安全衛生(届出等)","topic":"t35","body":"労働基準監督署長に届け出なければならないものとして、不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"延べ面積が10m2を超える建築物の除却"},{"text":"現場で常時15人の労働者が従事するための特定元方事業者の事業開始報告"},{"text":"設置期間が60日以上のつり足場の設置"},{"text":"つり上げ荷重が3tのクレーンの設置"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68929","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-32","season":"R4_late","no":32,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"建築工事の工程計画及び工程管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工事に必要な実働日数に作業休止日を考慮した日数を、暦日という。"},{"text":"工期を横軸に取り、出来高の累計を縦軸とした進捗度グラフは、直線となる。"},{"text":"ネットワーク工程表は、作業の順序関係、開始時期及び終了時期を明確にしたもので、工程の変化に対応しやすい。"},{"text":"工程管理においては、実施工程を分析検討し、その結果を計画工程の修正に合理的に反映させる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68930","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-33","season":"R4_late","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"バーチャート/ネットワーク工程表","topic":"t29","body":"バーチャート工程表に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"複雑な時間計算が不要であるため、作成しやすい。"},{"text":"工程上の重点管理しなければならない作業が判断しやすい。"},{"text":"各作業の開始時期、終了時期及び所要期間を把握しやすい。"},{"text":"出来高の累計を重ねて表現したものは、工事出来高の進捗状況が把握しやすい。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68931","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-34","season":"R4_late","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"品質管理の用語に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"特性要因図とは、結果の特性とそれに影響を及ぼしている要因との関係を、魚の骨のような図に体系的にまとめたものである。"},{"text":"見える化とは、問題、課題、対象等をいろいろな手段を使って明確にし、関係者全員が認識できる状態にすることである。"},{"text":"管理項目とは、目標の達成を管理するために、評価尺度として選定した項目のことである。"},{"text":"QCDSとは、計画、実施、点検、処置のサイクルを確実、かつ、継続的に回して、プロセスのレベルアップを図る考え方である。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68932","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-35","season":"R4_late","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"試験・検査","topic":"t30","body":"工事現場における試験に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄筋のガス圧接部のふくらみの直径の測定は、デジタルノギスを用いて行った。"},{"text":"フレッシュコンクリートのスランプの測定は、スランプゲージを用いて行った。"},{"text":"外壁タイル張り後のタイル接着力試験は、油圧式簡易引張試験器を用いて行った。"},{"text":"硬質ウレタンフォーム断熱材の吹付け作業中の厚さの測定は、ダイヤルゲージを用いて行った。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68933","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-36","season":"R4_late","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"鉄骨建方","topic":null,"body":"鉄骨工事の検査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"トルシア形高力ボルトの本締め完了は、ピンテールの破断とマーキングのマークのずれによって確認した。"},{"text":"スタッド溶接の合否は、打撃曲げ試験によって確認した。"},{"text":"溶接部の欠陥であるブローホールは、目視によって有無を確認した。"},{"text":"溶接後のビード外観は、目視によって表面の不整の有無を確認した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68934","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-37","season":"R4_late","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"型枠支保工","topic":"t22","body":"型枠支保工の組立て等作業主任者の職務として、「労働安全衛生規則」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"作業中、保護帽の使用状況を監視すること。"},{"text":"作業を直接指揮すること。"},{"text":"器具及び工具を点検し、不良品を取り除くこと。"},{"text":"型枠支保工の組立図を作成すること。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68935","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-38","season":"R4_late","no":38,"sectionId":"kanri","field":"施工管理法","topicName":"足場","topic":"t31","body":"足場に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"折りたたみ式の脚立は、脚と水平面との角度を75°以下とし、開き止め具が装備されたものを使用した。"},{"text":"移動式足場（ローリングタワー）の作業床の周囲には、高さ10cmの幅木と高さ90cmの中桟付きの手すりを設けた。"},{"text":"単管足場の建地間隔は、桁行方向、梁間方向ともに、2mとした。"},{"text":"つり足場の作業床は、幅を40cmとし、隙間がないように敷きつめた。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68936","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-39","season":"R4_late","no":39,"sectionId":"ability","field":"施工管理法","topicName":"鉄骨の加工","topic":null,"body":"鉄骨の加工に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"鋼材の加熱曲げ加工は、青熱脆性域で行った。"},{"text":"鋼材のガス切断は、自動ガス切断機を用いた。"},{"text":"板厚が13mm以下の鋼材のアンカーボルト孔は、せん断孔あけで加工した。"},{"text":"高力ボルトの孔径は、高力ボルトの公称軸径に5mmを加えた値とした。"}],"answer":[1,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68937","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-40","season":"R4_late","no":40,"sectionId":"ability","field":"施工管理法","topicName":"RC構造","topic":"t6","body":"鉄筋コンクリート造建築物の解体工事に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"解体作業に先立ち、各種設備機器の停止並びに給水、ガス、電力及び通信の供給が停止していることを確認した。"},{"text":"壁及び天井のクロスは、せっこうボードと一緒に撤去した。"},{"text":"騒音防止やコンクリート片の飛散防止のため、全面をメッシュシートで養生した。"},{"text":"各階の解体は、中央部分を先行して解体し、外周部を最後に解体した。"}],"answer":[2,3],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68938","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-41","season":"R4_late","no":41,"sectionId":"ability","field":"施工管理法","topicName":"防水工事","topic":"t23","body":"屋上アスファルト防水工事に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"ルーフィング類は、水上部分から張り付け、継目の位置が上下層で同一箇所にならないようにした。"},{"text":"ルーフドレン回りの増張りに用いるストレッチルーフィングは、ドレンのつばに100mm程度張り掛けた。"},{"text":"保護コンクリートの動きによる立上り防水層の損傷を防止するため、成形緩衝材を立上り入隅部に取り付けた。"},{"text":"保護コンクリートの伸縮調整目地の深さは、保護コンクリートの厚さの1／2とした。"}],"answer":[1,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68939","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-42","season":"R4_late","no":42,"sectionId":"ability","field":"施工管理法","topicName":"ビニル床シート","topic":null,"body":"ビニル床シート張りの熱溶接工法に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"張付け用の接着剤は、所定のくし目ごてを用いて均一に塗布した。"},{"text":"シートの張付けは、空気を押し出すように行い、その後ローラーで圧着した。"},{"text":"継目の溝切りは、シート張付け後、接着剤が硬化する前に行った。"},{"text":"溶接継目の余盛りは、溶接直後に削り取った。"}],"answer":[3,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68940","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-43","season":"R4_late","no":43,"sectionId":"hoki","field":"法規","topicName":"建築確認手続き","topic":"t33","body":"建築確認手続き等に関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"建築主は、原則として、工事完了から4日以内に、建築主事に到達するように完了検査を申請しなければならない。"},{"text":"建築主は、工事現場の見やすい場所に、国土交通省令で定める様式によって、建築確認があった旨の表示をしなければならない。"},{"text":"施工者は、建築確認申請が必要な工事の場合、設計図書を工事現場に備えておかなければならない。"},{"text":"建築主事は、工事の完了検査の申請を受理した場合、その受理した日から7日以内に検査をしなければならない。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68941","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-44","season":"R4_late","no":44,"sectionId":"hoki","field":"法規","topicName":"記述","topic":null,"body":"次の記述のうち、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"階段に代わる傾斜路の勾配は、1／8を超えないものとする。"},{"text":"下水道法に規定する処理区域内においては、汚水管が公共下水道に連結された水洗便所としなければならない。"},{"text":"集会場の客用の屋内階段の幅は、120cm以上とする。"},{"text":"建築物に設ける昇降機の昇降路の周壁及び開口部は、防火上支障がない構造でなければならない。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68942","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-45","season":"R4_late","no":45,"sectionId":"hoki","field":"法規","topicName":"建設業の許可","topic":"t34","body":"建設業の許可に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"一の都道府県の区域内にのみ営業所を設けて営業をしようとする場合は、原則として、当該営業所の所在地を管轄する都道府県知事の許可を受けなければならない。"},{"text":"建設業の許可は、5年ごとに更新を受けなければ、その期間の経過によって、その効力が失われる。"},{"text":"指定建設業と定められている建設業は、7業種である。"},{"text":"一般建設業の許可を受けた業者と特定建設業の許可を受けた業者では、発注者から直接請け負うことができる工事の請負代金の額が異なる。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68943","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-46","season":"R4_late","no":46,"sectionId":"hoki","field":"法規","topicName":"主任技術者・監理技術者","topic":"t34","body":"建設工事現場に置く技術者に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"国又は地方公共団体が発注する建築一式工事以外の建設工事で、請負代金の額が3,000万円の工事現場に置く主任技術者は、専任の者でなければならない。"},{"text":"共同住宅の建築一式工事で、請負代金の額が8,000万円の工事現場に置く主任技術者は、専任の者でなければならない。"},{"text":"主任技術者は、工事現場における建設工事を適正に実施するため、当該建設工事の施工に従事する者の技術上の指導監督の職務を誠実に行わなければならない。"},{"text":"下請負人として建設工事を請け負った建設業者は、下請代金の額にかかわらず主任技術者を置かなければならない。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:68944","answer":"answers/R4_late_answers.csv"}},{"id":"R4_late-47","season":"R4_late","no":47,"sectionId":"hoki","field":"法規","topicName":"記述","topic":null,"body":"次の記述のうち、「労働基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"使用者は、妊娠中の女性を、地上又は床上における補助作業の業務を除く足場の組立ての作業に就かせてはならない。"},{"text":"使用者は、満18歳に満たない者について、その年齢を証明する戸籍証明書を事業場に備え付けなければならない。"},{"text":"未成年者は、独立して賃金を請求することができる。"},{"text":"親権者又は後見人は、未成年者に代って労働契約を締結することができる。"}],"answer":[4],"answerMode":" age":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72141","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-2","season":"R5_early","no":2,"sectionId":"gaku","field":"建築学","topicName":"採光・照明・日射","topic":"t3","body":"照明に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"光束法による室内の平均照度の算出式において、設計対象面上の平均照度は設計対象面の面積に反比例する。"},{"text":"ものの見やすさには、視対象の明るさ、視対象と背景の対比、視対象の大きさ及び見る時間が関係する。"},{"text":"点光源による照度は、光源からの距離の2乗に反比例する。"},{"text":"光源の色を表す色温度は、光源と同じ色の光を放つ黒体の絶対温度で表し、単位はルーメン（lm）である。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72142","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-3","season":"R5_early","no":3,"sectionId":"gaku","field":"建築学","topicName":"色","topic":"t5","body":"色に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"無彩色とは、色みを表す色相や明るさを表す明度をもたない色をいう。"},{"text":"補色どうしを対比すると、互いに強調しあい、鮮やかさが増して見える。"},{"text":"色の温度感覚には、暖色や寒色、それらに属さない中性色がある。"},{"text":"2つの有彩色を混ぜて灰色になるとき、その2色は互いに補色の関係にある。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72143","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-4","season":"R5_early","no":4,"sectionId":"gaku","field":"建築学","topicName":"木造在来軸組","topic":"t8","body":"木造在来軸組工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"階数が2以上の建築物における隅柱又はこれに準ずる柱は、原則として、通し柱とする。"},{"text":"圧縮力を負担する木材の筋かいは、厚さ1.5cm以上で幅9cm以上とする。"},{"text":"3階建ての建築物における1階の構造耐力上主要な部分である柱の断面は、原則として、小径13.5cm以上とする。"},{"text":"壁を設け又は筋かいを入れた構造耐力上必要な軸組の長さは、各階の床面積が同じ場合、1階のほうが2階より大きな値となる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72144","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-5","season":"R5_early","no":5,"sectionId":"gaku","field":"建築学","topicName":"RC構造","topic":"t6","body":"鉄筋コンクリート構造の建築物の構造設計に関する一般的な記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"構造耐力上主要な部分である柱の主筋の全断面積の割合は、コンクリートの全断面積の0.4％以上とする。"},{"text":"構造耐力上主要な部分である柱の帯筋比は、0.2％以上とする。"},{"text":"床スラブの配力筋は、一般に主筋と直角に、スラブの長辺方向に配筋する。"},{"text":"四辺固定の長方形床スラブの中央部の引張鉄筋は、スラブの下側に配筋する。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72145","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-6","season":"R5_early","no":6,"sectionId":"gaku","field":"建築学","topicName":"鉄骨構造の接合","topic":"t7","body":"鉄骨構造の接合に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"高力ボルト接合の摩擦面には、ショットブラスト処理等による一定の値以上のすべり係数を確保する必要がある。"},{"text":"完全溶込み溶接継目の有効長さは、接合される材の全幅とする。"},{"text":"溶接と高力ボルトを併用する継手で、溶接を先に行う場合は両方の許容耐力を加算してよい。"},{"text":"隅肉溶接継目の許容応力度は、母材の許容せん断応力度と同じ値とする。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72146","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-7","season":"R5_early","no":7,"sectionId":"gaku","field":"建築学","topicName":"基礎・地盤","topic":"t9","body":"基礎杭に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"拡径断面を有する遠心力高強度プレストレストコンクリート杭（ST杭）は、拡径部を杭の先端に使用する場合、大きな支持力を得ることができる。"},{"text":"既製コンクリート杭の埋込み工法のひとつで、杭の中空部から掘削土を排出しながら杭を圧入する中掘り工法は、杭径の小さなものの施工に適している。"},{"text":"外殻鋼管付きコンクリート杭（SC杭）は、一般に継ぎ杭の上杭として、遠心力高強度プレストレストコンクリート杭（PHC杭）と組み合わせて用いられる。"},{"text":"鋼杭は、地中での腐食への対処法として、肉厚を厚くする方法、塗装やライニングを行う方法等が用いられる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72147","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-8","season":"R5_early","no":8,"sectionId":"gaku","field":"建築学","topicName":"建築物の構造設計における地震層せん断力","topic":null,"body":"建築物の構造設計における地震層せん断力に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"地上部分のある層に作用する地震層せん断力は、算定しようとする層の固定荷重と積載荷重の和に、その層の地震層せん断力係数を乗じて計算する。"},{"text":"地震層せん断力は、建築物の設計用一次固有周期及び地盤の種類に応じて算定する。"},{"text":"地震層せん断力係数は、上層階になるほど大きくなる。"},{"text":"地震地域係数は、その地方における過去の地震の記録に基づく震害の程度及び地震活動の状況、その他地震の性状に応じて国土交通大臣が定める数値である。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72148","ans ","topicName":"日本産業規格（JIS）のレ","topic":null,"body":"日本産業規格（JIS）のレディーミクストコンクリート用骨材として、規定されていないものはどれか。","bodyImgs":[],"choices":[{"text":"人工軽量骨材"},{"text":"高炉スラグ骨材"},{"text":"溶融スラグ骨材"},{"text":"再生骨材H"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72160","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-21","season":"R5_early","no":21,"sectionId":"seko","field":"建築施工","topicName":"木造在来軸組","topic":"t8","body":"在来軸組構法における木工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"土台の継手位置は、床下換気口を避けた位置とした。"},{"text":"束立て床組の大引の継手位置は、床束心とした。"},{"text":"根太掛けの継手位置は、柱心とした。"},{"text":"根太の継手位置は、大引等の受材心とした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72161","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-22","season":"R5_early","no":22,"sectionId":"seko","field":"建築施工","topicName":"解体工事","topic":null,"body":"木造住宅の解体工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"蛍光ランプは、窓ガラスと共に専用のコンテナ容器内で破砕して、ガラス類として処分した。"},{"text":"建具と畳は、建築設備を取り外した後、手作業で撤去した。"},{"text":"せっこうボードは再資源化するため、水に濡れないように取り扱った。"},{"text":"屋根葺材は、内装材を撤去した後、手作業で取り外した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72162","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-23","season":"R5_early","no":23,"sectionId":"seko","field":"建築施工","topicName":"防水工事","topic":"t23","body":"ウレタンゴム系塗膜防水絶縁工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"不織布タイプの通気緩衝シートは、接着剤で張り付けた。"},{"text":"通気緩衝シートの継目は、隙間や重なり部をつくらないようにシート相互を突付けとし、ジョイントテープを張り付けた。"},{"text":"穴あきの不織布タイプの通気緩衝シートは、下地に張り付けた後、防水材でシートの穴を充填した。"},{"text":"通気緩衝シートは、防水立上り面まで張り上げた。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72163","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-24","season":"R5_early","no":24,"sectionId":"seko","field":"建築施工","topicName":"石工事","topic":null,"body":"外壁の張り石工事において、湿式工法と比較した場合の乾式工法の特徴として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"地震時の躯体の挙動に追従しにくい。"},{"text":"石材の熱変形による影響が少ない。"},{"text":"白華現象が起こりにくい。"},{"text":"工期短縮を図りやすい。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72164","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-25","season":"R5_early","no":25,"sectionId":"seko","field":"建築施工","topicName":"金属の表面仕上","topic":null,"body":"金属の表面仕上げに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ステンレス鋼のNo．2Bは、母材を冷間圧延して熱処理、酸洗いした後、適度な光沢を与えるために軽い冷間圧延をした仕上げである。"},{"text":"アルミニウムの自然発色皮膜は、母材を陽極酸化処理した後に着色や染色を行わず、素地のシルバー色のままとした無着色仕上げである。"},{"text":"鋼材の電気めっきは、母材を電解液中で通電して、表面に皮膜金属を生成させた仕上げである。"},{"text":"銅合金の硫化いぶしは、母材の表面に、硫黄を含む薬品を用いて褐色に着色した仕上げである。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72165","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-26","season":"R5_early","no":26,"sectionId":"seko","field":"建築施工","topicName":"塗装の素地ごしらえ","topic":"t25","body":"塗装工事における素地ごしらえに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"モルタル面の吸込み止めは、パテかいを行った後に、シーラーを全面に塗り付けた。"},{"text":"せっこうボード面のパテかいは、合成樹脂エマルションパテを使用した。"},{"text":"木部面の不透明塗料塗りの節止めは、セラックニスを使用した。"},{"text":"ALCパネル面の吸込み止めは、下地調整を行う前に、シーラーを全面に塗り付けた。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72166","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-27","season":"R5_early","no":27,"sectionId":"seko","field":"建築施工","topicName":"床仕上(カーペット・フローリング)","topic":null,"body":"床のフローリングボード張りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"壁、幅木、框及び敷居とフローリングボードの取合いには、板の伸縮に備えた隙間を設けた。"},{"text":"張込み完了後の表面に生じた目違いは、養生期間を経過した後、サンディングした。"},{"text":"接着剤張り工法のため、接着剤は専用のくしべらを使用し、均等に伸ばして塗り付けた。"},{"text":"釘留め工法の根太張り工法のため、根太の上に下張りを行い、フローリングボードを接着剤を併用して張り込んだ。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72167","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-28","season":"R5_early","no":28,"sectionId":"seko","field":"建築施工","topicName":"押出成形セメント板","topic":null,"body":"外壁の押出成形セメント板（ECP）横張り工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"取付け金物（Zクリップ）は、パネル小口より80mm離れた位置に取り付けた。"},{"text":"取付け金物（Zクリップ）は、パネル1枚につき左右両端部2か所ずつ4か所取り付けた。"},{"text":"取付け金物（Zクリップ）は、下地鋼材にかかり代を20mm確保して取り付けた。"},{"text":"取付け金物（Zクリップ）は、下地鋼材に溶接長さを15mm確保して取り付けた。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72168","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-29","season":"R5_early","no":29,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"事前調査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"既存の地下埋設物を記載した図面があったが、位置や規模の確認のための試掘調査を行うこととした。"},{"text":"既製杭の打込みが予定されているため、近接する工作物や舗装の現況の調査を行うこととした。"},{"text":"根切り工事が予定されているため、前面道路や周辺地盤の高低の調査を行うこととした。"},{"text":"防護棚を設置するため、敷地地盤の高低や地中埋設配管の調査を行うこととした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72169","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-30","season":"R5_early","no":30,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"規模が小さい作業所のため、守衛所を設けず、警備員だけを出入口に配置することとした。"},{"text":"敷地内に仮設道路を設置するに当たり、地盤が軟弱であったため、浅層地盤改良を行うこととした。"},{"text":"鋼板製仮囲いの下端には、雨水が流れ出やすいように隙間を設けることとした。"},{"text":"仮囲いの出入口は、管理をしやすくするため、人や車両の入退場の位置を限定することとした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72170","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-31","season":"R5_early","no":31,"sectionId":"kanri","field":"施工管理法","topicName":"申請・届出","topic":"t33","body":"建築工事に係る申請や届出等に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"振動規制法による特定建設作業を指定地域内で行うため、特定建設作業実施届出書を市町村長に提出した。"},{"text":"常時10人の労働者が従事する事業で附属寄宿舎を設置するため、寄宿舎設置届を市町村長に提出した。"},{"text":"積載荷重が1tの仮設の人荷用エレベーターを設置するため、エレベーター設置届を労働基準監督署長に提出した。"},{"text":"歩道に工事用仮囲いを設置するため、道路占用許可申請書を道路管理者に提出した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72171","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-32","season":"R5_early","no":32,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"工程計画及び工程管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工期短縮に用いる手法として、山積工程表における山崩しがある。"},{"text":"ネットワーク工程表は、工程における複雑な作業間の順序関係を視覚的に表現することができる。"},{"text":"工程管理の手法として、3次元CADやコンピューターグラフィックスを使用することで工事現場の進捗状況を視覚的に把握する方法がある。"},{"text":"Sチャートは、工事の進捗に対応した出来高の累積値を縦軸に、時間を横軸に取って、出来高の進捗を数量的、かつ、視覚的に示すことができる。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72172","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-33","season":"R5_early","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"バーチャート/ネットワーク工程表","topic":"t29","body":"バーチャート工程表に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工事種目を縦軸に、月日を横軸に示し、各作業の開始から終了までを横線で表したものである。"},{"text":"工程表に示す作業を増やしたり、作業を細分化すると、作業間の関係が把握しやすくなる。"},{"text":"作業の流れ、各作業の所要日数や施工日程が把握しやすい。"},{"text":"工程の進捗をマイルストーンごとに確認すると、全体工程の遅れを防ぐことにつながる。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72173","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-34","season":"R5_early","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"次のうち、品質管理に関する用語として、最も関係の少ないものはどれか。","bodyImgs":[],"choices":[{"text":"PDCA"},{"text":"トレーサビリティ"},{"text":"ALC"},{"text":"サンプリング"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72174","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-35","season":"R5_early","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"品質管理のための試験及び検査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"シーリング工事において、接着性の確認のため、簡易接着性試験を行った。"},{"text":"タイル工事において、外壁タイルの接着力の確認のため、引張接着試験を行った。"},{"text":"コンクリート工事において、フレッシュコンクリートの受入検査のため、空気量試験を行った。"},{"text":"既製コンクリート杭地業工事において、根固め液の強度の確認のため、針入度試験を行った。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72175","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-36","season":"R5_early","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"トルシア形ボルト","topic":null,"body":"トルシア形高力ボルトの本締め完了後に確認すべき事項として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ナット回転量は、各ボルト群のナットの平均回転角度の±30°以内であることを確認する。"},{"text":"一次締めの後につけたマークのずれにより、共回りが生じていないことを確認する。"},{"text":"ボルト締付けの合否は、トルク値を測定して確認する。"},{"text":"ナット面から突き出たボルトの余長が、ねじ1山から6山までの範囲であることを確認する。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72176","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-37","season":"R5_early","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"作業主任者","topic":"t35","body":"足場の組立て等作業主任者の職務として、「労働安全衛生規則」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"その日の作業を開始する前に、作業を行う箇所に設けた足場用墜落防止設備の取り外しの有無を点検すること。"},{"text":"器具、工具、要求性能墜落制止用器具及び保護帽の機能を点検し、不良品を取り除くこと。"},{"text":"要求性能墜落制止用器具及び保護帽の使用状況を監視すること。"},{"text":"作業の方法及び労働者の配置を決定し、作業の進行状況を監視すること。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72177","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-38","season":"R5_early","no":38,"sectionId":"kanri","field":"施工管理法","topicName":"足場","topic":"t31","body":"建築工事の足場に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"くさび緊結式足場において、壁つなぎの間隔は、法令で定められた単管足場の間隔を適用した。"},{"text":"高さ5m以上の枠組足場において、壁つなぎの水平方向の間隔は、10m以下とした。"},{"text":"単管足場において、単管と単管の交点の緊結金具は、直交型クランプ又は自在型クランプを使用した。"},{"text":"枠組足場において、階段の手すりの高さは、踏板より90cmとした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72178","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-39","season":"R5_early","no":39,"sectionId":"ability","field":"施工管理法","topicName":"鉄筋のかぶり厚","topic":"t20","body":"鉄筋のかぶり厚さに関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"設計かぶり厚さは、最小かぶり厚さに施工誤差を考慮した割増を加えたものである。"},{"text":"かぶり厚さは、ひび割れ補強筋についても確保する。"},{"text":"かぶり厚さとは、鉄筋の中心からコンクリートの表面までの距離である。"},{"text":"土に接するスラブのかぶり厚さには、捨コンクリートの厚さを含む。"}],"answer":[3,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72179","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-40","season":"R5_early","no":40,"sectionId":"ability","field":"施工管理法","topicName":"錆止め塗装","topic":"t25","body":"鉄骨の錆止め塗装に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"工事現場溶接を行う箇所は、開先面のみ塗装を行わなかった。"},{"text":"塗膜にふくれや割れが生じた部分は、塗膜を剥がしてから再塗装を行った。"},{"text":"素地調整を行った面は、素地が落ち着くまで数日あけて塗装を行った。"},{"text":"コンクリートに埋め込まれる部分は、塗装を行わなかった。"}],"answer":[1,3],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72180","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-41","season":"R5_early","no":41,"sectionId":"ability","field":"施工管理法","topicName":"セルフレベリング","topic":null,"body":"セルフレベリング材塗りに関する記述として、不適当なものを2つ選べ。\nただし、塗り厚は10mm程度とする。","bodyImgs":[],"choices":[{"text":"流し込みは、吸水調整材塗布後、直ちに行った。"},{"text":"流し込み作業中は、通風のため窓や開口部を開放した。"},{"text":"流し込み後は、表面全体をトンボ等を用いて均した。"},{"text":"硬化後、打継ぎ部等の突起は、サンダーで削り取った。"}],"answer":[1,2],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72181","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-42","season":"R5_early","no":42,"sectionId":"ability","field":"施工管理法","topicName":"建具工事","topic":null,"body":"鋼製建具に関する記述として、不適当なものを2つ選べ。\nただし、1枚の戸の有効開口は、幅950mm、高さ2,400mmとする。","bodyImgs":[],"choices":[{"text":"建具枠の取付け用のアンカーは、枠の両端を固定して、中間部を900mm内外の間隔とした。"},{"text":"建具枠の取付け精度は、対角寸法差を3mm以内とした。"},{"text":"くつずりは、ステンレス製とし、表面の仕上げをヘアラインとした。"},{"text":"くつずり裏面のモルタル詰めは、建具枠の取付け後に行った。"}],"answer":[1,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72182","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-43","season":"R5_early","no":43,"sectionId":"hoki","field":"法規","topicName":"建築確認手続き","topic":"t33","body":"建築確認等の手続きに関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"特定工程後の工程に係る工事は、当該特定工程に係る中間検査合格証の交付を受けた後でなければ、これを施工してはならない。"},{"text":"特定行政庁は、工事施工者に対して工事の計画又は施工の状況に関する報告を求めることができる。"},{"text":"建築主事は、建築主に対して、建築物の敷地に関する報告を求めることができる。"},{"text":"工事施工者は、建築物の工事を完了したときは、建築主事又は指定確認検査機関の完了検査を申請しなければならない。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72183","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-44","season":"R5_early","no":44,"sectionId":"hoki","field":"法規","topicName":"記述","topic":null,"body":"次の記述のうち、「建築基準法施行令」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"階段に代わる傾斜路には、原則として、手すり等を設けなければならない。"},{"text":"階段の幅が3mを超える場合、原則として、中間に手すりを設けなければならない。"},{"text":"居室の天井の高さは、室の床面から測り、1室で天井の高さの異なる部分がある場合は、最も低いところの高さによる。"},{"text":"水洗便所に必要な照明設備及び換気設備を設けた場合、当該便所には採光及び換気のため直接外気に接する窓を設けなくともよい。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72184","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-45","season":"R5_early","no":45,"sectionId":"hoki","field":"法規","topicName":"建設業の許可","topic":"t34","body":"建設業の許可に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"許可を受けた建設業者は、営業所に置く専任の技術者を欠くこととなった場合、これに代わるべき者について、書面を提出しなければならない。"},{"text":"許可を受けた建設業者は、毎事業年度終了の時における工事経歴書を、提出しなければならない。"},{"text":"許可を受けた建設業者は、業種の区分について変更があったときは、その旨の変更届出書を提出しなければならない。"},{"text":"許可を受けた建設業者は、商号又は名称について変更があったときは、その旨の変更届出書を提出しなければならない。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:72185","answer":"answers/R5_early_answers.csv"}},{"id":"R5_early-46","season":"R5_early","no":46,"sectionId":"hoki","field":"法規","topicName":"主任技術者・監理技術者","topic":"t34","body":"工事現場における技術者に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":
