// ====== 提出 ======
function confirmSubmit() {
  const stats = sectionStats(session);
  const overs = stats.filter(x => x.over), shorts = stats.filter(x => x.short);
  const total = Object.keys(session.answers).length;
  const unansweredReq = shorts.filter(x => x.sec.pick == null).map(x => x.nos.filter(n => !session.answers[n]).map(n => 'No.' + n).join('・'));
  let html = `<h2>解答を提出しますか？</h2>
    <div class="stat"><span>解答数</span><b>${total} / 40</b>
    ${stats.map(x => `<span>${esc(x.sec.label)}</span><b class="${x.over ? 'bad' : ''}">${x.answered.length} / ${x.need}${x.over ? ' 超過' : x.short ? ' 不足' : ''}</b>`).join('')}</div>`;
  if (overs.length) html += `<div class="warnbox">${overs.map(x => `${esc(x.sec.label)}は ${x.need} 問までです（現在 ${x.answered.length} 問）。解答を ${x.answered.length - x.need} 問取り消してください。`).join('<br>')}</div>`;
  else if (shorts.length) html += `<p>未解答があります（${shorts.map(x => esc(x.sec.label) + ' ' + (x.need - x.answered.length) + '問').join('、')}）。未解答は不正解として採点します。</p>`;
  html += `<p style="font-size:12.5px">提出後は解答を変更できません。</p>
    <div class="actions"><button class="btn ghost" data-act="close">戻る</button><button class="btn" data-act="submit" ${overs.length ? 'disabled' : ''}>提出する</button></div>`;
  openDialog(html, { submit: () => { closeDialog(); closeDrawer(); submit('manual'); } });
}

function submit(reason) {
  if (!session || session.status !== 'running') return;
  stopTicking();
  session.status = 'submitted'; session.submittedAt = Date.now(); session.reason = reason;
  const rec = makeRecord(session);
  const hist = load(LS.history, []);
  if (!hist.some(h => h.id === rec.id)) { hist.push(rec); save(LS.history, hist); }
  session.resultId = rec.id; persist();
  renderResult(rec);
}

// ====== 採点(docs/exam_design.md §5) ======
const sameSet = (a, b) => a.length === b.length && a.slice().sort().every((x, i) => x === b.slice().sort()[i]);
function grade(sess) {
  const season = seasonById(sess.seasonId);
  let correct = 0, excessTotal = 0; const bySection = [], perQ = [];
  for (const st of sectionStats(sess)) {
    const answered = st.answered.slice().sort((a, b) => a - b);
    let graded = answered, excess = 0;
    // 指定数超過(時間切れ提出時のみ到達): 若い番号から指定数だけ採点、超過分は減点
    if (st.sec.pick != null && answered.length > st.sec.pick) { graded = answered.slice(0, st.sec.pick); excess = answered.length - st.sec.pick; }
    let c = 0;
    for (const n of st.nos) {
      const q = qAt(sess.seasonId, n), ua = sess.answers[n] || [];
      const isGraded = graded.includes(n);
      const ok = isGraded && !!q.answer && sameSet(ua, q.answer);
      if (ok) c++;
      perQ.push({ no: n, sectionId: st.sec.id, ua, answer: q.answer, ok, graded: isGraded, excess: ua.length > 0 && !isGraded, time: Math.round(sess.timeOnQ[n] || 0) });
    }
    bySection.push({ id: st.sec.id, label: st.sec.label, correct: c, answered: answered.length, need: st.need, excess });
    correct += c; excessTotal += excess;
  }
  const score = Math.max(0, correct - excessTotal * EXCESS_PENALTY);
  return { score, correct, excess: excessTotal, pass: score >= season.passLine, passLine: season.passLine, bySection, perQ };
}
function makeRecord(sess) {
  const g = grade(sess);
  return { id: 'r' + sess.startedAt, seasonId: sess.seasonId, startedAt: sess.startedAt, submittedAt: sess.submittedAt, reason: sess.reason,
           durationSec: sess.durationSec, name: settings.name || '', answers: sess.answers, flags: sess.flags, timeOnQ: sess.timeOnQ, ...g };
}

// ====== 間違い演習(学習モード): 履歴の不正解から出題、即時正誤、正解は「克服」 ======
const drillState = () => Object.assign({ cleared: {}, run: null }, load(LS.drill, {}));
function drillPool(records, opts) {
  // 各問題の「最新の受験結果」で判定(後の受験で正解していれば外す)
  const latest = {};
  for (const r of records.slice().sort((a, b) => a.startedAt - b.startedAt))
    for (const p of r.perQ) latest[r.seasonId + '-' + p.no] = p;
  const st = drillState();
  return Object.entries(latest).filter(([id, p]) => {
    const q = BANK.questions.find(x => x.id === id); if (!q || !q.answer) return false;
    const wrong = p.graded && p.ua.length && !p.ok, blank = !p.ua.length;
    if (!(wrong || (opts.blank && blank))) return false;
    if (!opts.cleared && st.cleared[id]) return false;
    return true;
  }).map(([id]) => id);
}
function drillBox(records, single) {
  const st = drillState();
  const base = drillPool(records, { blank: false, cleared: false }).length;
  const resume = !single && st.run && st.run.queue.length > st.run.idx;
  return `<div class="drillbox" data-scope="${single ? 'one' : 'all'}"><div class="t">${single ? 'この回の間違いを演習する' : '間違えた問題を演習する'}　<span class="prog" id="drillCount">${base}問</span></div>
    <div class="opts"><label><input type="checkbox" class="drillBlank"> 未解答だった問題も含める</label><label><input type="checkbox" class="drillCleared"> 克服済み（演習で正解した問題）も含める${Object.keys(st.cleared).length ? `　<span style="color:var(--ink-3)">${Object.keys(st.cleared).length}問</span>` : ''}</label></div>
    <div class="row"><button class="btn drillStart" ${base ? '' : 'disabled'}>演習を始める</button>${resume ? `<button class="btn ghost" id="drillResume">続きから（${st.run.idx} / ${st.run.queue.length}）</button>` : ''}</div>
    <div style="font-size:12px;color:var(--ink-3)">タイマーなし・選ぶとすぐ正誤が出ます。正解した問題は「克服済み」になり次回は出ません。演習の結果は受験履歴には入りません。</div></div>`;
}
function bindDrillBox(rec) {
  const box = document.querySelector('.drillbox'); if (!box) return;
  const records = rec ? [rec] : load(LS.history, []);
  const opts = () => ({ blank: box.querySelector('.drillBlank').checked, cleared: box.querySelector('.drillCleared').checked });
  const refresh = () => { const n = drillPool(records, opts()).length; box.querySelector('#drillCount').textContent = n + '問'; box.querySelector('.drillStart').disabled = !n; };
  box.querySelectorAll('input').forEach(i => i.addEventListener('change', refresh));
  box.querySelector('.drillStart').addEventListener('click', () => {
    const pool = drillPool(records, opts()); if (!pool.length) return;
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const st = drillState(); st.run = { queue: pool, idx: 0, correct: 0, results: {}, startedAt: Date.now() }; save(LS.drill, st);
    renderDrill();
  });
  const rb = box.querySelector('#drillResume'); if (rb) rb.addEventListener('click', renderDrill);
}
function renderDrill() {
  view = 'drill'; stopTicking();
  const st = drillState(), run = st.run;
  if (!run || run.idx >= run.queue.length) { renderDrillSummary(); return; }
  const q = BANK.questions.find(x => x.id === run.queue[run.idx]);
  const s = seasonById(q.season), sec = sectionOf(s, q.no);
  const multi = q.answerMode === 'multi2';
  const done = run.results[q.id];   // 解答済み(復元時)
  const picked = done ? done.ua : [];
  $('#app').innerHTML = `
    <div class="topbar"><div class="in">
      <div class="sec"><div class="name">間違い演習　${esc(s.label)} No.${q.no}</div><div class="cnt">${esc(sec.label)}</div></div>
      <div class="prog"><small>進捗</small>${run.idx + 1} / ${run.queue.length}</div>
    </div></div>
    <div class="page drill"><div class="q">
      <div class="no"><span class="b">〔No．${zen(q.no)}〕</span><span class="s">${esc(s.label)}</span></div>
      <p class="body">${esc(q.body)}</p>${q.bodyImgs.map(u => `<img class="img" src="${esc(u)}" alt="問題の図">`).join('')}
      <ul class="choices">${q.choices.map((c, i) => { const n = i + 1; return `<li><button class="choice${picked.includes(n) ? ' on' : ''}" data-n="${n}"><span class="oval">${n}</span><span>${c.img ? `<img class="cimg" src="${esc(c.img)}" alt="選択肢${n}の図">` : esc(c.text)}</span></button></li>`; }).join('')}</ul>
      <div class="qhint">${multi ? '2つ選ぶ（2つ目を選ぶと判定）' : '1つ選ぶ'}</div>
      <div id="judge"></div>
    </div></div>
    <div class="botbar"><div class="in single"><button class="nav prev" id="drillQuit">中断</button><button class="nav next" id="drillNext" disabled>次へ →</button></div></div>`;
  let sel = picked.slice();
  const judge = () => {
    const ok = sameSet(sel, q.answer);
    document.querySelectorAll('.choice').forEach(b => { const n = +b.dataset.n; b.classList.add('locked'); b.classList.remove('on'); if (q.answer.includes(n)) b.classList.add('correct'); else if (sel.includes(n)) b.classList.add('wrong'); });
    $('#judge').innerHTML = `<div class="judge ${ok ? 'ok' : 'ng'}">${ok ? '○ 正解 — 克服済みにしました' : '× 不正解 — 正答は ' + q.answer.join(',') + ''}
      <div class="links">${q.topic ? `<a href="index.html#${q.topic}" target="_blank" rel="noopener">教材で復習（${esc(q.topicName || q.topic)}）</a>` : ''}${q.src.text.startsWith('kakomonn:') ? `<a href="https://kenchikusekou2.kakomonn.com/questions/${q.src.text.slice(9)}" target="_blank" rel="noopener">解説を見る（過去問ドットコム）</a>` : ''}${q.lawRevised ? '<span style="color:var(--warn)">※出題後に法改正あり</span>' : ''}</div></div>`;
    $('#drillNext').disabled = false;
    if (!done) { run.results[q.id] = { ua: sel, ok }; if (ok) { run.correct++; st.cleared[q.id] = Date.now(); } save(LS.drill, st); }
  };
  document.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
    if (run.results[q.id]) return;
    const n = +b.dataset.n;
    if (multi) { if (sel.includes(n)) sel = sel.filter(x => x !== n); else sel.push(n); document.querySelectorAll('.choice').forEach(x => x.classList.toggle('on', sel.includes(+x.dataset.n))); if (sel.length === 2) judge(); }
    else { sel = [n]; judge(); }
  }));
  if (done) judge();
  $('#drillNext').addEventListener('click', () => { run.idx++; save(LS.drill, st); renderDrill(); window.scrollTo(0, 0); });
  $('#drillQuit').addEventListener('click', () => openDialog(`<h2>演習を中断しますか？</h2><p>ここまでの結果は保存され、Homeの「続きから」で再開できます。</p><div class="actions"><button class="btn ghost" data-act="close">戻る</button><button class="btn" data-act="quit">中断してHomeへ</button></div>`, { quit: () => { closeDialog(); renderHome(); } }));
  window.scrollTo(0, 0);
}
function renderDrillSummary() {
  view = 'drillDone';
  const st = drillState(), run = st.run;
  const total = run ? run.queue.length : 0, correct = run ? run.correct : 0;
  const wrongIds = run ? run.queue.filter(id => run.results[id] && !run.results[id].ok) : [];
  $('#app').innerHTML = `<div class="page">
    <div class="eyebrow">間違い演習</div><h1 style="font-family:var(--gothic);font-size:18px">演習おわり</h1>
    <div class="summary"><div class="big">${correct}<small> / ${total} 正解</small></div>
      <p style="font-size:13.5px;color:var(--ink-2)">克服済み ${correct} 問。まだ間違えた ${wrongIds.length} 問は次回の演習に残ります。</p>
      ${wrongIds.length ? `<ul style="font-size:13px;padding-left:1.2em;margin:6px 0 0">${wrongIds.map(id => { const q = BANK.questions.find(x => x.id === id); return `<li>${esc(seasonById(q.season).label)} No.${q.no}　${esc(q.body.split('\n')[0].slice(0, 40))}</li>`; }).join('')}</ul>` : ''}
      <div class="row" style="margin-top:16px"><button class="btn" id="homeBtn">Homeへ</button>${wrongIds.length ? '<button class="btn ghost" id="againBtn">間違えた分をもう一度</button>' : ''}</div></div></div>`;
  st.run = null; save(LS.drill, st);
  $('#homeBtn').addEventListener('click', renderHome);
  const ag = $('#againBtn'); if (ag) ag.addEventListener('click', () => { const s2 = drillState(); s2.run = { queue: wrongIds, idx: 0, correct: 0, results: {}, startedAt: Date.now() }; save(LS.drill, s2); renderDrill(); });
}

// ====== 画面: 結果 ======
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const fmtDur = sec => `${Math.floor(sec / 60)}分${String(Math.round(sec % 60)).padStart(2, '0')}秒`;
let resultFilter = 'all';
function renderResult(rec) {
  view = 'result'; stopTicking();
  const s = seasonById(rec.seasonId);
  const elapsed = (rec.submittedAt - rec.startedAt) / 1000;
  const total = Object.keys(rec.answers).length;
  const fromSession = session && session.resultId === rec.id;
  $('#app').innerHTML = `<div class="page">
    <div class="eyebrow">${esc(s.label)}　${esc(fmtOf(s).label)}</div>
    <h1 style="font-family:var(--gothic);font-size:18px">採点結果${rec.reason === 'timeout' ? '（時間切れで自動提出）' : ''}</h1>
    <div class="score">
      <div class="big">${rec.score}<small> / 40</small></div>
      <div><div class="verdict ${rec.pass ? 'pass' : 'fail'}">${rec.pass ? '合格ライン到達' : '合格ラインまで ' + (rec.passLine - rec.score) + ' 点'}</div>
        <div style="font-size:12.5px;color:var(--ink-2)">合格基準 ${rec.passLine} 点（40問中60%）</div></div>
      <div class="detail">正答 ${rec.correct} 問 ／ 解答 ${total} 問${rec.excess ? ` ／ 指定数超過 ${rec.excess} 問（−${rec.excess * EXCESS_PENALTY} 点）` : ''}<br>
        所要時間 ${fmtDur(elapsed)}（制限 ${Math.round(rec.durationSec / 60)} 分）　受験日時 ${fmtDate(rec.startedAt)}${rec.name ? '　' + esc(rec.name) : ''}</div>
    </div>
    ${drillBox([rec], true)}
    <div class="section-h"><h2>セクション別</h2><span class="note">正答 / 指定数</span></div>
    <table class="sec"><tr><th>セクション</th><th style="text-align:right">解答</th><th style="text-align:right">正答</th><th style="width:34%">正答率</th></tr>
      ${rec.bySection.map(b => { const pct = b.need ? Math.round(b.correct / b.need * 100) : 0; return `<tr><td>${esc(b.label)}${b.excess ? `<br><span style="font-size:11px;color:var(--alert)">超過 ${b.excess} 問</span>` : ''}</td><td class="n">${b.answered}/${b.need}</td><td class="n">${b.correct}/${b.need}</td><td><span style="font-family:var(--mono);font-size:12px">${pct}%</span><div class="bar"><i style="width:${pct}%"></i></div></td></tr>`; }).join('')}
    </table>
    <div class="section-h"><h2>スコアレポート</h2></div>
    <div class="row">
      <button class="btn" id="printBtn">PDFで保存・印刷</button>
      <button class="btn ghost" id="jsonBtn">JSONで書き出す</button>
    </div>
    <div class="export-note">iPhone：印刷画面で「プリンタ」を選ばず、プレビューを<b>共有ボタン</b>（または長押し）→「"ファイル"に保存」でPDFになります。Android：印刷先で「PDFとして保存」。PC：印刷ダイアログで「PDFとして保存」。<br>レポートはこの端末内にだけ保存されます。JSONは記録の控え・共有用です。</div>
    <div class="section-h"><h2>問題別（押すと問題と正答を表示）</h2></div>
    <div class="filters">${[['all', 'すべて'], ['ng', '不正解'], ['na', '未解答'], ['flag', '見直し印']].map(([k, l]) => `<button class="chip${resultFilter === k ? ' on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
    <ul class="qlist" id="qlist"></ul>
    <div class="row" style="margin-top:22px;justify-content:space-between">
      <button class="btn ghost" id="homeBtn">${fromSession ? 'ホームへ戻る' : '← 戻る'}</button>
      <button class="btn ghost" id="delBtn" style="border-color:var(--rule);color:var(--ink-3);font-weight:400">この記録を削除</button>
    </div>
  </div>`;
  renderPrint(rec);
  bindDrillBox(rec);
  $('#printBtn').addEventListener('click', () => window.print());
  $('#jsonBtn').addEventListener('click', () => exportJSON(rec));
  const renderList = () => {
    const rows = rec.perQ.filter(p => resultFilter === 'all' || (resultFilter === 'ng' && p.graded && !p.ok && p.ua.length) || (resultFilter === 'na' && !p.ua.length) || (resultFilter === 'flag' && rec.flags[p.no]));
    $('#qlist').innerHTML = rows.length ? rows.map(p => {
      const q = qAt(rec.seasonId, p.no);
      const r = !p.ua.length ? ['na', '—'] : p.excess ? ['ex', '超'] : p.ok ? ['ok', '○'] : ['ng', '×'];
      return `<li><button class="qrow" data-no="${p.no}"><span class="no">${p.no}</span><span class="t">${esc(q.body.split('\n')[0])}</span><span class="a">${p.ua.length ? p.ua.join(',') : '—'} → ${(p.answer || ['?']).join(',')}${rec.flags[p.no] ? ' ⚑' : ''}</span><span class="r ${r[0]}">${r[1]}</span></button></li>`;
    }).join('') : '<li style="color:var(--ink-3);font-size:13px;padding:8px 4px">該当なし</li>';
    $('#qlist').querySelectorAll('.qrow').forEach(b => b.addEventListener('click', () => toggleReview(rec, b)));
  };
  renderList();
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { resultFilter = c.dataset.f; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); renderList(); }));
  $('#homeBtn').addEventListener('click', () => { if (fromSession) { session = null; persist(); } renderHome(); });
  $('#delBtn').addEventListener('click', () => openDialog(`<h2>この記録を削除しますか？</h2><p>${esc(s.label)}・${fmtDate(rec.startedAt)}・${rec.score} 点。元に戻せません。</p><div class="actions"><button class="btn ghost" data-act="close">戻る</button><button class="btn danger" data-act="del">削除する</button></div>`,
    { del: () => { save(LS.history, load(LS.history, []).filter(h => h.id !== rec.id)); if (fromSession) { session = null; persist(); } closeDialog(); renderHome(); } }));
  window.scrollTo(0, 0);
}
function renderPrint(rec) {
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; area.className = 'rp'; document.body.appendChild(area); }
  const s = seasonById(rec.seasonId), f = fmtOf(s);
  const elapsed = (rec.submittedAt - rec.startedAt) / 1000;
  const total = Object.keys(rec.answers).length;
  const secLabel = id => (f.sections.find(x => x.id === id) || {}).label || '';
  const shortSec = id => secLabel(id).replace('施工管理法（能力問題）', '能力').replace('建築設備等', '設備').replace('建築施工', '施工').replace('施工管理法', '管理').replace('建築学（必須）', '建築学必').replace('建築学（選択）', '建築学');
  const qtable = rows => `<table><tr><th class="n">No</th><th>区分</th><th class="n">解答</th><th class="n">正答</th><th>判定</th><th class="n">秒</th></tr>
    ${rows.map(p => { const r = !p.ua.length ? ['', '未'] : p.excess ? ['ng', '超過'] : p.ok ? ['ok', '○'] : ['ng', '×'];
      return `<tr><td class="n">${p.no}</td><td>${esc(shortSec(p.sectionId))}</td><td class="n">${p.ua.length ? p.ua.join(',') : '—'}</td><td class="n">${(p.answer || ['?']).join(',')}</td><td class="c ${r[0]}">${r[1]}</td><td class="n">${p.time}</td></tr>`; }).join('')}</table>`;
  const wrongs = rec.perQ.filter(p => p.ua.length && p.graded && !p.ok);
  area.innerHTML = `
    <div class="rp-h"><div class="t"><small>2級建築施工管理技術検定 第一次検定　模擬試験</small>スコアレポート</div>
      <div class="who">${rec.name ? esc(rec.name) + '<br>' : ''}${esc(s.label)}（${esc(f.label)}）<br>受験 ${fmtDate(rec.startedAt)}</div></div>
    <div class="rp-score"><div class="big">${rec.score}<small> / 40</small></div>
      <div><div class="v">${rec.pass ? '合格ライン到達' : '合格ライン未達'}</div><div style="font-size:9.5pt">合格基準 ${rec.passLine} 点（60%）${rec.pass ? '' : '　あと ' + (rec.passLine - rec.score) + ' 点'}</div></div>
      <div class="d">正答 ${rec.correct} 問 ／ 解答 ${total} 問 ／ 未解答 ${Math.max(0, 40 - total)} 問${rec.excess ? ` ／ 指定数超過 ${rec.excess} 問（−${rec.excess * EXCESS_PENALTY} 点）` : ''}　｜　所要時間 ${fmtDur(elapsed)}（制限 ${Math.round(rec.durationSec / 60)} 分）　｜　提出 ${rec.reason === 'timeout' ? '時間切れ（自動）' : '手動'}</div></div>
    <h2>セクション別成績</h2>
    <table><tr><th>セクション</th><th class="n">解答/指定</th><th class="n">正答</th><th style="width:38%">正答率</th></tr>
      ${rec.bySection.map(b => { const pct = b.need ? Math.round(b.correct / b.need * 100) : 0; return `<tr><td>${esc(b.label)}${b.excess ? `（超過 ${b.excess}）` : ''}</td><td class="n">${b.answered}/${b.need}</td><td class="n">${b.correct}</td><td><span style="font-family:var(--mono);font-size:8.5pt">${pct}%</span><div class="barp"><i style="width:${pct}%"></i></div></td></tr>`; }).join('')}
    </table>
    ${wrongs.length ? `<h2>不正解だった問題（復習リスト）</h2><ul class="wrongs">${wrongs.map(p => `<li>No.${p.no}（${esc(secLabel(p.sectionId))}）${esc(qAt(rec.seasonId, p.no).body.split('\n')[0].slice(0, 60))}　— 解答 ${p.ua.join(',')} → 正答 ${(p.answer || []).join(',')}</li>`).join('')}</ul>` : ''}
    <h2 class="pb">問題別の解答</h2>
    <div class="qcols">${qtable(rec.perQ.slice(0, 25))}${qtable(rec.perQ.slice(25))}</div>
    <div class="foot"><span>判定: ○正解 ×不正解 未=未解答 超過=指定数超過のため未採点</span><span>出力 ${fmtDate(Date.now())}</span></div>`;
  document.title = `スコアレポート_${s.id}_${new Date(rec.startedAt).toISOString().slice(0, 10)}`;
}
// スコア推移(SVG直書き): 横=受験順、縦=点数、合格ライン24
function trendChart(hist) {
  const W = 640, H = 200, L = 34, R = 12, T = 14, B = 30;
  const n = hist.length, xs = i => L + (n === 1 ? 0 : (W - L - R) * i / (n - 1)), ys = v => T + (H - T - B) * (1 - v / 40);
  const pts = hist.map((h, i) => [xs(i), ys(h.score)]);
  const line = pts.map(p => p.join(',')).join(' ');
  const grid = [0, 10, 20, 30, 40].map(v => `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="#e6e3da" stroke-width="1"/><text x="${L - 6}" y="${ys(v) + 4}" font-size="10" text-anchor="end" fill="#8a8a86">${v}</text>`).join('');
  const dots = hist.map((h, i) => `<circle cx="${xs(i)}" cy="${ys(h.score)}" r="4.5" fill="${h.pass ? '#2f7d4f' : '#c8371f'}" stroke="#fff" stroke-width="1.5"/><text x="${xs(i)}" y="${ys(h.score) - 9}" font-size="10.5" text-anchor="middle" fill="#1a1a1a" font-family="ui-monospace,monospace">${h.score}</text><text x="${xs(i)}" y="${H - 10}" font-size="9.5" text-anchor="middle" fill="#8a8a86">${seasonById(h.seasonId).id.replace('_early', '前').replace('_late', '後')}</text>`).join('');
  return `<div class="trend"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="スコアの推移">${grid}
    <line x1="${L}" x2="${W - R}" y1="${ys(24)}" y2="${ys(24)}" stroke="#c8371f" stroke-width="1" stroke-dasharray="4 3"/><text x="${W - R}" y="${ys(24) - 4}" font-size="10" text-anchor="end" fill="#c8371f">合格ライン 24</text>
    <polyline points="${line}" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>${dots}</svg>
    <div class="cap">スコアの推移（受験順）。緑＝合格ライン到達、赤＝未達。</div></div>`;
}
function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportAll() {
  const hist = load(LS.history, []);
  download(`sekokan_exam_history_${new Date().toISOString().slice(0, 10)}.json`,
    { app: 'sekokan-exam', bankVersion: BANK.version, bankBuiltAt: BANK.builtAt, exportedAt: new Date().toISOString(), settings: { name: settings.name }, records: hist });
}
function importJSON(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let data; try { data = JSON.parse(fr.result); } catch (e) { openDialog('<h2>読み込めません</h2><p>JSONファイルではないか、壊れています。</p><div class="actions"><span></span><button class="btn" data-act="close">閉じる</button></div>'); return; }
    const recs = Array.isArray(data.records) ? data.records : data.record ? [data.record] : Array.isArray(data) ? data : [];
    const valid = recs.filter(r => r && r.id && r.seasonId && seasonById(r.seasonId) && typeof r.score === 'number' && r.perQ && r.bySection);
    const hist = load(LS.history, []); const have = new Set(hist.map(h => h.id));
    let added = 0; for (const r of valid) if (!have.has(r.id)) { hist.push(r); have.add(r.id); added++; }
    hist.sort((a, b) => a.startedAt - b.startedAt); save(LS.history, hist);
    openDialog(`<h2>読み込みました</h2><p>${valid.length} 件中 ${added} 件を追加しました${valid.length - added ? `（${valid.length - added} 件は既にありました）` : ''}。${recs.length - valid.length ? `<br>${recs.length - valid.length} 件は形式が合わず取り込めませんでした。` : ''}</p><div class="actions"><span></span><button class="btn" data-act="close">閉じる</button></div>`);
    renderHome();
  };
  fr.readAsText(file);
}
function exportJSON(rec) {
  const s = seasonById(rec.seasonId);
  download(`sekokan_exam_${s.id}_${new Date(rec.startedAt).toISOString().slice(0, 10)}.json`,
    { app: 'sekokan-exam', bankVersion: BANK.version, bankBuiltAt: BANK.builtAt, exportedAt: new Date().toISOString(), record: rec });
}
function toggleReview(rec, btn) {
  const li = btn.parentElement, no = +btn.dataset.no;
  const ex = li.querySelector('.review');
  if (ex) { ex.remove(); btn.classList.remove('open'); return; }
  const q = qAt(rec.seasonId, no), p = rec.perQ.find(x => x.no === no), sec = sectionOf(seasonById(rec.seasonId), no);
  const ans = q.answer || [];
  const d = document.createElement('div'); d.className = 'review';
  d.innerHTML = `<p class="body">${esc(q.body)}</p>${q.bodyImgs.map(u => `<img class="img" src="${esc(u)}" alt="問題の図">`).join('')}
    <ol>${q.choices.map((c, i) => { const n = i + 1, isA = ans.includes(n), isU = p.ua.includes(n);
      return `<li class="${isA ? 'correct' : isU ? 'wrong' : ''}"><span class="n">${n}</span><span>${c.img ? `<img class="cimg" src="${esc(c.img)}" alt="選択肢${n}の図">` : esc(c.text)}</span>${isA ? '<span class="lab">正答</span>' : isU ? '<span class="lab">あなた</span>' : ''}</li>`; }).join('')}</ol>
    <div class="meta"><span>${esc(sec.label)}</span><span>滞在 ${p.time} 秒</span>${q.lawRevised ? '<span style="color:var(--warn)">※出題後に法改正あり（出題当時の基準で収録）</span>' : ''}${q.topic ? `<a href="index.html#${q.topic}" target="_blank" rel="noopener">教材で復習（${esc(q.topicName || q.topic)}）</a>` : ''}${q.src && q.src.text && q.src.text.startsWith('kakomonn:') ? `<a href="https://kenchikusekou2.kakomonn.com/questions/${q.src.text.slice(9)}" target="_blank" rel="noopener">解説を見る（過去問ドットコム）</a>` : ''}</div>`;
  li.appendChild(d); btn.classList.add('open');
}

// ====== ダイアログ ======
function openDialog(html, acts) {
  const dlg = $('#dlg'); $('#dlgBody').innerHTML = html;
  dlg.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { const a = b.dataset.act; if (a === 'close') closeDialog(); else if (acts && acts[a]) acts[a](); }));
  if (!dlg.open) dlg.showModal();
}
function closeDialog() { const dlg = $('#dlg'); if (dlg.open) dlg.close(); }

// ====== キーボード(PC) ======
document.addEventListener('keydown', e => {
  if (view !== 'exam' || $('#dlg').open || $('#drawer')) return;
  if (e.key === 'ArrowRight') go(session.cursor + 1);
  else if (e.key === 'ArrowLeft') go(session.cursor - 1);
  else if (/^[1-5]$/.test(e.key)) { const b = document.querySelector(`.choice[data-n="${e.key}"]`); if (b) b.click(); }
});

// ====== 起動 ======
(function boot() {
  if (!BANK) { $('#app').innerHTML = '<div class="page"><p>問題データが埋め込まれていません。<code>node scripts/embed_exam_bank.js</code> を実行してください。</p></div>'; return; }
  if (session && session.status === 'running') {
    const rs = remainSec();
    const s = seasonById(session.seasonId);
    if (rs <= 0) { renderExam(); return; }   // renderExam 内で timeout 提出
    renderHome();
    openDialog(`<h2>試験を再開しますか？</h2><p>${esc(s.label)}・残り ${Math.floor(rs / 60)} 分 ${rs % 60} 秒・解答 ${Object.keys(session.answers).length} 問。時間は中断中も進んでいます。</p>
      <div class="actions"><button class="btn ghost" data-act="discard">破棄する</button><button class="btn" data-act="resume">再開する</button></div>`,
      { resume: () => { closeDialog(); renderExam(); }, discard: () => { session = null; persist(); closeDialog(); renderHome(); } });
  } else if (session && session.status === 'submitted') {
    const r = load(LS.history, []).find(h => h.id === session.resultId);
    if (r) renderResult(r); else { session = null; persist(); renderHome(); }
  } else renderHome();
})();
</script>
