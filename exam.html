木質系素地面の塗装に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"オイルステイン塗りは、塗付け後、乾き切らないうちに余分な材料を拭き取った。"},{"text":"合成樹脂調合ペイント塗りの中塗りは、塗装回数を明らかにするため、上塗りと色を変えて塗装した。"},{"text":"つや有合成樹脂エマルションペイント塗りは、塗料の粘度の調整を水で行った。"},{"text":"クリヤラッカー塗りの下塗りは、ジンクリッチプライマーを用いた。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76402","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-28","season":"R5_late","no":28,"sectionId":"seko","field":"建築施工","topicName":"ビニル床シート","topic":null,"body":"ビニル床シート張りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"シートを幅木部に張り上げるため、ニトリルゴム系接着剤を使用した。"},{"text":"熱溶接工法では、シート張付け後、張付け用接着剤が硬化する前に溶接接合を行った。"},{"text":"シートを壁面に張り上げるため、床と壁が取り合う入隅部に面木を取り付けた。"},{"text":"湿気のおそれのある下地への張付けには、エポキシ樹脂系接着剤を使用した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76403","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-29","season":"R5_late","no":29,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"事前調査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄骨の建方計画に当たり、近隣の商店や工場の業種について調査を行うこととした。"},{"text":"敷地境界と敷地面積の確認のため、地積測量を行うこととした。"},{"text":"敷地内の建家、立木、工作物の配置を把握するため、平面測量を行うこととした。"},{"text":"根切り工事に当たり、埋蔵文化財の有無について調査を行うこととした。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76404","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-30","season":"R5_late","no":30,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"下小屋は、材料置場の近くに設置し、電力や水道等の設備を設けることとした。"},{"text":"工事用ゲートの有効高さは、鉄筋コンクリート造の工事のため、最大積載時のトラックアジテータの高さとすることとした。"},{"text":"工事現場の周辺状況により、危害防止上支障がないことから、仮囲いとしてガードフェンスを設置することとした。"},{"text":"工事用ゲートには、車両の入退場を知らせる標示灯を設置したが、周辺生活環境に配慮しブザーは設置しないこととした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76405","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-31","season":"R5_late","no":31,"sectionId":"kanri","field":"施工管理法","topicName":"材料の保管","topic":null,"body":"工事現場における材料の保管に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"巻いた壁紙は、くせが付かないように立てて保管した。"},{"text":"ビニル床タイルは、乾燥している床に箱詰め梱包のまま、積重ねを10段までとして保管した。"},{"text":"板ガラスは、クッション材を挟み、乾燥した場所に平積みで保管した。"},{"text":"防水用の袋入りアスファルトは、積重ねを10段までとして保管した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76406","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-32","season":"R5_late","no":32,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"工程計画の立案段階で考慮すべき事項として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"最初に全ての工種別の施工組織体系を把握する。"},{"text":"敷地周辺の上下水道やガス等の公共埋設物を把握する。"},{"text":"鉄骨工事の工程計画では、資材や労務の調達状況を調査して、手配を計画する。"},{"text":"型枠工事の工程計画では、型枠存置期間を考慮して、せき板や支保工の転用を検討する。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76407","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-33","season":"R5_late","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"バーチャート/ネットワーク工程表","topic":"t29","body":"バーチャート工程表の特徴に関する記述として、ネットワーク工程表と比較した場合、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"手軽に作成することができ、視覚的に工程が把握しやすい。"},{"text":"作業間調整に伴う修正がしやすい。"},{"text":"前工程の遅れによる後工程への影響が把握しにくい。"},{"text":"全体工期の短縮を検討する場合、工程のどこを縮めればいいのかわかりにくい。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76408","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-34","season":"R5_late","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"品質管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"品質計画に基づく施工の試験又は検査の結果は、次の計画や設計に活かす。"},{"text":"川上管理とは、品質に与える影響が大きい前段階や生産工程の上流で品質を管理することである。"},{"text":"施工品質管理表（QC工程表）とは、管理項目について管理値、検査の時期、方法、頻度等を明示したものである。"},{"text":"試験とは、性質又は状態を調べ、判定基準と比較して良否の判断を下すことである。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76409","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-35","season":"R5_late","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"トルシア形ボルト","topic":null,"body":"トルシア形高力ボルトのマーキングに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"マーキングは、高力ボルトの取付け後、直ちに行う。"},{"text":"マーキングは、ボルト軸からナット、座金及び母材にかけて一直線に行う。"},{"text":"マークのずれによって、軸回りの有無を確認できる。"},{"text":"マークのずれによって、本締め完了の確認ができる。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76410","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-36","season":"R5_late","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"コンクリート試験・受入","topic":"t21","body":"コンクリートの試験に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"1回の圧縮強度試験の供試体の個数は、3個とした。"},{"text":"1回の圧縮強度試験は、コンクリート打込み日ごと、打込み工区ごと、かつ、150m3以下にほぼ均等に分割した単位ごとに行った。"},{"text":"スランプの測定値は、スランプコーンを引き上げた後の、平板からコンクリート最頂部までの高さとした。"},{"text":"スランプ試験において、スランプコーンを引き上げた後、コンクリートが偏って形が不均衡になったため、別の試料によって新たに試験を行った。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76411","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-37","season":"R5_late","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"危害・迷惑対策","topic":null,"body":"建築工事における危害又は迷惑と、それを防止するための対策に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"高所作業による工具等の落下を防ぐため、水平安全ネットを設置した。"},{"text":"工事用車両による道路面の汚れを防ぐため、洗浄装置を設置した。"},{"text":"掘削による周辺地盤の崩壊を防ぐため、防護棚を設置した。"},{"text":"解体工事による粉塵の飛散を防ぐため、散水設備を設置した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76412","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-38","season":"R5_late","no":38,"sectionId":"kanri","field":"施工管理法","topicName":"労働安全衛生(届出等)","topic":"t35","body":"建設業の現場における特定元方事業者が講ずべき措置として、「労働安全衛生法」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"機械等が転倒するおそれがある場所において関係請負人の労働者が作業を行うとき、その関係請負人に対する技術上の指導を行うこと。"},{"text":"関係請負人が行う安全教育に対して、安全教育に使用する資料を提供すること。"},{"text":"特定元方事業者の労働者及び関係請負人の労働者の作業が同一の場所において行われるとき、作業間の連絡及び調整を行うこと。"},{"text":"足場の組立て作業において、材料の欠点の有無を点検し、不良品を取り除くこと。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76413","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-39","season":"R5_late","no":39,"sectionId":"ability","field":"施工管理法","topicName":"型枠工事","topic":"t22","body":"型枠の支保工に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"上下階の支柱は、できるだけ平面上の同一位置になるように設置した。"},{"text":"地盤上に直接支柱を立てるため、支柱の下に剛性のある敷板を敷いた。"},{"text":"支柱は、パイプサポートを3本継ぎとした。"},{"text":"パイプサポートに設ける水平つなぎは、番線を用いて緊結した。"}],"answer":[3,4],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76414","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-40","season":"R5_late","no":40,"sectionId":"ability","field":"施工管理法","topicName":"型枠存置","topic":"t22","body":"型枠の存置期間に関する一般的な記述として、不適当なものを2つ選べ。ただし、計画供用期間の級は標準とする。","bodyImgs":[],"choices":[{"text":"コンクリートの材齢によるせき板の最小存置期間は、普通ポルトランドセメントと高炉セメントB種では同じである。"},{"text":"コンクリートの材齢によるせき板の最小存置期間は、同じセメントの種類の場合、存置期間中の平均気温の高低に係わらず同じである。"},{"text":"せき板の最小存置期間を定めるコンクリートの圧縮強度は、柱と壁は同じである。"},{"text":"梁下のせき板の最小存置期間を定めるコンクリートの圧縮強度は、コンクリートの設計基準強度が同じ場合、セメントの種類に係わらず同じである。"}],"answer":[1,2],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76415","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-41","season":"R5_late","no":41,"sectionId":"ability","field":"施工管理法","topicName":"防水工事","topic":"t23","body":"合成高分子系ルーフィングシート防水の接着工法に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"加硫ゴム系シート防水において、プライマーを塗布する範囲は、その日にシートを張り付ける範囲とした。"},{"text":"加硫ゴム系シート防水において、接着剤を塗布後、オープンタイムを置かずにシートを張り付けた。"},{"text":"塩化ビニル樹脂系シート防水において、シートを張り付けるエポキシ樹脂系接着剤は、シート裏面に塗布した。"},{"text":"塩化ビニル樹脂系シート防水において、防水層の立上り末端部は、押え金物で固定し、不定形シール材を用いて処理した。"}],"answer":[2,3],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76416","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-42","season":"R5_late","no":42,"sectionId":"ability","field":"施工管理法","topicName":"外壁仕上げの劣化とその改修工法","topic":null,"body":"外壁仕上げの劣化とその改修工法に関する記述として、不適当なものを2つ選べ。","bodyImgs":[],"choices":[{"text":"コンクリート打放し面のひび割れは、ポリマーセメントモルタル充填工法で改修した。"},{"text":"劣化した既存複層仕上塗材は、高圧水洗で除去した。"},{"text":"タイル張り仕上げの浮きは、Uカットシール材充填工法で改修した。"},{"text":"モルタル塗り仕上げの浮きは、アンカーピンニング部分エポキシ樹脂注入工法で改修した。"}],"answer":[1,3],"answerMode":"multi2","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76417","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-43","season":"R5_late","no":43,"sectionId":"hoki","field":"法規","topicName":"用語の定義","topic":"t32","body":"用語の定義に関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"基礎は、構造耐力上主要な部分であるが、主要構造部ではない。"},{"text":"電波塔に設けた展望室は、建築物である。"},{"text":"コンビニエンスストアは、特殊建築物ではない。"},{"text":"コンクリートや石は、耐水材料である。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76418","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-44","season":"R5_late","no":44,"sectionId":"hoki","field":"法規","topicName":"換気","topic":"t1","body":"地上階における居室の採光及び換気に関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"採光に有効な部分の面積を計算する際、天窓は実際の面積よりも大きな面積を有する開口部として扱う。"},{"text":"換気設備のない居室には、原則として、換気に有効な部分の面積がその居室の床面積の1／20以上の換気のための窓その他の開口部を設けなければならない。"},{"text":"病院の診察室には、採光のための窓その他の開口部を設けなければならない。"},{"text":"ふすま、障子その他随時開放することができるもので仕切られた2室は、居室の採光及び換気の規定の適用に当たっては、1室とみなす。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76419","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-45","season":"R5_late","no":45,"sectionId":"hoki","field":"法規","topicName":"建設業の許可","topic":"t34","body":"建設業の許可に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"2以上の都道府県の区域内に営業所を設けて営業しようとする者が建設業の許可を受ける場合には、国土交通大臣の許可を受けなければならない。"},{"text":"国又は地方公共団体が発注者である建設工事を請け負う者は、特定建設業の許可を受けていなければならない。"},{"text":"建築工事業で一般建設業の許可を受けている者は、発注者から直接請け負う1件の建設工事の下請代金の総額が7,000万円の下請契約をすることができない。"},{"text":"解体工事業で一般建設業の許可を受けている者は、発注者から直接請け負う1件の建設工事の下請代金の総額が4,500万円の下請契約をすることができない。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":["mergedFallback","override"],"src":{"text":"merged:No.43","answer":"answers/R5_late_answers.csv"},"lawRevised":true,"overrideNote":"過去問ドットコムに未収録(法改正で削除)。PDF由来本文の『V建設業法W』・欠落数字『2以上』『1件』・ページフッタを手動修復。正答は公式CSV(2)。"},{"id":"R5_late-46","season":"R5_late","no":46,"sectionId":"hoki","field":"法規","topicName":"建設業 請負契約","topic":"t34","body":"建設工事の請負契約書に記載しなければならない事項として、「建設業法」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"工事の履行に必要となる建設業の許可の種類及び許可番号"},{"text":"当事者の一方から設計変更の申出があった場合における工期の変更、請負代金の額の変更又は損害の負担及びそれらの額の算定方法に関する定め"},{"text":"天災その他不可抗力による工期の変更又は損害の負担及びその額の算定方法に関する定め"},{"text":"注文者が工事の全部又は一部の完成を確認するための検査の時期及び方法並びに引渡しの時期"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76421","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-47","season":"R5_late","no":47,"sectionId":"hoki","field":"法規","topicName":"労働基準法","topic":"t35","body":"労働契約に関する記述として、「労働基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"使用者は、労働契約の不履行について、違約金とその支払の方法を定めて契約しなければならない。"},{"text":"使用者は、労働契約に附随して貯蓄の契約をさせてはならない。"},{"text":"使用者は、労働することを条件とする前貸の債権と賃金を相殺してはならない。"},{"text":"使用者は、労働契約の締結に際し、労働者に対して就業の場所及び従事すべき業務に関する事項を明示しなければならない。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:76422","answer":"answers/R5_late_answers.csv"}},{"id":"R5_late-48","season":"R5_late","no":48,"sectionId":"hoki","field":"法規","topicName":"労働安全衛生(届出等)","topic":"t35","body":"事業者が、新たに職務に就くことになった職長に対して行う安全衛生教育に関する事項として、「労働安全衛生法」上、定められていないものはどれか。ただし、作業主任者を除くものとする。","bodyImgs":[],"choices":[{"text":"労働者の配置に関すること"},{"text":"作業方法の決定に関すること"},{"text":"労働者に対する指導又は監督の方法に関すること"},{"text":"作業環境測定の実施に関すること"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kak 床タイル用接着剤は、換気のよい場所に保管した。"},{"text":"ALCパネルは、台木を水平に置いた上に平積みで保管した。"},{"text":"左官用の砂は、周辺地盤より高い場所に、水はけをよくした置場を設置して保管した。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81329","answer":null}},{"id":"R6_early-31","season":"R6_early","no":31,"sectionId":"kanri","field":"施工管理法","topicName":null,"topic":null,"body":"建築工事の工程計画及び工程管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"基本工程表は、工事全体を一つの工程表としてまとめたもので、工事の主要な作業の進捗を表示する。"},{"text":"各作業の実働日数は、作業の総施工数量に1日当たりの施工数量を乗じて求める。"},{"text":"工程計画を立てるに当たり、その地域の雨天日や強風日等を推定して作業不能日を設定する。"},{"text":"暦日とは、実働日数に作業休止日を考慮した日数である。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81330","answer":null}},{"id":"R6_early-32","season":"R6_early","no":32,"sectionId":"kanri","field":"施工管理法","topicName":null,"topic":null,"body":"バーチャート工程表の一般的な特徴に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"各工事間の細かい作業工程の関連性が把握しにくい。"},{"text":"工程上で重点管理する必要がある作業が判断しやすい。"},{"text":"複雑な時間計算が不要であるため、作成しやすい。"},{"text":"各作業の開始時期、終了時期及び所要期間が把握しやすい。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81331","answer":null}},{"id":"R6_early-33","season":"R6_early","no":33,"sectionId":"kanri","field":"施工管理法","topicName":null,"topic":null,"body":"品質管理の検査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"抜取検査は、ある程度の不良品の混入が許される場合に適用される。"},{"text":"抜取検査は、品物がロットとして検査できない場合に適用される。"},{"text":"全数検査は、不良品を見逃すと後工程に重大な影響を与える場合に適用される。"},{"text":"全数検査は、検査費用に比べて得られる効果が大きい場合に適用される。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81332","answer":null}},{"id":"R6_early-34","season":"R6_early","no":34,"sectionId":"kanri","field":"施工管理法","topicName":null,"topic":null,"body":"品質管理のための試験及び検査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄筋工事において、ガス圧接部のふくらみの直径の確認は、デジタルノギスを用いて行った。"},{"text":"タイル工事において、タイルの浮きの確認は、テストハンマーを用いて行った。"},{"text":"木工事において、造作用木材の含水率の確認は、高周波水分計を用いて行った。"},{"text":"鉄骨工事において、隅肉溶接のサイズの確認は、マイクロメーターを用いて行った。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81333","answer":null}},{"id":"R6_early-35","season":"R6_early","no":35,"sectionId":"kanri","field":"施工管理法","topicName":null,"topic":null,"body":"コンクリートの試験及び検査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"フレッシュコンクリートの荷卸し地点での検査におけるスランプ試験は、0.5cm単位で測定した。"},{"text":"フレッシュコンクリートの荷卸し地点での検査における普通コンクリートの空気量の許容差は、±2.5％とした。"},{"text":"コンクリートの打込み中に品質の変化が認められたため、再度スランプ試験を行った。"},{"text":"試験に用いる試料は、トラックアジテータから採取する直前に、アジテータで高速攪拌した。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81334","answer":null}},{"id":"R6_early-36","season":"R6_early","no":36,"sectionId":"kanri","field":"施工管理法","topicName":null,"topic":null,"body":"工事現場の安全管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"新規入場者教育とは、新しく現場に入場した者に対して、作業所の方針、安全施工サイクルの具体的な内容、作業手順等を教育することである。"},{"text":"KY（危険予知）活動とは、作業に伴う危険性又は有害性に対し、作業グループが正しい行動を互いに確認し合う活動である。"},{"text":"TBM（ツールボックスミーティング）とは、職長を中心に、作業開始前の短時間で、当日の安全作業について話し合う活動である。"},{"text":"OJT（オンザジョブトレーニング）とは、施工の安全を図るため、毎日、毎週、毎月の基本的な実施事項を定型化し、継続的に実施する活動である。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81335","answer":null}},{"id":"R6_early-37","season":"R6_early","no":37,"sectionId":"kanri","field":"施工管理法","topicName":null,"topic":null,"body":"事業者の講ずべき措置として、「労働安全衛生規則」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"高さが2m以上の構造の足場の組立て、解体又は変更の作業を行う区域内には、関係労働者以外の労働者の立入りを禁止すること。"},{"text":"高さが2m以上の構造の足場の組立て、解体又は変更の時期、範囲及び順序を当該作業に従事する労働者に周知させること。"},{"text":"型枠支保工の組立て等作業主任者を選任すること。"},{"text":"型枠支保工の組立て等の作業の方法を決定し、作業を直接指揮すること。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81336","answer":null}},{"id":"R6_early-38","season":"R6_early","no":38,"sectionId":"ability","field":"施工管理法","topicName":null,"topic":null,"body":"型枠工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"柱型枠の足元は、型枠の変形防止やセメントペーストの漏出防止等のため、桟木で根巻きを行った。"},{"text":"梁の側型枠の寸法をスラブ下の梁せいとし、取り付く底型枠の寸法を梁幅で加工した。"},{"text":"外周梁の側型枠の上部は、コンクリートの側圧による変形防止のため、スラブ引き金物で固定した。"},{"text":"横に長い窓開口部の下端には、コンクリートの吹出しを防ぐため、両端部に蓋をした。"},{"text":"階段が取り付く壁型枠は、敷き並べた型枠パネル上に現寸で墨出しをしてから加工した。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81337","answer":null}},{"id":"R6_early-39","season":"R6_early","no":39,"sectionId":"ability","field":"施工管理法","topicName":null,"topic":null,"body":"コンクリートの養生に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"寒中コンクリート工事において、コンクリート温度の低下を防ぐため、加熱養生期間中は湿潤養生を行わないようにする。"},{"text":"寒冷期において、コンクリートの凝結硬化の初期段階で凍結して、硬化しなかったり、所定の強度が得られないことを初期凍害という。"},{"text":"コンクリートの湿潤養生期間は、一般に、使用するセメントの種類と計画供用期間の級によって決まる。"},{"text":"コンクリート面が露出している部分を水密シートによって被覆することは、初期の湿潤養生として有効である。"},{"text":"強度の発現が損なわれることがあるため、硬化過程にあるコンクリートには振動を与えないようにする。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81338","answer":null}},{"id":"R6_early-40","season":"R6_early","no":40,"sectionId":"ability","field":"施工管理法","topicName":null,"topic":null,"body":"コンクリート壁下地のセメントモルタル塗りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"下塗り、中塗り、上塗りの各層の塗厚は、6mm程度とした。"},{"text":"モルタルの1回の練混ぜ量は、60分以内に使い切れる量とした。"},{"text":"乾燥収縮によるひび割れの防止のため、保水剤を混和剤として使用した。"},{"text":"下塗り後、むらが著しかったため、中塗りの前にむら直しを行った。"},{"text":"上塗りモルタルの調合は、下塗りモルタルよりも富調合とした。"}],"answer":null,"answerMode":"single","hasImage":false,"verified":false,"flags":[],"src":{"text":"kakomonn:81339","answer":null}},{"id":"R6_early-41","season":"R6_early","no":41,"sectionId":"ability","field":"施工管理法","topicName":null,"topic":null,"body":"カーペット敷きに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"タイルカーペットは、粘着剥離形の接着剤を用いて張り付けた。"},{"text":"グリッパー工法に用いるグリッパーは、壁に密着させて取り付けた。"},{"text":"ウィルトンカーペットは、はぎ合わせを手縫いでつづり縫いとした。"},{"text":"タフテッドカーペットの敷込みは、全面接着工法とした。"}, :[{"text":"H形鋼の大梁に架けられる小梁には、大梁の横座屈を拘束する働きがある。"},{"text":"大空間を必要とする建築物に用いる長大な梁は、トラス梁とすることで軽量化を図ることができる。"},{"text":"柱は、細長比が小さいものほど座屈しやすい。"},{"text":"鉄骨構造の柱は、鉄筋コンクリート構造の柱に比べ、小さな断面で大きな荷重に耐えることができる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81356","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-8","season":"R6_late","no":8,"sectionId":"gaku","field":"建築学","topicName":"鉄骨構造の接合","topic":"t7","body":"鉄骨構造の接合に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"普通ボルトを接合に用いる建築物は、延べ面積、軒の高さ、張り間について、規模の制限がある。"},{"text":"高力ボルト接合の形式には、摩擦接合、引張接合、支圧接合等があり、このうち摩擦接合が多く用いられる。"},{"text":"隅肉溶接は、母材の端部を切り欠いて開先をとり、そこに溶着金属を盛り込んで溶接継目を形づくるものである。"},{"text":"完全溶込み溶接の有効のど厚は、接合される母材の板厚が異なる場合、薄い方の板厚とする。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81357","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-9","season":"R6_late","no":9,"sectionId":"gaku","field":"建築学","topicName":"基礎・地盤","topic":"t9","body":"基礎杭に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"場所打ちコンクリート杭工法には、アースオーガーを使用するプレボーリング拡大根固め工法がある。"},{"text":"節部付きの遠心力高強度プレストレストコンクリート杭（節杭）は、一般に杭本体部に外径が軸径よりも大きい節部を一定間隔で設けたもので、摩擦杭として用いられる。"},{"text":"外殻鋼管付きのコンクリート杭（SC杭）は、大きな水平力が作用する杭に適している。"},{"text":"既製杭工法には、鋼管の先端を加工した鋼管杭本体を回転させて地盤に埋設させる回転貫入工法がある。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81358","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-10","season":"R6_late","no":10,"sectionId":"gaku","field":"建築学","topicName":"荷重・外力","topic":"t10","body":"建築物の構造設計における荷重及び外力に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"風圧力と地震力は、同時に作用しないものとして応力を計算する。"},{"text":"風圧力は、その地方における過去の台風の記録に基づいて定められた風速に風力係数のみを乗じて計算する。"},{"text":"屋根面における積雪量が不均等となるおそれのある場合、その影響を考慮して積雪荷重を計算する。"},{"text":"多雪区域では、積雪荷重を短期荷重だけでなく長期荷重としても考慮して応力を計算する。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81359","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-11","season":"R6_late","no":11,"sectionId":"gaku","field":"建築学","topicName":null,"topic":null,"body":"図に示す片持ち梁の点Aに集中荷重Pが作用したときの曲げモーメント図として、正しいものはどれか。ただし、曲げモーメントは、材の引張側に描くものとする。","bodyImgs":["exam_img/R6_late/q11.webp"],"choices":[{"img":"exam_img/R6_late/a11_1.webp"},{"img":"exam_img/R6_late/a11_2.webp"},{"img":"exam_img/R6_late/a11_3.webp"},{"img":"exam_img/R6_late/a11_4.webp"}],"answer":[1],"answerMode":"single","hasImage":true,"verified":true,"flags":[],"src":{"text":"kakomonn:81360","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-12","season":"R6_late","no":12,"sectionId":"gaku","field":"建築学","topicName":"鋼材の性質","topic":"t11","body":"構造用鋼材に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"密度は、約2.3g／cm3である。"},{"text":"強い力を加えることにより、常温でも長く伸ばしたり、薄く展延することができる。"},{"text":"ヤング係数は、約2.05✕105N／mm2である。"},{"text":"熱処理により、強度等の機械的性質を変化させることができる。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81361","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-13","season":"R6_late","no":13,"sectionId":"gaku","field":"建築学","topicName":"タイル(JIS規定)","topic":null,"body":"日本産業規格（JIS）に規定するセラミックタイルに関する記述として、不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ユニットタイルは、多数個のタイルを並べて連結したもので、タイル先付けプレキャストコンクリート工法に用いるものは含まない。"},{"text":"裏連結ユニットタイルの裏連結材には、施工時に剥がすタイプと剥がさないタイプがある。"},{"text":"定形タイルは、正方形及び長方形のタイルで、装飾のため側面を非直線状にしたタイルは含まない。"},{"text":"タイルの吸水率による種類は、Ⅰ類、Ⅱ類、Ⅲ類に区分される。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81362","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-14","season":"R6_late","no":14,"sectionId":"gaku","field":"建築学","topicName":"シーリング材の特徴","topic":"t14","body":"シーリング材の特徴に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ポリサルファイド系シーリング材は、表面に塗った仕上材を変色させることがある。"},{"text":"アクリルウレタン系シーリング材は、ガラス回り目地に適していない。"},{"text":"シリコーン系シーリング材は、耐候性、耐久性に劣る。"},{"text":"ポリウレタン系シーリング材は、紫外線によって変色することがある。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81363","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-15","season":"R6_late","no":15,"sectionId":"setsu","field":"建築設備等","topicName":"アスファルト舗装","topic":null,"body":"アスファルト舗装工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"路盤は、舗装路面に作用する荷重を分散させて路床に伝えるものである。"},{"text":"表層は、交通荷重による摩耗とせん断力に抵抗し、平坦で滑りにくく快適な走行性を確保するものである。"},{"text":"プライムコートは、路床の仕上がり面を保護し、路床と路盤との接着性を向上させるものである。"},{"text":"フィラーは、アスファルトと一体となって骨材の間隙を充填するものである。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81364","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-16","season":"R6_late","no":16,"sectionId":"setsu","field":"建築設備等","topicName":"電気設備","topic":null,"body":"建築物の電気設備とそれに関する用語の組合せとして、最も関係の少ないものはどれか。","bodyImgs":[],"choices":[{"text":"電力設備 ―――― 情報用アウトレット"},{"text":"防犯設備 ―――― ICカードリーダー"},{"text":"幹線設備 ―――― ケーブルラック"},{"text":"照明設備 ―――― ペンダント型"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81365","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-17","season":"R6_late","no":17,"sectionId":"setsu","field":"建築設備等","topicName":"給排水設備","topic":"t15","body":"給排水設備に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"圧力水槽方式は、給水圧力の変動が大きく、停電時には給水が期待できない。"},{"text":"水道直結直圧方式は、水道本管から分岐した水道引込み管に増圧給水装置を直結し、建物各所に給水するものである。"},{"text":"排水トラップの破封を防止するため、排水系統に通気管を設ける。"},{"text":"中水道とは、水の有効利用を図るため、排水を回収して処理、再生し、雑用水等に再利用する水道のことである。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81366","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-18","season":"R6_late","no":18,"sectionId":"seko","field":"建築施工","topicName":"土工事・埋戻し","topic":null,"body":"土工事の埋戻し及び締固めに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"粘性土による埋戻しを行うため、余盛りの量を砂質土を用いる場合より多くした。"},{"text":"埋戻し土に用いる砂質土は、粒度試験を行い均等係数が小さいものを使用した。"},{"text":"入隅等狭い箇所での締固めは、振動コンパクターを使用した。"},{"text":"透水性のよい山砂による埋戻しを行うため、水締めで締め固めた。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81367","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-19","season":"R6_late","no":19,"sectionId":"seko","field":"建築施工","topicName":"鉄筋のかぶり厚","topic":"t20","body":"鉄筋のかぶり厚さ及びスペーサーに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"直接土に接する布基礎の立上り部の最小かぶり厚さは、30mmとした。"},{"text":"腹筋を外付けする大梁の最小かぶり厚さは、幅止め筋の外側表面から確保した。"},{"text":"柱のスペーサーは、上段を梁下より500mm程度の位置から割り付けた。"},{"text":"スラブに用いるスペーサーは、鋼製とした。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81368","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-20","season":"R6_late","no":20,"sectionId":"seko","field":"建築施工","topicName":"型枠支保工","topic":"t22","body":"型枠支保工に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"パイプサポートの脚部は、敷板に釘で固定した。"},{"text":"階段等の斜め型枠に対してパイプサポートを鉛直にして建て込むため、パイプサポートの先端にピポット型ベース金具を取り付けた。"},{"text":"スラブ型枠の支保工に軽量型支保梁を用い、支保梁中央部の下弦材をパイプサポートで支持した。"},{"text":"支柱に使用したパイプサポートの継手は、差込み継手とした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81369","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-21","season":"R6_late","no":21,"sectionId":"seko","field":"建築施工","topicName":null,"topic":null,"body":"在来軸組構法の木工事における継手の名称と図の組合せとして、不適当なものはどれか。","bodyImgs":[],"choices":[{"img":"exam_img/R6_late/a21_1.webp"},{"img":"exam_img/R6_late/a21_2.webp"},{"img":"exam_img/R6_late/a21_3.webp"},{"img":"exam_img/R6_late/a21_4.webp"}],"answer":[4],"answerMode":"single","hasImage":true,"verified":true,"flags":[],"src":{"text":"kakomonn:81370","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-22","season":"R6_late","no":22,"sectionId":"seko","field":"建築施工","topicName":"RC構造","topic":"t6","body":"鉄筋コンクリート構造の建築物の解体工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"地上作業による解体は、地上から解体用機械で行い、原則として、上階から下階へ床、梁、壁、柱の順に解体を進める。"},{"text":"階上作業による解体は、屋上に揚重した解体用機械で最上階から解体し、解体で発生したコンクリート塊を利用してスロープをつくり、解体用機械を下階に移動させながら行う。"},{"text":"外周部の転倒工法は、最初に柱脚部の柱主筋をすべて切断し、次に壁下部の水平方向、壁及び梁端部の垂直方向の縁切りを行った後に転倒させる。"},{"text":"部材解体工法は、カッターやワイヤーソーを使用して躯体を部材ごと又はブロック単位に切り離し、切り離した部材をクレーン等で地上に吊り降ろしてから分別解体を行う。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81371","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-23","season":"R6_late","no":23,"sectionId":"seko","field":"建築施工","topicName":"タイル張り工事","topic":"t24","body":"タイル張りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"床タイル張りにおいて、張付け面積が小さいため、下地は貧調合の敷きモルタルとした。"},{"text":"床タイルの圧着張りにおいて、張付けモルタルは、塗厚を5mmから7mmとし、1度に塗り付けた。"},{"text":"外壁タイルの改良積上げ張りにおいて、小口タイルの1日の張付け高さは、1.5mとした。"},{"text":"外壁タイルの接着剤張りにおいて、使用する接着剤は、練混ぜの必要がない一液反応硬化形のものを使用した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81372","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-24","season":"R6_late","no":24,"sectionId":"seko","field":"建築施工","topicName":"金属の表面仕上","topic":null,"body":"金属材料の表面仕上げに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"アルミニウム材の表面に、陽極酸化処理の後、金属塩を含む電解溶液中で二次的な電解処理により着色した仕上げを電解着色皮膜という。"},{"text":"アルミニウム材の表面に、陽極酸化処理の後、塗装を施した仕上げを陽極酸化塗装複合皮膜という。"},{"text":"ステンレス材の表面に、化学処理により図柄や模様を施した仕上げをエッチングという。"},{"text":"ステンレス材の表面に、凹凸の浮出し模様を施した仕上げをヘアラインという。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81373","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-25","season":"R6_late","no":25,"sectionId":"seko","field":"建築施工","topicName":"ガラス工事","topic":null,"body":"外部に面するサッシのガラス工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"網入り板ガラスは、ガラスの下辺小口及び縦小口の下端より1／4の高さまで防錆処置をした。"},{"text":"フロート板ガラスの切断面は、エッジ強度の低下を防ぐため、クリーンカット（クリアカット）とした。"},{"text":"グレイジングチャンネルの継目の位置は、ガラスの下辺中央部とした。"},{"text":"ガラス溝内に置くセッティングブロックは、ガラス1枚につき2か所設置した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81374","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-26","season":"R6_late","no":26,"sectionId":"seko","field":"建築施工","topicName":"塗装の素地ごしらえ","topic":"t25","body":"塗装工事における素地ごしらえに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"亜鉛めっき鋼面の付着物の除去には、ワイヤーブラシを用いた。"},{"text":"けい酸カルシウム板面の吸込止めは、穴埋めやパテかいの後に塗布した。"},{"text":"鉄鋼面の黒皮の除去は、ショットブラスト処理により行った。"},{"text":"木部面の穴埋めは、節止めを行ってからパテを充填した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81375","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-27","season":"R6_late","no":27,"sectionId":"seko","field":"建築施工","topicName":"せっこうボード張り","topic":null,"body":"壁のせっこうボード張りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鋼製下地に張り付ける場合のドリリングタッピンねじの頭は、ボード面と同面となるように締め込んだ。"},{"text":"重ね張りの上張りボードは、接着剤とステープルを併用して張り付けた。"},{"text":"目透し工法で仕上げる場合、スクェアエッジのボードを使用した。"},{"text":"出隅部には、衝突による損傷防止のため、コーナー保護金物を使用した。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81376","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-28","season":"R6_late","no":28,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"事前調査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"着工に当たって、埋蔵文化財の有無について調査を行うこととした。"},{"text":"着工に当たって、敷地の高低差や既存樹木が設計図書と整合しているか確認をすることとした。"},{"text":"土の掘削計画に当たって、振動が発生するため、近隣の商店や工場の業種の調査を行うこととした。"},{"text":"防護棚の設置に当たって、敷地の高低差や地中埋設配管の位置の確認をすることとした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81377","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-29","season":"R6_late","no":29,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"既存の塀が所定の高さを有し、危害を十分防止し得る構造であったため、仮囲いとして使用することとした。"},{"text":"工事用ゲートを複数設置するため、守衛所をメインのゲート脇に設置し、その他は警備員だけを配置することとした。"},{"text":"塗料や溶剤等の保管場所は、管理をしやすくするため、資材倉庫の一画を不燃材料で間仕切り、設置することとした。"},{"text":"施工者用事務所と監理者用事務所は、機能が異なるため、部屋を分けて設けることとした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81378","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-30","season":"R6_late","no":30,"sectionId":"kanri","field":"施工管理法","topicName":"申請・届出","topic":"t33","body":"建築工事に係る届出に関する記述として、不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"掘削深さが10m以上である地山の掘削を行うため、建設工事計画届を労働基準監督署長に届け出た。"},{"text":"延べ面積が10m2を超える建築物を除却するため、建築物除却届を労働基準監督署長に届け出た。"},{"text":"仮設のゴンドラを設置するため、ゴンドラ設置届を労働基準監督署長に届け出た。"},{"text":"耐火建築物に吹き付けられた石綿等の除去作業を行うため、建設工事計画届を労働基準監督署長に届け出た。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81379","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-31","season":"R6_late","no":31,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"工程計画の検討に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工区割りを行い、後続作業を並行して始めることにより、工期短縮が可能か検討する。"},{"text":"作業ごとに1日当たりの作業量が、それぞれ均等になるように調整する。"},{"text":"工程計画上のマイルストーン（管理日）は、工程上の重要な区切りを避けて計画する。"},{"text":"工事を行う地域における労務、資材、機材等の調達状況を調査して、手配を計画する。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81380","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-32","season":"R6_late","no":32,"sectionId":"kanri","field":"施工管理法","topicName":"バーチャート/ネットワーク工程表","topic":"t29","body":"バーチャート工程表に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"出来高の累計を重ねて表現したものは、工事出来高の進捗状況が把握しやすい。"},{"text":"建築現場で長年にわたって使用されており、工事全体の工程がわかりやすい。"},{"text":"各作業の相互関係がわかりやすく、クリティカルパスが把握しやすい。"},{"text":"各作業ごとの日程及び工事全体の工程計画が作成しやすい。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81381","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-33","season":"R6_late","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"次のうち、品質管理に関する用語として、最も関係の少ないものはどれか。","bodyImgs":[],"choices":[{"text":"マニフェスト"},{"text":"ISO9000ファミリー"},{"text":"QA表"},{"text":"管理図"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81382","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-34","season":"R6_late","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"試験・検査","topic":"t30","body":"工事現場における試験に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"フレッシュコンクリートのスランプの測定は、スランプゲージを用いて行った。"},{"text":"外壁タイル張り後のタイル接着力の測定は、油圧式簡易引張試験器を用いて行った。"},{"text":"構造体コンクリートのひび割れの幅の測定は、クラックスケールを用いて行った。"},{"text":"吹付けロックウールによる耐火被覆材の厚さの測定は、ダイヤルゲージを用いて行った。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81383","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-35","season":"R6_late","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"鉄骨建方","topic":null,"body":"鉄骨工事の検査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"溶融亜鉛めっき面の割れの検査は、目視で行った。"},{"text":"溶接部のブローホールの検査は、目視で行った。"},{"text":"溶接部の表面割れの検査は、浸透探傷試験により行った。"},{"text":"スタッド溶接部の検査は、打撃曲げ試験により行った。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81384","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-36","season":"R6_late","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"作業主任者","topic":"t35","body":"作業主任者を選任すべき作業として、「労働安全衛生法」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"工作物のコンクリートの打込みの作業"},{"text":"土止め支保工の切りばりの取り外しの作業"},{"text":"高さが5mのコンクリート造の工作物の解体の作業"},{"text":"高さが5mの足場の変更の作業"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81385","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-37","season":"R6_late","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"足場","topic":"t31","body":"足場に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"単管足場の地上第一の布は、高さ2m以下の位置に設けた。"},{"text":"単管足場の隣接する建地の継手部は、同一レベルとなるように配置した。"},{"text":"単管足場の建地の間隔は、けた行方向1.85m以下、はり間方向1.5m以下とした。"},{"text":"移動式足場（ローリングタワー）の脚輪のブレーキは、移動中を除き、常に作動させた。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81386","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-38","season":"R6_late","no":38,"sectionId":"ability","field":"施工管理法","topicName":"コンクリートの調合","topic":"t21","body":"普通コンクリートの調合に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"水セメント比は、耐久性を確保するためには、小さいほうがよい。"},{"text":"単位水量は、打込み後のブリーディングの増加を抑えるためには、できるだけ少なくする。"},{"text":"単位セメント量は、乾燥収縮によるひび割れを防止するためには、できるだけ少なくする。"},{"text":"スランプは、レディーミクストコンクリート工場出荷時における値を指定する。"},{"text":"粗骨材は、ワーカビリティーを向上させるためには、扁平なものよりも球形のものを用いる。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81387","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-39","season":"R6_late","no":39,"sectionId":"ability","field":"施工管理法","topicName":"高力ボルト接合","topic":null,"body":"高力ボルト摩擦接合に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ボルトの締付けは、ボルト群ごとに継手の周辺部より中央に向かう順序で行った。"},{"text":"ナットとボルトが共回りを生じたため、新しいボルトセットに取り替えた。"},{"text":"フィラープレートの材質は、母材の材質に係わらず、400N／mm2級鋼材とした。"},{"text":"摩擦面の錆の発生状態は、鋼材の表面が一様に赤く見える程度とした。"},{"text":"ナット側の座金は、座金の内側面取り部がナットに接する側に取り付けた。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81388","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-40","season":"R6_late","no":40,"sectionId":"ability","field":"施工管理法","topicName":"シーリング工事","topic":null,"body":"シーリング工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"目地深さが深かったため、バックアップ材を用いて所定の目地深さになるように調整した。"},{"text":"目地底にシーリング材を接着させないため、ボンドブレーカーを用いた。"},{"text":"シーリング材と被着面の接着性を良好にするため、プライマーを塗布した。"},{"text":"マスキングテープは、シーリング材のへら仕上げ終了後、直ちに取り除いた。"},{"text":"異種シーリング材を打ち継ぐため、先打ちシーリング材が硬化しないうちに、後打ちシーリング材を施工した。"}],"answer":[5],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81389","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-41","season":"R6_late","no":41,"sectionId":"ability","field":"施工管理法","topicName":"カーテン工事","topic":null,"body":"カーテン工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"レースカーテンのカーテンボックスは、窓幅に対して片側各々150mm長くした。"},{"text":"カーテンレールに取り付けるランナーの数は、1m当たり4個とした。"},{"text":"カーテンの両脇及びすその縁加工は、伏縫いとした。"},{"text":"レースカーテンの上端の縁加工は、カーテン心地を入れて袋縫いとした。"},{"text":"カーテン上端の折返し長さは、使用するフック（ひるかん）の長さにより定めた。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81390","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-42","season":"R6_late","no":42,"sectionId":"ability","field":"施工管理法","topicName":"安全管理","topic":"t31","body":"現場の安全管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"足場からの墜落防止のため、枠組足場に交さ筋かい及び高さ15cmの幅木を設けた。"},{"text":"工事現場からの飛来落下物による危害防止のため、足場の外側面に工事用シートを設けた。"},{"text":"高さ2m以上の箇所で作業を安全に行うため、作業場所に必要な照度の照明を設けた。"},{"text":"単管足場の沈下防止のため、敷角の上に単管パイプを直接乗せて、脚部に根がらみを設けた。"},{"text":"作業時の踏み抜き防止のため、スレートで葺かれた屋根の上に幅30cmの歩み板を設けた。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81391","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-43","season":"R6_late","no":43,"sectionId":"hoki","field":"法規","topicName":"建築確認手続き","topic":"t33","body":"建築確認手続き等に関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"施工者は、工事完了から4日以内に完了検査を申請しなければならない。"},{"text":"施工者は、工事現場の見やすい場所に、国土交通省令で定める様式によって、建築確認があった旨の表示をしなければならない。"},{"text":"鉄骨造2階建ての建築物の建築主は、原則として、検査済証の交付を受けた後でなければ、当該建築物を使用し、又は使用させてはならない。"},{"text":"建築主は、建築確認申請が必要な建築物を建築する場合、当該工事に着手する前に確認済証の交付を受けなければならない。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:81392","answer":"answers/R6_late_answers.csv"}},{"id":"R6_late-44","season":"R6_late","no":44,"sectionId":"hoki","field":"法規","topicName":"記述","topic":null,"body":"次の記述のうち、「建築基準法施行令」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"集会場における客用の屋内階段の幅は、120cm以上とする。"},{"text":"戸建て住宅の階段の蹴上げは、 ーンを引き上げた後、コンクリートが偏って形が不均衡になったため、別の試料によって新たに試験を行った。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:86812","answer":"answers/R7_early_answers.csv"}},{"id":"R7_early-36","season":"R7_early","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"建築工事における公衆に対す","topic":null,"body":"建築工事における公衆に対する危害又は迷惑を防止するための対策に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"くずやごみの投下による飛散を防止するため、ダストシュートを設置した。"},{"text":"歩行者等通路の見通し確保のため、仮囲いのコーナー部分にクリアパネルを設置した。"},{"text":"解体時の騒音やコンクリート片の飛散を防止するため、防音パネルを設置した。"},{"text":"外壁の塗装における塗料の飛散を防止するため、外部足場に集塵装置を設置した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:86813","answer":"answers/R7_early_answers.csv"}},{"id":"R7_early-37","season":"R7_early","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"労働安全衛生(届出等)","topic":"t35","body":"事業者の講ずべき措置として、「労働安全衛生法」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"労働者が有効に利用することができる休憩の設備を設けるように努めること。"},{"text":"高所作業車を用いて作業を行う場合、高所作業車等作業主任者を選任すること。"},{"text":"多量の発汗を伴う作業場において、労働者に与えるために、塩及び飲料水を備え付けること"},{"text":"日常行う清掃のほか、大掃除を定期に、統一的に行う措置を講ずること。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:86814","answer":"answers/R7_early_answers.csv"}},{"id":"R7_early-38","season":"R7_early","no":38,"sectionId":"ability","field":"施工管理法","topicName":"鉄筋の加工・組立","topic":"t20","body":"鉄筋の加工及び組立てに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄筋の加工寸法の表示及び計測は、突当て長さ（外側寸法）を用いて行う。"},{"text":"鉄筋の折曲げ加工は、常温で行う。"},{"text":"梁主筋末端部のフックにおける余長の最小寸法は、折曲げ角度が大きいほど長くなる。"},{"text":"矩形柱の帯筋は、四隅すべてを柱主筋と結束する。"},{"text":"床開口部補強のための斜め補強筋は、上下筋の内側に配筋する。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:86815","answer":"answers/R7_early_answers.csv"}},{"id":"R7_early-39","season":"R7_early","no":39,"sectionId":"ability","field":"施工管理法","topicName":"コンクリートの製造","topic":"t21","body":"コンクリートの製造に関する一般的な記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"レディーミクストコンクリートの購入者が指定できる項目には、骨材の種類は含まれない"},{"text":"レディーミクストコンクリートの塩化物含有量は、塩化物イオン量で0.30kg／m3以下とする。"},{"text":"レディーミクストコンクリートの空気量は、荷卸し時に、規定された値の範囲内となるようにする。"},{"text":"暑中コンクリートの温度上昇を防ぐために行う骨材への散水は、細骨材の場合、粗骨材に比べて冷却効果は期待できない。"},{"text":"寒中コンクリートの製造において、ミキサー内で練り混ぜた骨材及び水の温度は、セメント投入直前の段階で40℃以下とする。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:86816","answer":"answers/R7_early_answers.csv"}},{"id":"R7_early-40","season":"R7_early","no":40,"sectionId":"ability","field":"施工管理法","topicName":"金属の表面仕上","topic":null,"body":"金属の表面仕上げに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鋼材の電気めっきとは、母材を電解液中で通電して、表面に皮膜金属を生成させた仕上げである。"},{"text":"鋼材の樹脂焼付け塗装とは、樹脂塗料をエアスプレーで塗布した後、所定の温度で焼き付けた仕上げである。"},{"text":"ステンレス板のエンボスとは、凹凸の模様を施したロールで、その模様を圧延転写した仕上げである。"},{"text":"ステンレス板のBAとは、研磨材で連続したみがき目がつくように研磨した仕上げである。"},{"text":"アルミニウム合金の自然発色皮膜とは、有機酸を用いた陽極酸化処理を行い、皮膜の生成と同時に発色させた仕上げである。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:86817","answer":"answers/R7_early_answers.csv"}},{"id":"R7_early-41","season":"R7_early","no":41,"sectionId":"ability","field":"施工管理法","topicName":"建具工事","topic":null,"body":"建具金物に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"グレモン錠は、レバーハンドルを回すことで扉の上下からボルトが突出して施錠するもので、高い気密性を要する扉に用いられる。"},{"text":"フロアヒンジは、床に埋め込む箱形の金物で、自閉機能があり、比較的重量の大きな建具に用いられる。"},{"text":"モノロックは、デッドボルトとラッチボルトを有する錠で、シリンダー箱錠に比べ防犯効果があり、外部扉に用いられる。"},{"text":"フランス落しは、両開き建具の召合せ（しめしあわせ）面に彫り込んで取り付ける上げ落し金物で、錠がつかない側の扉に用いられる。"},{"text":"グラビティヒンジは、扉側と枠側のヒンジ部の勾配を利用することで、常時開又は常時閉鎖の設定ができる金物で、トイレブースの扉に用いられる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:86818","answer":"answers/R7_early_answers.csv"}},{"id":"R7_early-42","season":"R7_early","no":42,"sectionId":"ability","field":"施工管理法","topicName":"施工計画書の作成","topic":null,"body":"施工計画書の作成に関する記述として、最も不適当なものはどれか。","bodyImgs": を有する構造物は、その筋かいを用いて建入れ直しを行った。"},{"text":"溶接継手のエレクションピースに使用する仮ボルトは、高力ボルトを用いて全数締め付けた。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91175","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-23","season":"R7_late","no":23,"sectionId":"seko","field":"建築施工","topicName":null,"topic":null,"body":"合成高分子系ルーフィングシート防水の接着工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"塩化ビニル樹脂系シート防水において、防水層の立上り末端部は、押え金物で固定し、不定形シール材を用いて処理した。"},{"text":"塩化ビニル樹脂系シート防水において、ALCパネル下地であったため、プライマーを塗布した。"},{"text":"加硫ゴム系シート防水において、ルーフィングシート相互の接合部は、接着剤とテープ状シール材を併用して接合した。"},{"text":"加硫ゴム系シート防水において、ルーフィングシート相互の接合部で3枚重ねとなる部分は、熱風で柔らかくして段差部をなくすように融着した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91176","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-24","season":"R7_late","no":24,"sectionId":"seko","field":"建築施工","topicName":null,"topic":null,"body":"セルフレベリング材塗りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"流し込みに先立ち、コンクリート下地を調整し、塗厚が10mm程度となるようにした。"},{"text":"流し込み作業中は、通風のため窓や開口部を開放した。"},{"text":"流し込み後の乾燥養生期間は、外気温が低い冬季であったため、14日間とした。"},{"text":"打継ぎ部の凸部は、硬化後にサンダーを使って削り取った。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91177","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-25","season":"R7_late","no":25,"sectionId":"seko","field":"建築施工","topicName":null,"topic":null,"body":"鋼製建具に関する記述として、最も不適当なものはどれか。\nただし、1枚の戸の有効開口は、幅950mm以下、高さ2，400mm以下とする。","bodyImgs":[],"choices":[{"text":"建具枠の取付け用のアンカーは、枠の両端から逃げた位置から900mm内外の間隔で設けた。"},{"text":"フラッシュ戸の組立てにおいて、中骨を300mm以下の間隔で設けた。"},{"text":"錆止め塗装を2回塗りとするため、1回目を工場で行い、2回目を工事現場で行った。"},{"text":"くつずりは、あらかじめ裏面に鉄線等を取り付けておき、モルタル詰めを行った後に取り付けた。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91178","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-26","season":"R7_late","no":26,"sectionId":"seko","field":" ":"勾配が15°以下の登り桟橋には、踏桟を設けなかった。"},{"text":"高さ5m以上の枠組足場において、壁つなぎの水平方向の間隔は、10mとした。"},{"text":"枠組足場において、階段の手すりの高さは、踏板より90cmとした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91190","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-38","season":"R7_late","no":38,"sectionId":"ability","field":"施工管理法","topicName":null,"topic":null,"body":"型枠のセパレータに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"コーンを使用しないセパレータは、型枠脱型後にねじ部分を折り取り、残った座金の露出部分に錆止め塗料を塗り付けた。"},{"text":"地下外壁には、水膨潤ゴム製の止水板付きセパレータを用いた。"},{"text":"打放し仕上げ面となる外壁コンクリートの型枠に、コーン付きセパレータを用いた。"},{"text":"独立柱の型枠の組立てにおいて、コラムクランプをセパレータで締め付けた。"},{"text":"セパレータは、せき板に対して垂直となるよう配置した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91191","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-39","season":"R7_late","no":39,"sectionId":"ability","field":"施工管理法","topicName":null,"topic":null,"body":"木造在来軸組構法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"腰掛け蟻継ぎとした土台の継手部分は、下木となるほうをアンカーボルトで締め付けた。"},{"text":"根太の継手の位置は、大引の受材心とした。"},{"text":"土台の継手の位置は、床下換気口部分を避けた。"},{"text":"筋かいは、建入れ直し完了後、接合金物や火打梁を固定した後に取り付けた。"},{"text":"和小屋組の棟木や母屋には、垂木を取り付けるため、垂木欠きを行った。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91192","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-40","season":"R7_late","no":40,"sectionId":"ability","field":"施工管理法","topicName":null,"topic":null,"body":"外壁の張り石工事において、湿式工法と比較した場合の乾式工法の特徴として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"石材の表面に衝撃が加わると破損しやすい。"},{"text":"凍結による被害を受けにくい。"},{"text":"地震時の躯体の挙動に追従しにくい。"},{"text":"エフロレッセンス（白華現象）が起こりにくい。"},{"text":"石材の熱変形を吸収できる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91193","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-41","season":"R7_late","no":41,"sectionId":"ability","field":"施工管理法","topicName":null,"topic":null,"body":"金属製折板葺に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"タイトフレームと下地材との接合は、ボルト接合とした。"},{"text":"はぜ締め形折板は、本締めの前にタイトフレームの間を1mの間隔で部分締めを行った。"},{"text":"重ね形折板のけらばの変形防止材には、折板の3山ピッチ以上の長さのものを用いた。"},{"text":"棟包みと折板の隙間を塞ぐため、棟包みの水下側にエプロンを設けた。"},{"text":"重ね形折板のボルト孔は、呼出しポンチで開孔した。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91194","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-42","season":"R7_late","no":42,"sectionId":"ability","field":"施工管理法","topicName":null,"topic":null,"body":"アロー型ネットワーク工程表に関する用語の説明として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ダミーとは、工程の最後に入れる予備日のことである。"},{"text":"フロートとは、作業の余裕時間のことである。"},{"text":"ノードとは、作業と作業を結合する点及び工程の開始点又は終了点のことである。"},{"text":"アクティビティとは、工事の工程を分割してできる工事活動の単位のことである。"},{"text":"クリティカルパスとは、開始結合点から終了結合点に至るまでの所要時間の合計が最も長いパスのことである。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91195","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-43","season":"R7_late","no":43,"sectionId":"hoki","field":"法規","topicName":null,"topic":null,"body":"用語の定義に関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"基礎は、構造耐力上主要な部分であるが、主要構造部ではない。"},{"text":"土地に定着する工作物のうち、屋根及び柱若しくは壁を有するものは、建築物である。"},{"text":"建築設備は、建築物に含まれない。"},{"text":"耐火建築物以外の建築物で、主要構造部を準耐火構造とし、外壁の開口部で延焼のおそれがある部分に防火戸その他の政令で定める防火設備を有するものは、準耐火建築物である。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91196","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-44","season":"R7_late","no":44,"sectionId":"hoki","field":"法規","topicName":null,"topic":null,"body":"居室の採光及び換気に関する記述として、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"居室の窓その他の開口部で採光に有効な部分の面積を算定する際、天窓は実際の面積よりも大きな面積を有する開口部として扱う。"},{"text":"劇場の客席には、政令で定める技術的基準に従って、換気設備を設けなければならない。"},{"text":"ホテルの客室には、採光のための窓その他の開口部を設けなければならない。"},{"text":"ふすま、障子その他随時開放することができるもので仕切られた2室は、居室の採光及び換気の規定の適用に当たっては、1室とみなす。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91197","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-45","season":"R7_late","no":45,"sectionId":"hoki","field":"法規","topicName":null,"topic":null,"body":"建設業の許可に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"建築一式工事のうち延べ面積が150m2に満たない木造住宅を建設する工事のみを請け負う場合、建設業の許可を必要としない。"},{"text":"2以上の都道府県の区域内に営業所を設けて営業しようとする者が建設業の許可を受ける場合、国土交通大臣の許可を受けなければならない。"},{"text":"国又は地方公共団体が発注者である建設工事を請け負う者は、特定建設業の許可を受けなければならない。"},{"text":"建築一式工事のうち工事1件の請負代金の額が1，500万円に満たない工事のみを請け負う場合、建設業の許可を必要としない。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91198","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-46","season":"R7_late","no":46,"sectionId":"hoki","field":"法規","topicName":null,"topic":null,"body":"建設工事の請負契約書に記載しなければならない事項として、「建設業法」上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"工事の履行に必要となる建設業の許可の種類及び許可番号"},{"text":"注文者が工事に使用する資材を提供するときは、その内容及び方法に関する定め"},{"text":"契約に関する紛争の解決方法"},{"text":"各当事者の履行の遅滞その他債務の不履行の場合における遅延利息、違約金その他の損害金"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91199","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-47","season":"R7_late","no":47,"sectionId":"hoki","field":"法規","topicName":null,"topic":null,"body":"建設工事の現場における次の業務のうち、「労働安全衛生法」上、都道府県労働局長の登録を受けた者が行う技能講習を修了した者が就くことができる業務はどれか。\nただし、道路上を走行させる運転を除くものとする。","bodyImgs":[],"choices":[{"text":"建設用リフトの運転の業務"},{"text":"機体重量が2tのパワーショベルの運転の業務"},{"text":"つり上げ荷重が1tの移動式クレーンの玉掛けの業務"},{"text":"ゴンドラの操作の業務"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:91200","answer":"answers/R7_late_answers.csv"}},{"id":"R7_late-48","season":"R7_late","no":48,"sectionId":"hoki","field":"法規","topicName":null,"topic":null,"body":"建設工事の現場において、元方安全衛生管理者を選任しなければならない常時就労する労働者の最少人員として、「労働安全衛生法施行令」上、正しいものはどれか。\nただし、ずい道等の建設の仕事、橋梁の建設の仕事又は圧気工法による作業を行う仕事を除くも <script>
'use strict';
// ====== 定数・保存 ======
const LS = { session: 'sekokanExam.session.v1', history: 'sekokanExam.history.v1', settings: 'sekokanExam.settings.v1', drill: 'sekokanExam.drill.v1' };
const EXCESS_PENALTY = 1;     // 時間切れ提出時、指定数を超えた解答1問につき減点(冊子「減点」・幅は非公開のため仮置き)
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 容量超過等は無視 */ } };
const settings = Object.assign({ showReserved: false, durationMin: 150, name: '' }, load(LS.settings, {}));
let session = load(LS.session, null);
let view = 'home';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const zen = n => String(n).replace(/\d/g, d => '０１２３４５６７８９'[d]);

// ====== バンク参照 ======
const seasonById = id => BANK.seasons.find(s => s.id === id);
const fmtOf = season => BANK.formats[season.format];
const sectionOf = (season, no) => fmtOf(season).sections.find(s => no >= s.range[0] && no <= s.range[1]);
const questionsOf = seasonId => BANK.questions.filter(q => q.season === seasonId).sort((a, b) => a.no - b.no);
const qAt = (seasonId, no) => BANK.questions.find(q => q.season === seasonId && q.no === no);

// ====== セッション ======
function newSession(seasonId) {
  const s = seasonById(seasonId);
  return { v: 1, seasonId, startedAt: Date.now(), durationSec: (settings.durationMin || s.durationMin) * 60,
           answers: {}, flags: {}, cursor: 1, timeOnQ: {}, status: 'running' };
}
const remainSec = () => session ? Math.max(0, Math.floor((session.startedAt + session.durationSec * 1000 - Date.now()) / 1000)) : 0;
function persist() { if (session) save(LS.session, session); else { try { localStorage.removeItem(LS.session); } catch (e) {} } }

// セクション別の解答数
function sectionStats(sess) {
  const season = seasonById(sess.seasonId);
  return fmtOf(season).sections.map(sec => {
    const nos = []; for (let n = sec.range[0]; n <= sec.range[1]; n++) nos.push(n);
    const answered = nos.filter(n => (sess.answers[n] || []).length > 0);
    const need = sec.pick == null ? nos.length : sec.pick;
    return { sec, nos, answered, need, over: answered.length > need, short: answered.length < need };
  });
}

// ====== 滞在時間(visibilitychange で一時停止) ======
let tickTimer = null, lastTick = null;
function tick() {
  if (!session || session.status !== 'running') return;
  const now = Date.now();
  if (lastTick && document.visibilityState === 'visible') {
    const dt = Math.min(5, (now - lastTick) / 1000);
    session.timeOnQ[session.cursor] = (session.timeOnQ[session.cursor] || 0) + dt;
  }
  lastTick = now;
  const rs = remainSec();
  const clk = $('#clock'); if (clk) renderClock(clk, rs);
  if (rs <= 0) { submit('timeout'); return; }
  if (Math.floor(now / 1000) % 30 === 0) persist();
}
function startTicking() { stopTicking(); lastTick = Date.now(); tickTimer = setInterval(tick, 1000); }
function stopTicking() { if (tickTimer) clearInterval(tickTimer); tickTimer = null; lastTick = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lastTick = Date.now(); else persist(); });
window.addEventListener('pagehide', persist);

const warned = {};
function renderClock(el, rs) {
  const m = Math.floor(rs / 60), s = rs % 60;
  el.innerHTML = `<small>残り時間</small>${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  el.className = 'clock' + (rs <= 300 ? ' w5' : rs <= 600 ? ' w10' : rs <= 1800 ? ' w30' : '');
  for (const th of [1800, 600, 300]) if (rs <= th && !warned[th]) { warned[th] = true; if (navigator.vibrate) navigator.vibrate(120); }
}

// ====== 画面: Home ======
function renderHome() {
  view = 'home'; stopTicking();
  const pa = $('#printArea'); if (pa) pa.remove(); document.title = '模擬試験｜2級建築施工管理 第一次検定';
  const running = session && session.status === 'running';
  const seasons = BANK.seasons.filter(s => settings.showReserved || !s.reserved);
  const hist = load(LS.history, []);
  const items = seasons.map(s => {
    const isRun = running && session.seasonId === s.id;
    const h = hist.filter(x => x.seasonId === s.id);
    const nq = questionsOf(s.id).length, nAns = questionsOf(s.id).filter(q => q.answer).length;
    const usable = nq === 50 && nAns === 50;
    let state = '';
    if (isRun) state = `<b>${Math.floor(remainSec() / 60)}分</b>受験中・再開`;
    else if (!usable) state = `<b>—</b>正答未収録`;
    else if (h.length) { const last = h[h.length - 1]; state = `<b>${last.score}<span style="font-size:11px;color:var(--ink-3)">/40</span></b>${h.length}回受験`; }
    else state = `<b>—</b>未受験`;
    return `<li><button class="cover${isRun ? ' running' : ''}${s.reserved ? ' reserved' : ''}" data-season="${s.id}" ${usable ? '' : 'disabled'}>
      <span class="tag">${esc(s.id.replace('_early', '前').replace('_late', '後'))}</span>
      <span><span class="ttl">${esc(s.label)}</span><span class="meta">${esc(fmtOf(s).label)}　${esc(s.date || '')}${s.reserved ? '　<em>温存回次</em>' : ''}</span></span>
      <span class="state">${state}</span></button></li>`;
  }).join('');
  $('#app').innerHTML = `<div class="page">
    <div class="eyebrow">2級建築施工管理技術検定 第一次検定</div>
    <h1>模擬試験</h1>
    <p class="sub">本番と同じ 50問・40問解答・150分。試験中は正解も解説も出ません。提出後に採点します。</p>
    ${running ? `<div class="warnbox" style="background:var(--warn-soft);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.5px;margin-bottom:14px;">受験中の試験があります（${esc(seasonById(session.seasonId).label)}・残り ${Math.floor(remainSec() / 60)} 分）。一覧から選ぶと続きから再開します。</div>` : ''}
    <div class="section-h"><h2>回次を選ぶ</h2><span class="note">${seasons.length} 回次</span></div>
    <ul class="cover-list">${items}</ul>
    ${hist.length ? drillBox(hist) : ''}
    ${hist.length ? `<div class="section-h"><h2>受験履歴</h2><span class="note">${hist.length} 回</span></div>
    ${hist.length >= 2 ? trendChart(hist) : ''}
    <ul class="hist">${hist.slice().reverse().map(h => `<li><button data-rec="${h.id}"><span>${esc(seasonById(h.seasonId).label)}<br><span class="d">${fmtDate(h.startedAt)}${h.reason === 'timeout' ? '・時間切れ' : ''}</span></span><span class="sc">${h.score}<span style="font-size:11px;color:var(--ink-3)">/40</span></span><span class="pf ${h.pass ? 'pass' : 'fail'}">${h.pass ? '合格ライン' : '未達'}</span></button></li>`).join('')}</ul>` : ''}
    <div class="section-h"><h2>設定</h2></div>
    <div class="settings">
      <label><input type="checkbox" id="setReserved" ${settings.showReserved ? 'checked' : ''}> 直近4回次（令和6年〜）も表示する（本番直前の実力測定用に温存）</label>
      <label>試験時間 <input type="number" id="setDuration" min="10" max="300" value="${settings.durationMin}"> 分（本番は150分）</label>
      <label>氏名（スコアレポート用） <input type="text" id="setName" value="${esc(settings.name)}" placeholder="任意"></label>
      <div class="row" style="margin-top:6px"><button class="btn ghost" id="expAllBtn" ${hist.length ? '' : 'disabled'}>全履歴をJSONで書き出す</button><button class="btn ghost" id="impBtn">JSONを読み込む</button><input type="file" id="impFile" accept="application/json,.json" class="hidden"></div>
      <div style="font-size:12px;color:var(--ink-3)">データはこの端末のブラウザ内にだけ保存されます。端末を替える前や、iPhoneのSafariで長期間開かない場合は、書き出して控えを取ってください。読み込みは既存の履歴に統合します（同じ記録は重複しません）。</div>
    </div>
    <p style="margin-top:26px;font-size:12.5px;color:var(--ink-3)"><a href="index.html">← 穴埋め教材アプリへ</a></p>
  </div>`;
  document.querySelectorAll('.cover').forEach(b => b.addEventListener('click', () => chooseSeason(b.dataset.season)));
  document.querySelectorAll('.hist button').forEach(b => b.addEventListener('click', () => { const r = load(LS.history, []).find(h => h.id === b.dataset.rec); if (r) renderResult(r); }));
  bindDrillBox(null);
  $('#setReserved').addEventListener('change', e => { settings.showReserved = e.target.checked; save(LS.settings, settings); renderHome(); });
  $('#setDuration').addEventListener('change', e => { settings.durationMin = Math.max(10, Math.min(300, +e.target.value || 150)); save(LS.settings, settings); e.target.value = settings.durationMin; });
  $('#setName').addEventListener('change', e => { settings.name = e.target.value.trim(); save(LS.settings, settings); });
  $('#expAllBtn').addEventListener('click', exportAll);
  $('#impBtn').addEventListener('click', () => $('#impFile').click());
  $('#impFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; });
}

function chooseSeason(seasonId) {
  if (session && session.status === 'running') {
    if (session.seasonId === seasonId) { renderExam(); return; }
    openDialog(`<h2>受験中の試験があります</h2><p>${esc(seasonById(session.seasonId).label)} を受験中です（残り ${Math.floor(remainSec() / 60)} 分）。別の回次を始めるには、今の試験を破棄する必要があります。</p>
      <div class="actions"><button class="btn ghost" data-act="close">戻る</button><button class="btn danger" data-act="discard">破棄して選び直す</button></div>`,
      { discard: () => { session = null; persist(); closeDialog(); renderNotice(seasonId); } });
    return;
  }
  renderNotice(seasonId);
}

function renderExam() {
  view = 'exam';
  const s = seasonById(session.seasonId);
  $('#app').innerHTML = `
    <div class="topbar"><div class="in">
      <div class="sec" id="secInfo"></div>

      <button class="tool submit" id="submitBarBtn">解答を提出する</button>
    </div></div>`;
  $('#prevBtn').addEventListener('click', () => go(session.cursor - 1));
  $('#nextBtn').addEventListener('click', () => go(session.cursor + 1));
  $('#listBtn').addEventListener('click', openDrawer);

function go(no) { if (no < 1 || no > 50) return; session.cursor = no; persist(); renderQuestion(); window.scrollTo({ top: 0 }); }

function renderQuestion() {
  const s = seasonById(session.seasonId), no = session.cursor, q = qAt(s.id, no), sec = sectionOf(s, no);
  const st = sectionStats(session).find(x => x.sec.id === sec.id);
  const cntCls = st.over ? 'over' : (sec.pick != null && st.answered.length === st.need) ? 'full' : '';
  $('#secInfo').innerHTML = `<div class="name">${esc(sec.label)}${sec.pick != null ? `　${sec.range[1] - sec.range[0] + 1}問中${sec.pick}問選択` : '　全問必須'}</div>
    <div class="cnt ${cntCls}">解答 ${st.answered.length} / ${st.need}${st.over ? '　超過' : ''}</div>`;
  const sel = session.answers[no] || [];
  const multi = q.answerMode === 'multi2';
  const choices = q.choices.map((c, i) => {
    const n = i + 1, on = sel.includes(n);
    return `<li><button class="choice${on ? ' on' : ''}" data-n="${n}" aria-pressed="${on}"><span class="oval">${n}</span><span>${c.img ? `<img class="cimg" src="${esc(c.img)}" alt="選択肢${n}の図">` : esc(c.text)}</span></button></li>`;
  }).join('');
  const fl = !!session.flags[no];
  $('#qwrap').innerHTML = `<div class="q${fl ? ' flagged' : ''}">
    <div class="no"><span class="b">〔No．${zen(no)}〕</span><span class="s">${esc(sec.label)}${sec.ability ? '　能力問題' : ''}</span>
      <button class="flagbtn${fl ? ' on' : ''}" id="flagBtn" aria-pressed="${fl}"><span class="bx">${fl ? '✓' : ''}</span>あとで見直す</button></div>
    ${fl ? '<div class="flagband">⚑ 見直し予定の問題です。問題一覧の右上に印が付きます。</div>' : ''}
    <p class="body">${esc(q.body)}</p>
    ${q.bodyImgs.map(u => `<img class="img" src="${esc(u)}" alt="問題の図">`).join('')}
    <ul class="choices">${choices}</ul>
    <div class="qhint">${multi ? '2つ選ぶ（両方正しい場合のみ正答）' : '1つ選ぶ'}・もう一度押すと取り消し</div>
  </div>`;
  document.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => choose(no, +b.dataset.n, multi)));
  $('#flagBtn').addEventListener('click', () => { if (session.flags[no]) delete session.flags[no]; else session.flags[no] = true; persist(); renderQuestion(); });
  $('#prevBtn').disabled = no <= 1; $('#nextBtn').disabled = no >= 50;
}
function choose(no, n, multi) {
  let sel = (session.answers[no] || []).slice();
  if (sel.includes(n)) sel = sel.filter(x => x !== n);
  else if (multi) { sel.push(n); if (sel.length > 2) sel.shift(); }
  else sel = [n];
  if (sel.length) session.answers[no] = sel; else delete session.answers[no];
  persist(); renderQuestion();
}
