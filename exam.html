<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>模擬試験｜2級建築施工管理 第一次検定</title>
<meta name="theme-color" content="#fbfaf6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="app-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="模擬試験">
<style>
  /* ---- トークン: 問題冊子(紙・墨) × マークシート(薄青の罫・黒マーク) ---- */
  :root{
    --paper:#fbfaf6; --paper-2:#f3f1ea; --ink:#1a1a1a; --ink-2:#4a4a4a; --ink-3:#8a8a86;
    --rule:#d9d6cd; --sheet:#7f97ad; --sheet-soft:#e4ebf1; --sheet-line:#b9c8d6;
    --mark:#111; --alert:#c8371f; --alert-soft:#fbe9e5; --warn:#b7791f; --warn-soft:#fbf3e2; --ok:#2f7d4f;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    --mincho:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    --mono:"SF Mono","Menlo","Consolas",ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15.5px;line-height:1.8;}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
  button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sheet);outline-offset:2px;}
  a{color:inherit;}
  .hidden{display:none!important;}

  /* ---- 共通レイアウト ---- */
  .page{max-width:720px;margin:0 auto;padding:calc(18px + var(--safe-t)) 18px calc(28px + var(--safe-b));}
  .eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;}
  h1{font-family:var(--mincho);font-weight:600;font-size:22px;line-height:1.4;margin:6px 0 4px;letter-spacing:.02em;}
  .sub{color:var(--ink-2);font-size:13.5px;margin:0 0 22px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;letter-spacing:.04em;transition:opacity .15s;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--ink);}
  .btn.danger{border-color:var(--alert);background:var(--alert);color:#fff;}
  .btn.wide{width:100%;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  /* ---- Home: 回次一覧を冊子の背表紙のように ---- */
  .cover-list{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
  .cover{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--rule);border-radius:10px;background:#fff;transition:border-color .15s,transform .15s;}
  .cover:hover{border-color:var(--sheet);}
  .cover:active{transform:scale(.995);}
  .cover .tag{font-family:var(--mono);font-size:11px;color:var(--ink-3);writing-mode:vertical-rl;letter-spacing:.1em;border-right:1px solid var(--rule);padding-right:10px;}
  .cover .ttl{font-family:var(--mincho);font-weight:600;font-size:17px;line-height:1.35;}
  .cover .meta{font-size:12px;color:var(--ink-2);margin-top:2px;}
  .cover .state{font-size:12px;color:var(--ink-3);text-align:right;line-height:1.5;white-space:nowrap;}
  .cover .state b{display:block;font-size:15px;color:var(--ink);font-family:var(--mono);}
  .cover.running{border-color:var(--warn);background:var(--warn-soft);}
  .cover.reserved{opacity:.75;}
  .section-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule);}
  .section-h h2{font-size:14px;font-weight:600;margin:0;letter-spacing:.06em;}
  .section-h .note{font-size:12px;color:var(--ink-3);}
  .settings{margin-top:8px;font-size:13.5px;color:var(--ink-2);display:grid;gap:8px;}
  .settings label{display:flex;align-items:center;gap:10px;}
  .settings input[type=number]{width:72px;font:inherit;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;text-align:right;}
  .settings input[type=text]{flex:1;font:inherit;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;}

  /* ---- 注意事項ページ: 冊子表紙の転記 ---- */
  .booklet{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:26px 22px 30px;font-family:var(--mincho);position:relative;box-shadow:0 1px 0 var(--rule),0 3px 0 #fff,0 4px 0 var(--rule);}
  .booklet .code{position:absolute;top:12px;right:16px;font-size:12px;letter-spacing:.2em;color:var(--ink-2);}
  .booklet .title{text-align:center;margin:10px 0 22px;}
  .booklet .title .y{font-size:15px;letter-spacing:.1em;}
  .booklet .title .t{font-size:21px;font-weight:600;letter-spacing:.12em;margin:6px 0 2px;}
  .booklet .title .k{font-size:19px;font-weight:600;letter-spacing:.2em;}
  .booklet .title .d{font-size:13.5px;margin-top:8px;letter-spacing:.06em;}
  .booklet .lead{text-align:center;font-size:14px;margin:0 0 6px;}
  .booklet h3{text-align:center;font-size:16px;font-weight:600;letter-spacing:.5em;margin:10px 0 12px;}
  .booklet ol{margin:0;padding-left:1.6em;font-size:14px;line-height:1.9;}
  .booklet ol>li{margin:2px 0;padding-left:.2em;}
  .booklet ol ol{list-style:none;padding-left:.2em;margin:2px 0 4px;}
  .booklet .markex{float:right;margin:0 0 6px 12px;font-size:12px;text-align:center;border:1px solid var(--ink);padding:6px 10px;line-height:1.5;}
  .booklet .markex .oval{display:block;width:26px;height:12px;border-radius:50%;background:var(--ink);margin:4px auto 0;}
  .booklet .sim{clear:both;margin-top:18px;padding-top:14px;border-top:1px dashed var(--rule);font-family:var(--gothic);font-size:13px;color:var(--ink-2);line-height:1.7;}
  .start-bar{margin-top:18px;display:grid;gap:10px;}

  /* ---- 試験画面 ---- */
  .exam{padding-top:calc(58px + var(--safe-t));padding-bottom:calc(128px + var(--safe-b));}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(251,250,246,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding-top:var(--safe-t);}
  .topbar .in{max-width:720px;margin:0 auto;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;}
  .topbar .sec{min-width:0;}
  .topbar .sec .name{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .sec .cnt{font-family:var(--mono);font-size:13px;letter-spacing:.02em;}
  .topbar .sec .cnt.over{color:var(--alert);font-weight:700;}
  .topbar .sec .cnt.full{color:var(--ok);}
  .clock{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1;padding:8px 10px;border-radius:6px;border:1px solid var(--rule);background:#fff;}
  .clock small{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);font-family:var(--gothic);margin-bottom:3px;}
  .clock.w30{border-color:var(--warn);color:var(--warn);}
  .clock.w10{border-color:var(--alert);color:var(--alert);}
  .clock.w5{border-color:var(--alert);background:var(--alert);color:#fff;}
  .clock.w5 small{color:#fff;opacity:.85;}

  .q{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:18px 18px 8px;font-family:var(--mincho);}
  .q .no{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
  .q .no .b{font-size:17px;font-weight:600;letter-spacing:.06em;}
  .q .no .s{font-family:var(--gothic);font-size:11.5px;color:var(--ink-3);}
  .q .body{font-size:16px;line-height:1.95;white-space:pre-line;margin:0 0 6px;}
  .q .img{display:block;max-width:100%;height:auto;margin:10px auto;border:1px solid var(--paper-2);}
  .q .law{font-family:var(--gothic);font-size:11.5px;color:var(--ink-3);margin:0 0 8px;}
  .choices{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--rule);}
  .choice{display:grid;grid-template-columns:52px 1fr;align-items:start;gap:6px;width:100%;text-align:left;padding:12px 4px 12px 0;border-bottom:1px solid var(--paper-2);font-family:var(--mincho);font-size:15.5px;line-height:1.85;}
  .choice:last-child{border-bottom:0;}
  .choice .oval{justify-self:center;margin-top:7px;width:34px;height:17px;border-radius:50%;border:1.5px solid var(--sheet);background:var(--sheet-soft);color:var(--sheet);font-family:var(--mono);font-size:10.5px;line-height:14px;text-align:center;transition:background .12s,color .12s,border-color .12s;}
  .choice:hover .oval{border-color:var(--ink-2);}
  .choice.on .oval{background:var(--mark);border-color:var(--mark);color:transparent;}
  .choice .cimg{max-width:100%;height:auto;display:block;border:1px solid var(--paper-2);}
  .choice.on .cimg{outline:2px solid var(--mark);}
  .qhint{font-family:var(--gothic);font-size:12px;color:var(--ink-3);text-align:right;margin:8px 0 4px;}

  .botbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(251,250,246,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--rule);padding-bottom:var(--safe-b);}
  .botbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px 10px;}
  .nav{height:44px;padding:0 10px;border-radius:8px;border:1.5px solid var(--ink);font-weight:600;letter-spacing:.02em;white-space:nowrap;}
  .nav.prev{background:transparent;}
  .nav.next{background:var(--ink);color:var(--paper);}
  .nav:disabled{opacity:.3;}
  .tool{height:44px;padding:0 8px;border-radius:8px;border:1px solid var(--rule);background:#fff;font-size:12.5px;line-height:1.2;display:grid;place-items:center;white-space:nowrap;}
  .tool.submit{border:1.5px solid var(--alert);color:var(--alert);font-weight:700;}
  .flagbtn{margin-left:auto;font-family:var(--gothic);font-size:13px;font-weight:600;color:var(--warn);border:1.5px solid var(--warn);border-radius:8px;padding:6px 12px;line-height:1.3;white-space:nowrap;background:#fff;display:inline-flex;align-items:center;gap:6px;}
  .flagbtn .bx{width:16px;height:16px;border:1.5px solid var(--warn);border-radius:4px;display:grid;place-items:center;font-size:12px;line-height:1;background:#fff;}
  .flagbtn.on{background:var(--warn);color:#fff;}
  .flagbtn.on .bx{background:#fff;color:var(--warn);}
  .q.flagged{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn);}
  .flagband{font-family:var(--gothic);font-size:12.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 10px;margin:0 0 10px;}

  /* ---- 一覧ドロワー(マークシート) ---- */
  .drawer{position:fixed;inset:0;z-index:30;background:rgba(26,26,26,.35);display:flex;align-items:flex-end;justify-content:center;}
  .drawer .sheet{width:100%;max-width:720px;max-height:86vh;overflow:auto;background:#fff;border-radius:14px 14px 0 0;padding:14px 16px calc(20px + var(--safe-b));}
  .drawer .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .drawer .hd b{font-size:14px;letter-spacing:.06em;}
  .drawer .legend{font-size:11.5px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .legend i{display:inline-block;width:18px;height:9px;border-radius:50%;border:1.5px solid var(--sheet);vertical-align:middle;margin-right:4px;background:var(--sheet-soft);}
  .legend i.on{background:var(--mark);border-color:var(--mark);}
  .legend i.fl{border-color:var(--warn);background:var(--warn-soft);}
  .secgrp{margin-bottom:12px;}
  .secgrp .sh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-2);padding:4px 2px;border-bottom:1px solid var(--sheet-line);}
  .secgrp .sh .c{font-family:var(--mono);}
  .secgrp .sh.over{color:var(--alert);font-weight:700;}
  .secgrp .sh.full{color:var(--ok);}
  .cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-top:8px;}
  .cell{height:44px;border:1px solid var(--sheet-line);border-radius:6px;background:#fff;display:grid;grid-template-columns:auto 1fr;align-items:center;padding:0 8px;gap:6px;position:relative;font-family:var(--mono);font-size:12.5px;}
  .cell .o{width:18px;height:9px;border-radius:50%;border:1.5px solid var(--sheet);background:var(--sheet-soft);justify-self:end;}
  .cell.on .o{background:var(--mark);border-color:var(--mark);}
  .cell.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .cell.fl::after{content:"";position:absolute;top:-1px;right:-1px;width:0;height:0;border-top:10px solid var(--warn);border-left:10px solid transparent;border-radius:0 6px 0 0;}
  .cell.noimg{color:var(--ink-3);}
  .drawer .submit-row{margin-top:8px;display:grid;gap:8px;}

  /* ---- ダイアログ ---- */
  dialog{border:0;border-radius:12px;padding:0;max-width:min(92vw,440px);width:100%;background:#fff;color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.25);}
  dialog::backdrop{background:rgba(26,26,26,.45);}
  dialog .dl{padding:20px 20px 16px;}
  dialog h2{font-size:16px;margin:0 0 10px;letter-spacing:.04em;}
  dialog p{margin:6px 0;font-size:14px;color:var(--ink-2);}
  dialog .stat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0;}
  dialog .stat b{font-family:var(--mono);font-weight:600;}
  dialog .bad{color:var(--alert);}
  dialog .warnbox{background:var(--alert-soft);border-left:3px solid var(--alert);padding:8px 12px;font-size:13.5px;border-radius:0 6px 6px 0;margin:10px 0;}
  dialog .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  dialog .actions .btn{min-height:44px;padding:0 12px;}

  /* ---- 結果画面 ---- */
  .score{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:20px 20px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;}
  .score .big{font-family:var(--mono);font-size:56px;line-height:1;letter-spacing:-.02em;}
  .score .big small{font-size:18px;color:var(--ink-3);letter-spacing:0;}
  .score .verdict{font-family:var(--mincho);font-size:22px;font-weight:600;letter-spacing:.2em;}
  .score .verdict.pass{color:var(--ok);} .score .verdict.fail{color:var(--alert);}
  .score .detail{grid-column:1/-1;font-size:13px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:10px;line-height:1.7;}
  table.sec{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:hidden;}
  table.sec th,table.sec td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--paper-2);}
  table.sec th{font-weight:600;font-size:12px;color:var(--ink-2);background:var(--paper-2);}
  table.sec td.n{font-family:var(--mono);text-align:right;white-space:nowrap;}
  table.sec tr:last-child td{border-bottom:0;}
  .bar{height:6px;background:var(--sheet-soft);border-radius:3px;overflow:hidden;margin-top:4px;}
  .bar i{display:block;height:100%;background:var(--ink);}
  .qlist{list-style:none;margin:0;padding:0;display:grid;gap:6px;}
  .qrow{width:100%;text-align:left;display:grid;grid-template-columns:44px 1fr auto auto;align-items:center;gap:8px;padding:9px 12px;background:#fff;border:1px solid var(--rule);border-radius:8px;font-size:13px;}
  .qrow .no{font-family:var(--mono);font-weight:600;}
  .qrow .t{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .qrow .a{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap;}
  .qrow .r{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;}
  .qrow .r.ok{background:#e3f2e8;color:var(--ok);} .qrow .r.ng{background:var(--alert-soft);color:var(--alert);} .qrow .r.na{background:var(--paper-2);color:var(--ink-3);} .qrow .r.ex{background:var(--warn-soft);color:var(--warn);}
  .qrow.open{border-color:var(--ink);}
  .review{background:#fff;border:1px solid var(--ink);border-top:0;border-radius:0 0 8px 8px;margin:-7px 0 0;padding:14px 16px 10px;font-family:var(--mincho);}
  .review .body{font-size:15px;line-height:1.9;white-space:pre-line;margin:0 0 6px;}
  .review .img{display:block;max-width:100%;height:auto;margin:8px auto;}
  .review ol{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--rule);}
  .review li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:start;padding:8px 2px;border-bottom:1px solid var(--paper-2);font-size:14.5px;line-height:1.8;}
  .review li .n{font-family:var(--mono);color:var(--ink-3);}
  .review li.correct{background:#f0f8f3;} .review li.wrong{background:var(--alert-soft);}
  .review li .lab{font-family:var(--gothic);font-size:11px;white-space:nowrap;padding:2px 7px;border-radius:999px;align-self:center;}
  .review li.correct .lab{background:var(--ok);color:#fff;} .review li.wrong .lab{background:var(--alert);color:#fff;}
  .review .cimg{max-width:100%;height:auto;display:block;}
  .review .meta{font-family:var(--gothic);font-size:12px;color:var(--ink-3);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;}
  .review .meta a{color:var(--sheet);}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
  .chip{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--rule);background:#fff;}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .trend{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px 14px 6px;margin-bottom:10px;}
  .trend svg{display:block;width:100%;height:auto;}
  .trend .cap{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
  .hist{list-style:none;margin:0;padding:0;display:grid;gap:6px;}
  .hist button{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 14px;background:#fff;border:1px solid var(--rule);border-radius:8px;font-size:13.5px;}
  .hist .d{font-size:12px;color:var(--ink-3);}
  .hist .sc{font-family:var(--mono);font-weight:600;}
  .hist .pf{font-size:12px;font-weight:600;} .hist .pf.pass{color:var(--ok);} .hist .pf.fail{color:var(--alert);}

  /* ---- スコアレポート(印刷/PDF専用レイアウト) ---- */
  #printArea{display:none;}
  @media print{
    @page{size:A4;margin:14mm 14mm 16mm;}
    html,body{background:#fff;color:#000;font-size:10.5pt;line-height:1.5;}
    #app,#dlg,.drawer{display:none!important;}
    #printArea{display:block;font-family:var(--gothic);}
    .rp-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px;}
    .rp-h .t{font-family:var(--mincho);font-size:17pt;font-weight:600;letter-spacing:.08em;}
    .rp-h .t small{display:block;font-family:var(--gothic);font-size:8.5pt;letter-spacing:.12em;color:#444;font-weight:400;}
    .rp-h .who{font-size:9.5pt;text-align:right;color:#222;line-height:1.6;}
    .rp-score{display:grid;grid-template-columns:auto 1fr;gap:4px 24px;align-items:center;border:1.5px solid #000;padding:10px 16px;margin-bottom:12px;break-inside:avoid;}
    .rp-score .big{font-family:var(--mono);font-size:40pt;line-height:1;}
    .rp-score .big small{font-size:14pt;color:#666;}
    .rp-score .v{font-family:var(--mincho);font-size:16pt;font-weight:600;letter-spacing:.15em;}
    .rp-score .d{grid-column:1/-1;font-size:9.5pt;color:#333;border-top:1px solid #bbb;padding-top:6px;}
    .rp h2{font-size:10.5pt;letter-spacing:.1em;margin:12px 0 5px;padding-left:8px;border-left:4px solid #000;break-after:avoid;}
    .rp table{width:100%;border-collapse:collapse;font-size:9.5pt;}

通り心の墨打ちができないため、通り心より1m離れたところに逃げ墨を設け、基準墨とした。"},{"text":"2階より上階における高さの基準墨は、墨の引通しにより、順次下階の墨を上げた。"},{"text":"高さの基準墨を柱主筋に移す作業は、台直し等を終え、柱主筋が安定した後に行った。"},{"text":"通り心、高低のベンチマーク等の基準墨については、図面化し、墨出し基準図を作成した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35819","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-19","season":"H30_early","no":19,"sectionId":"seko","field":"建築施工","topicName":"地業工事","topic":"t19","body":"地業工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"床付け地盤が堅固で良質な場合には、地盤上に捨てコンクリートを直接打設することができる。"},{"text":"砂利地業では、締固め後の地業の表面が所定の高さになるよう、あらかじめ沈下量を見込んでおく。"},{"text":"土間コンクリートに設ける防湿層のポリエチレンフィルムは、砂利地業の直下に敷き込む。"},{"text":"砂利地業に使用する砂利は、粒径のそろった砂利よりも砂が混じった切込砂利などを用いる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35820","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-20","season":"H30_early","no":20,"sectionId":"seko","field":"建築施工","topicName":"鉄筋の継手・定着","topic":"t20","body":"鉄筋の継手及び定着に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"耐圧スラブ付きの基礎梁下端筋の継手位置は、スパンの中央部とする。"},{"text":"スパイラル筋の柱頭及び柱脚の端部は、40d（ dは異形鉄筋の呼び名の数値又は鉄筋径 ）の定着をとる。"},{"text":"フック付き定着とする場合の定着長さは、定着起点からフックの折曲げ開始点までの距離とする。"},{"text":"梁主筋を重ね継手とする場合、隣り合う継手の中心位置は、重ね継手長さの約0.5倍ずらすか、1.5倍以上ずらす。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35821","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-21","season":"H30_early","no":21,"sectionId":"seko","field":"建築施工","topicName":"型枠工事","topic":"t22","body":"型枠の支保工に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"開口部がない壁が梁の幅方向の中央に付いていたので、梁の支柱をせき板と同時に取り外した。"},{"text":"パイプサポートの頭部及び脚部は、大引及び敷板に釘で固定した。"},{"text":"地盤上に直接支柱を立てるため、支柱の下に剛性のある敷板を敷いた。"},{"text":"パイプサポートに水平つなぎを設けるため、番線を用いて緊結した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35822","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-22","season":"H30_early","no":22,"sectionId":"seko","field":"建築施工","topicName":"コンクリートの調合","topic":"t21","body":"コンクリートの調合に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"細骨材率が小さすぎると、所定のスランプを得るための単位水量を多く必要とする。"},{"text":"高強度コンクリートには、高性能AE減水剤を使用するのが有効である。"},{"text":"単位セメント量が少なすぎると、コンクリートのワーカビリティーが悪くなる。"},{"text":"川砂利と砕石は、それぞれが所定の品質を満足していれば、混合して使用してもよい。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35823","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-23","season":"H30_early","no":23,"sectionId":"seko","field":"建築施工","topicName":"鉄骨の加工","topic":null,"body":"鉄骨の加工に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"けがき寸法は、製作中に生じる収縮、変形及び仕上げしろを考慮した値とした。"},{"text":"板厚20mmの鋼板の切断を、レーザー切断法で行った。"},{"text":"400N/mm2級鋼材のひずみの矯正は、850～900℃に局部加熱して行った後に空冷した。"},{"text":"鋼材の加熱曲げ加工は、200～400℃に加熱して行った。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35824","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-24","season":"H30_early","no":24,"sectionId":"seko","field":"建築施工","topicName":"木造在来軸組","topic":"t8","body":"在来軸組構法における木工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"せいが異なる胴差の継手は、受材心より150mm程度持ち出し、腰掛けかま継ぎとし、ひら金物両面当て釘打ちとした。"},{"text":"土台の継手は、腰掛けあり継ぎとし、下木となる方をアンカーボルトで締め付けた。"},{"text":"垂木の継手は、母屋の上でそぎ継ぎとし、釘打ちとした。"},{"text":"大引の継手は、床束心から150mm程度持ち出し、腰掛けあり継ぎとし、釘打ちとした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35825","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-25","season":"H30_early","no":25,"sectionId":"seko","field":"建築施工","topicName":"シーリング工事","topic":null,"body":"シーリング工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"シーリング材の打継ぎは、目地の交差部及び角部を避け、そぎ継ぎとした。"},{"text":"目地深さが所定の寸法より深かったので、バックアップ材を用いて所定の目地深さになるように調整した。"},{"text":"シーリング材の硬化状態は指触で、接着状態はへらで押えて確認した。"},{"text":"プライマーの塗布後、1日経過してからシーリング材を充填した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35826","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-26","season":"H30_early","no":26,"sectionId":"seko","field":"建築施工","topicName":"タイル張り工事","topic":"t24","body":"有機系接着剤による壁タイル後張り工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"外壁の施工に使用する接着剤は、練混ぜの必要がない一液反応硬化形のものを使用した。"},{"text":"張付け用接着剤は、くし目立てに先立ち、こて圧をかけて平坦に下地に塗り付けた。"},{"text":"くし目立ては、くし目ごての角度を壁面に対し直角とし、くし目を立てた。"},{"text":"二丁掛けのタイル張りは、密着張りで使用する振動工具で加振して張り付けた。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35827","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-27","season":"H30_early","no":27,"sectionId":"seko","field":"建築施工","topicName":"雨どい工事","topic":null,"body":"鋼板製雨どいの工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"谷どいの継手部は、60mm重ね合わせてシーリング材を充填し、リベットで2列に千鳥に留め付けた。"},{"text":"丸たてどいの長さ方向の継手は、下のたてどいを上にくるといの中に、60mm程度差し込んで継いだ。"},{"text":"丸軒どいが所定の流れ勾配となるよう、とい受け金物を900mm程度の間隔で取り付けた。"},{"text":"丸軒どいの継手部は、重ねしろを40mmとし、相互のといの耳巻き部分に力心を差し込み、はんだ付けとした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35828","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-28","season":"H30_early","no":28,"sectionId":"seko","field":"建築施工","topicName":"セルフレベリング","topic":null,"body":"セルフレベリング材塗りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"セルフレベリング材の流し込みに先立ち、下地コンクリートの乾燥期間は、打込み後1か月以上確保した。"},{"text":"セルフレべリング材の塗厚が大きくなりすぎないように、事前にモルタルで下地補修を行った。"},{"text":"セルフレベリング材の流し込みは、吸水調整材塗布後、直ちに行った。"},{"text":"塗厚が10mmのセルフレベリング材の流し込みは、1回で行った。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35829","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-29","season":"H30_early","no":29,"sectionId":"seko","field":"建築施工","topicName":"ガラス工事","topic":null,"body":"ガラス工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"板ガラスの切断面は、クリーンカット（ クリアカット ）とし、エッジ強度の低下を防いだ。"},{"text":"不定形シーリング材構法におけるセッティングブロックは、ガラス下辺の両角の下に設置した。"},{"text":"吹抜け部分のガラス手すりは、破損時の飛散を防ぐため、合わせガラスを使用した。"},{"text":"網入りガラスは、線材が水分の影響により発錆するおそれがあるため、建具の下枠に水抜き孔を設けた。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35830","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-30","season":"H30_early","no":30,"sectionId":"seko","field":"建築施工","topicName":"塗装工事","topic":"t25","body":"塗装工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"強溶剤系の塗料をローラーブラシ塗りとするため、モヘアのローラーブラシを用いた。"},{"text":"木部のクリヤラッカー塗りの下塗りに、ウッドシーラーを用いた。"},{"text":"スプレーガンは、塗面に平行に運行し、1行ごとに吹付け幅が1/3ずつ重なるようにした。"},{"text":"鉄鋼面の合成樹脂調合ペイントの上塗りの塗付け量は、0.08kg/m2とした。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35831","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-31","season":"H30_early","no":31,"sectionId":"seko","field":"建築施工","topicName":"ビニル床シート","topic":null,"body":"ビニル床シート張りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ビニル床シートは、張付けに先立ち仮敷きを行い、巻きぐせを取る。"},{"text":"シートの張付けは、空気を押し出すように行い、その後ローラーで圧着する。"},{"text":"熱溶接工法では、ビニル床シートを張り付け、接着剤が硬化した後、溶接を行う。"},{"text":"熱溶接工法における溶接継目の余盛りは、溶接直後に削り取る。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35832","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-32","season":"H30_early","no":32,"sectionId":"seko","field":"建築施工","topicName":"改修工事","topic":null,"body":"内部仕上げの改修工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"コンクリート壁下地に塗られたモルタルは、一部軽微な浮きが認められたので、アンカーピンニング部分エポキシ樹脂注入工法で補修した。"},{"text":"新たに張るタイルカーペット用の接着剤は、粘着はく離（ ピールアップ ）形をカーペット裏の全面に塗布した。"},{"text":"軽量鉄骨天井下地において、新たに設ける吊りボルト用のアンカーとして、あと施工の金属拡張アンカーを用いた。"},{"text":"軽量鉄骨壁下地において、新たに設ける下地材の高速カッターによる切断面には、鉛の犠牲防食作用が期待できるので、錆止め塗装を行わなかった。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35833","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-33","season":"H30_early","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"工事に先立ち行う事前調査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"既製杭の打込みが予定されているため、近接する工作物や舗装の現況の調査を行うこととした。"},{"text":"掘削中に地下水を揚水するため、周辺の井戸の使用状況の調査を行うこととした。"},{"text":"工事予定の建物による電波障害に関する調査は済んでいたため、タワークレーン設置による影響の確認を省いた。"},{"text":"工事用車両の敷地までの通行経路において、大型車両の通行規制の調査を行い、資材輸送の制約を確認した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35834","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-34","season":"H30_early","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ハンガー式門扉は、重量と風圧を軽減するため、上部を網状の構造とすることとした。"},{"text":"下小屋は、材料置場の近くに設置し、電力及び水道等の設備を設けることとした。"},{"text":"休憩所内は、受動喫煙を防止するため喫煙場所を区画し、そこに換気設備と消火器を設けることとした。"},{"text":"鋼板製仮囲いの下端には、雨水が流れ出やすいようにすき間を設けることとした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35835","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-35","season":"H30_early","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"材料の保管","topic":null,"body":"工事現場における材料の保管に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"型枠用合板は、直射日光が当たらないよう、シートを掛けて保管する。"},{"text":"木毛セメント板は、平滑な床の上に枕木を敷き、平積みで保管する。"},{"text":"砂は、周辺地盤より高い場所に、置場を設置して保管する。"},{"text":"ロール状に巻いたカーペットは、屋内の乾燥した場所に、縦置きにして保管する。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:35836","answer":"answers/H30_early_answers.csv"}},{"id":"H30_early-36","season":"H30_early","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"総合工程表の立案段階で計画すべきこととして、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄骨工事の工程計画では、建方時期に合わせた材料調達、工場製作期間を計画する。"},{"text":"総合工程表の立案に当たっては、最初に全ての工種別の施工組織体系を把握して計画する。"},{"text":"マイルストーン（ 管理日 ）は、工程上、重要な区切りとなる時点などに計画する。"},{"text" n:40150","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-17","season":"H30_late","no":17,"sectionId":"setsu","field":"建築設備等","topicName":"給排水設備","topic":"t15","body":"給排水設備に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"水道直結直圧方式は、水道本管から分岐した水道引き込み管に増圧給水装置を直結し、建物各所に給水する方式である。"},{"text":"中水道とは、水の有効利用を図るため、排水を回収して処理再生し、雑用水などに再利用する水道のことである。"},{"text":"排水系統に設ける通気管は、排水トラップの破封を防止するためのものである。"},{"text":"公共下水道の排水方式には、汚水と雨水を同一系統で排除する合流式と、別々の系統で排除する分流式とがある。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40151","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-18","season":"H30_late","no":18,"sectionId":"seko","field":"建築施工","topicName":"土工事・埋戻し","topic":null,"body":"土工事の埋戻し及び締固めに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"透水性のよい山砂を用いた埋戻しでは、水締めで締め固めた。"},{"text":"埋戻し土は、砂に適度の礫やシルトが混入された山砂を使用した。"},{"text":"建設発生土に水を加えて泥状化したものに固化材を加えて混練した流動化処理土を、埋戻しに使用した。"},{"text":"動的な締固めを行うため、重量のあるロードローラーを使用した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40152","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-19","season":"H30_late","no":19,"sectionId":"seko","field":"建築施工","topicName":"鉄筋のかぶり厚","topic":"t20","body":"鉄筋のかぶり厚さに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"かぶり厚さの確保には、火災時に鉄筋の強度低下を防止するなどの目的がある。"},{"text":"外壁の目地部分のかぶり厚さは、目地底から確保する。"},{"text":"設計かぶり厚さは、最小かぶり厚さに施工精度に応じた割増しを加えたものである。"},{"text":"柱の最小かぶり厚さは、柱主筋の外側表面から確保する。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40153","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-20","season":"H30_late","no":20,"sectionId":"seko","field":"建築施工","topicName":"型枠工事","topic":"t22","body":"型枠工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"埋込み金物やボックス類は、コンクリートの打込み時に移動しないように、せき板に堅固に取り付けた。"},{"text":"梁の側型枠の寸法はスラブ下の梁せいとし、取り付く底型枠の寸法は梁幅で加工した。"},{"text":"柱型枠は、梁型枠や壁型枠を取り付ける前にチェーンなどで控えを取り、変形しないようにした。"},{"text":"コンクリート面に直接塗装仕上げを行うので、コーン付きセパレーターを使用した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40154","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-21","season":"H30_late","no":21,"sectionId":"seko","field":"建築施工","topicName":"型枠存置","topic":"t22","body":"型枠の存置に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"せき板を取り外すことができるコンクリートの圧縮強度は、梁下と梁側とでは同じである。"},{"text":"柱と壁のせき板の最小存置期間は、コンクリートの材齢により定める場合、同じである。"},{"text":"梁下の支柱の最小存置期間は、コンクリートの材齢により定める場合、28日である。"},{"text":"柱のせき板を取り外すことができるコンクリートの圧縮強度は、5N/mm2以上である。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40155","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-22","season":"H30_late","no":22,"sectionId":"seko","field":"建築施工","topicName":"鉄骨建方","topic":null,"body":"鉄骨工事における錆止め塗装に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"素地調整を行った鉄鋼面は、素地が落ち着くまで数日あけて錆止め塗装を行った。"},{"text":"角形鋼管柱の密閉される閉鎖形断面の内面は、錆止め塗装を行わなかった。"},{"text":"コンクリートに埋め込まれる鉄骨梁に溶接された鋼製の貫通スリーブの内面は、錆止め塗装を行った。"},{"text":"組立てによって肌合せとなる部分は、錆止め塗装を行わなかった。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40156","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-23","season":"H30_late","no":23,"sectionId":"seko","field":"建築施工","topicName":"木造在来軸組","topic":"t8","body":"在来軸組構法の木工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"建入れ直し完了後、接合金物を締め付けるとともに、本筋かい、火打材を固定した。"},{"text":"内装下地や造作部材の取付けは、屋根葺き工事が終わってから行った。"},{"text":"土台の据付けは、遣方（やりかた）の心墨や逃げ墨を基準とした。"},{"text":"火打梁は、柱と梁との鉛直構面の隅角部に斜めに入れた。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40157","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-24","season":"H30_late","no":24,"sectionId":"seko","field":"建築施工","topicName":"解体工事","topic":null,"body":"木造建築物の分別解体に係る施工方法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"解体作業は、建築設備を取り外した後、建具と畳を撤去した。"},{"text":"壁及び天井のクロスは、せっこうボードを撤去する前にはがした。"},{"text":"外壁の断熱材として使用されているグラスウールは、細断しながら取り外した。"},{"text":"屋根葺き材は、内装材を撤去した後、手作業で取り外した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40158","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-25","season":"H30_late","no":25,"sectionId":"seko","field":"建築施工","topicName":"防水工事","topic":"t23","body":"屋上アスファルト防水工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"保護コンクリートに設ける伸縮調整目地は、中間部の縦横間隔を3m程度とした。"},{"text":"ルーフィング類は、継目の位置が上下層で同一箇所にならないようにして、水下側から張り付けた。"},{"text":"平場のルーフィングと立上りのルーフィングとの重ね幅は、100mmとした。"},{"text":"保護コンクリートに入れる溶接金網は、保護コンクリートの厚さのほぼ中央に設置した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40159","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-26","season":"H30_late","no":26,"sectionId":"seko","field":"建築施工","topicName":"石工事","topic":null,"body":"内壁空積工法による張り石工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"だぼの取付け穴は、工場で加工した。"},{"text":"一般部の石材は、縦目地あいばにだぼ及び引き金物を用いて据え付けた。"},{"text":"引き金物と下地の緊結部分は、取付け用モルタルを充填し被覆した。"},{"text":"引き金物用の道切りは、工事現場で加工した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40160","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-27","season":"H30_late","no":27,"sectionId":"seko","field":"建築施工","topicName":"金属の表面仕上","topic":null,"body":"金属材料の表面処理及び表面仕上げに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ステンレスの表面に腐食溶解処理して模様を付けたものを、エンボス仕上げという。"},{"text":"銅合金の表面に硫黄を含む薬品を用いてかっ色に着色したものを、硫化いぶし仕上げという。"},{"text":"アルミニウム合金を硫酸その他の電解液中で電気分解して、表面に生成させた皮膜を陽極酸化皮膜という。"},{"text":"鋼材などを電解液中で通電して、表面に皮膜金属を生成させることを電気めっきという。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40161","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-28","season":"H30_late","no":28,"sectionId":"seko","field":"建築施工","topicName":"モルタル塗り","topic":null,"body":"コンクリート壁下地のセメントモルタル塗りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"下塗り、中塗り、上塗りの各層の塗り厚は、6mm程度とした。"},{"text":"下塗り後、モルタル表面のドライアウトを防止するため、水湿しを行った。"},{"text":"上塗りの塗り厚を均一にするため、中塗り後、むら直しを行った。"},{"text":"モルタルの1回の練混ぜ量は、60分以内に使い切れる量とした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40162","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-29","season":"H30_late","no":29,"sectionId":"seko","field":"建築施工","topicName":"建具工事","topic":null,"body":"鋼製建具に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"溶融、鉛めっき鋼板の溶接痕は、表面を平滑に研磨し、鉛・クロムフリーさび止めペイントで補修した。"},{"text":"フラッシュ戸の組立てにおいて、中骨は鋼板厚さ1.6mmとし、600mm間隔で設けた。"},{"text":"くつずりは、あらかじめ裏面に鉄線を付けておき、モルタル詰めを行った後、取り付けた。"},{"text":"建具枠の取付けにおいて、枠の取付け精度は対角寸法差3mm以内とした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40163","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-30","season":"H30_late","no":30,"sectionId":"seko","field":"建築施工","topicName":"塗装の素地ごしらえ","topic":"t25","body":"塗装の素地ごしらえに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄鋼面に付着した機械油の除去は、石油系溶剤を用いて行った。"},{"text":"木部面の穴埋めは、節止めを行ってからパテを充填した。"},{"text":"せっこうボード面のパテかいは、合成樹脂エマルションパテを用いて行った。"},{"text":"モルタル面の吸込止めは、パテかいを行った後に、シーラーを全面に塗り付けた。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40164","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-31","season":"H30_late","no":31,"sectionId":"seko","field":"建築施工","topicName":"せっこうボード張り","topic":null,"body":"壁のせっこうボード張りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"せっこう系接着材直張り工法における張付けは、くさびをかってボードを床面から浮かし、床面からの水分の吸い上げを防いだ。"},{"text":"せっこう系直張り用接着材の盛上げ高さは、接着するボードの仕上がり面までの高さとした。"},{"text":"ボードの重ね張りは、上張りと下張りのジョイント位置が同位置にならないように行った。"},{"text":"せっこう系接着材直張り工法における張付けは、調整定規でボードの表面をたたきながら不陸がないように行った。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40165","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-32","season":"H30_late","no":32,"sectionId":"seko","field":"建築施工","topicName":"カーテン工事","topic":null,"body":"カーテン工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"レースカーテンのカーテンボックスは、窓幅に対して片側各々150mm長くした。"},{"text":"カーテンレールがダブル付けのカーテンボックスの奥行き寸法は、100mmとした。"},{"text":"中空に吊り下げるカーテンレールの吊り位置は、間隔を1m程度とし、曲り箇所及び継目部分にも設けた。"},{"text":"カーテンレールに取り付けるランナーの数は、1m当たり8個とした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40166","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-33","season":"H30_late","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"工事契約後に現場で行う事前調査及び確認に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"建物設計時の地盤調査は、山留め工事の計画には不十分であったので、追加ボーリングを行うこととした。"},{"text":"防護棚を設置するため、敷地地盤の高低及び地中埋設配管の状況を調査することとした。"},{"text":"敷地内の排水を行うため、排水管の勾配が公設ますまで確保できるか調査することとした。"},{"text":"工事用車両の敷地までの経路において、幼稚園や学校の場所を調査し、資材輸送の制限の有無を確認することとした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40167","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-34","season":"H30_late","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"施工者用事務所と監理者用事務所は、同一施設内にそれぞれ分けて設けることとした。"},{"text":"仮囲いを設けなければならないので、その高さは周辺の地盤面から1.5mとすることとした。"},{"text":"仮囲いの出入り口は、施錠できる扉を設置することとした。"},{"text":"工事ゲートは、トラックアジテータが通行するので有効高さを3.8mとすることとした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40168","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-35","season":"H30_late","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"申請・届出","topic":"t33","body":"建築工事に係る申請や届出等に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"延べ面積が20m2の建築物を建築するため、建築工事届を知事に届け出た。"},{"text":"耐火建築物に吹き付けられた石綿等の除去作業を行うため、建設工事計画届を労働基準監督署長に届け出た。"},{"text":"積載荷重が1tの仮設の人荷用エレベーターを設置するため、エレベーター設置届を労働基準監督署長に提出した。"},{"text":"歩道に工事用仮囲いを設置するため、道路占用の許可を警察署長に申請した。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40169","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-36","season":"H30_late","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"工程計画及び工程管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ネットワーク工程表は、工程における複雑な作業間の順序関係を視覚的に表現することができる工程表である。"},{"text":"山積工程表は、同種の作業を複数の工区や階で繰り返し実施する場合、作業の所要期間を一定にし、各作業班が工区を順々に移動しながら作業を行う手順を示した工程表である。"},{"text":"工程計画を立てるに当たっては、その地域の雨天日や強風日等を推定して作業不能日を設定する。"},{"text":"各作業の所要期間は、作業の施工数量を投入数量と1日当たりの施工能力で除して求める。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40170","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-37","season":"H30_late","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"バーチャート/ネットワーク工程表","topic":"t29","body":"バーチャート工程表に関する記述として、最も適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工事全体を掌握するには都合がよく、作成しやすい。"},{"text":"工程上のキーポイント、重点管理しなければならない作業が判断しやすい。"},{"text":"各作業の順序関係を、明確に把握することができる。"},{"text":"工事を構成する各作業を縦軸に記載し、工事の達成度を横軸にして表す。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40171","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-38","season":"H30_late","no":38,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"次の用語のうち、品質管理に最も関係の少ないものはどれか。","bodyImgs":[],"choices":[{"text":"ばらつき"},{"text":"ロット"},{"text":"マニフェスト"},{"text":"サンプリング"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40172","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-39","season":"H30_late","no":39,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"品質管理のための試験及び検査に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄骨工事において、高力ボルト接合部の締付けの検査のため、超音波探傷試験を行った。"},{"text":"シーリング工事において、接着性の確認のため、簡易接着性試験を行った。"},{"text":"塗装工事において、工場塗装した鉄骨の塗膜厚の確認のため、電磁式膜厚計を用いて測定した。"},{"text":"鉄筋工事において、ガス圧接継手の検査のため、抜き取った接合部の引張試験を行った。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40173","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-40","season":"H30_late","no":40,"sectionId":"kanri","field":"施工管理法","topicName":"コンクリート試験・受入","topic":"t21","body":"コンクリートの試験に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"スランプの測定値は、スランプコーンを引き上げた後の、平板からコンクリート最頂部までの高さとした。"},{"text":"スランプ試験は、コンクリートの打込み中に品質の変化が認められた場合にも行うこととした。"},{"text":"1回の圧縮強度試験の供試体の個数は、3個とした。"},{"text":"受入れ検査における圧縮強度試験は、3回の試験で1検査ロットを構成した。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40174","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-41","season":"H30_late","no":41,"sectionId":"kanri","field":"施工管理法","topicName":"作業主任者","topic":"t35","body":"事業者が選任すべき作業主任者として、労働安全衛生法上、定められていないものはどれか。","bodyImgs":[],"choices":[{"text":"型枠支保工の組立て等作業主任者"},{"text":"ガス溶接作業主任者"},{"text":"足場の組立て等作業主任者"},{"text":"ALCパネル等建込み作業主任者"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40175","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-42","season":"H30_late","no":42,"sectionId":"kanri","field":"施工管理法","topicName":"足場","topic":"t31","body":"通路及び足場に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"枠組足場の墜落防止設備として、交さ筋かい及び高さ15cm以上の幅木を設置した。"},{"text":"枠組足場に使用する作業床の幅は、30cm以上とした。"},{"text":"屋内に設ける作業場内の通路は、通路面からの高さ1.8m以内に障害物がないようにした。"},{"text":"折りたたみ式の脚立は、脚と水平面との角度を75度以下とし、開き止めの金具で止めた。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40176","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-43","season":"H30_late","no":43,"sectionId":"hoki","field":"法規","topicName":"建築基準法 その他","topic":null,"body":"次の記述のうち、「建築基準法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"特定行政庁は、工事の施工者に対して工事の計画又は施工の状況に関する報告を求めることができる。"},{"text":"建築主は、木造で階数が3以上の建築物を新築する場合、原則として、検査済証の交付を受けた後でなければ、当該建築物を使用し、又は使用させてはならない。"},{"text":"工事施工者は、建築物の工事を完了したときは、建築主事又は指定確認検査機関の完了検査を申請しなければならない。"},{"text":"建築主事は、鉄骨2階建ての建築物の確認申請書を受理した場合、その受理した日から35日以内に、建築基準関係規定に適合するかどうかを審査しなければならない。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40177","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-44","season":"H30_late","no":44,"sectionId":"hoki","field":"法規","topicName":"建築基準法 その他","topic":null,"body":"地上階にある次の居室のうち、「建築基準法」上、原則として、採光のための窓その他の開口部を設けなければならないものはどれか。","bodyImgs":[],"choices":[{"text":"中学校の職員室"},{"text":"事務所の事務室"},{"text":"寄宿舎の寝室"},{"text":"ホテルの客室"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40178","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-45","season":"H30_late","no":45,"sectionId":"hoki","field":"法規","topicName":"建設業の許可","topic":"t34","body":"建設業の許可に関する記述として、「建設業法」上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"営業所に置く専任技術者について、代わるべき者があるときは、その者について、書面を提出しなければならない。"},{"text":"許可を受けた建設業の業種の区分について変更があったときは、その旨の変更届出書を提出しなければならない。"},{"text":"営業所の所在地について、同一の都道府県内で変更があったときは、その旨の変更届出書を提出しなければならない。"},{"text":"使用人数に変更を生じたときは、その旨を書面で届け出なければならない。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:40179","answer":"answers/H30_late_answers.csv"}},{"id":"H30_late-46","season":"H30_late","no":46,"sectionId":"hoki","field":"法規","topicName":"主任技術者・監理技術者","topic":"t34","body":"工事現場における技術者に関する記述として、建設業法上、誤っているものはどれか。","bodyImgs":[],"choices":[{"text":"建設業者は、発注者から 3,500 万円で請け負った建設工事を施工するときは、主任技術者を置かなければならない。"},{"text":"工事現場における建設工事の施工に従事する者は、主任技術者又は監理技術者がその職務として行う指導に従わなければならない。"},{"text":"元請負人の特定建設業者から請け負った建設工事で、元請負人に監理技術者が置かれている場合は、施工する建設業の許可を受けた下請負人は主任技術者を置かなくてもよい。"},{"text":"請負代金の額が 7,000 万円の工場の建築一式工事を請け負った建設業者は、当該工事現場における建設工事の施工の技術上の管理をつかさどる技術者を専任の者としなければならない。"}] ers/R1_early_answers.csv"}},{"id":"R1_early-12","season":"R1_early","no":12,"sectionId":"gaku","field":"建築学","topicName":"木質材料","topic":"t12","body":"木質材料に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"集成材とは、ひき板、小角材等をその繊維方向を互いにほぼ平行にして、厚さ、幅及び長さの方向に集成接着したものである。"},{"text":"直交集成板とは、ひき板又は小角材をその繊維方向を互いにほぼ平行にして幅方向に並べ又は接着したものを、主としてその繊維方向を互いにほぼ直角にして積層接着し、３層以上の構造を持たせたものである。"},{"text":"単板積層材とは、木材の小片を接着し板状に成形した一般材に、切削した単板を積層接着したものである。"},{"text":"合板とは、切削した単板３枚以上を主としてその繊維方向を互いにほぼ直角にして接着したものである。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43007","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-13","season":"R1_early","no":13,"sectionId":"gaku","field":"建築学","topicName":"タイル(JIS規定)","topic":null,"body":"日本産業規格（JIS）に規定するセラミックタイルに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"素地（きじ）は、タイルの主体をなす部分をいい、施ゆうタイルの場合、表面に施したうわぐすりも含まれる。"},{"text":"表張りユニットタイルとは、多数個並べたタイルの表面に、表張り紙を張り付けて連結したものをいう。"},{"text":"裏連結ユニットタイルとは、多数個並べたタイルの裏面や側面を、ネットや台紙等の裏連結材で連結したものをいう。"},{"text":"タイルには平物と役物があり、それぞれ形状は定形タイルと不定形タイルに区分される。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43008","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-14","season":"R1_early","no":14,"sectionId":"gaku","field":"建築学","topicName":"防水材料","topic":"t23","body":"防水材料に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"アスファルトプライマーは、下地と防水層の接着性を向上させるために用いる。"},{"text":"砂付あなあきアスファルトルーフィングは、下地と防水層を絶縁するために用いる。"},{"text":"網状アスファルトルーフィングは、立上り防水層の張りじまいや貫通配管回り等の増張りに用いる。"},{"text":"絶縁用テープは、防水層の末端部に使用し、防水層のずれ落ち、口あき、はく離等の防止に用いる。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43009","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-15","season":"R1_early","no":15,"sectionId":"setsu","field":"建築設備等","topicName":"アスファルト舗装","topic":null,"body":"構内舗装工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"アスファルト舗装の表層から路盤までの厚さは、路床土の設計CBRの値が大きいほど薄くできる。"},{"text":"クラッシャランとは、岩石を割り砕いたままで、ふるい分けをしていない砕石のことである。"},{"text":"コンクリート舗装に用いるコンクリートのスランプの値は、一般の建築物に用いるものより大きい。"},{"text":"路床は、地盤が軟弱な場合を除いて、現地盤の土をそのまま十分に締め固める。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43010","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-16","season":"R1_early","no":16,"sectionId":"setsu","field":"建築設備等","topicName":"日本工業規格（JIS）に規定す","topic":null,"body":"日本産業規格（JIS）に規定する構内電気設備の名称とその配線用図記号の組合せとして、不適当なものはどれか。","bodyImgs":[],"choices":[{"img":"exam_img/R1_early/a16_1.png"},{"img":"exam_img/R1_early/a16_2.png"},{"img":"exam_img/R1_early/a16_3.png"},{"img":"exam_img/R1_early/a16_4.png"}],"answer":[4],"answerMode":"single","hasImage":true,"verified":true,"flags":[],"src":{"text":"kakomonn:43011","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-17","season":"R1_early","no":17,"sectionId":"setsu","field":"建築設備等","topicName":"建築設備","topic":null,"body":"建築設備とそれに関連する用語の組合せとして、最も関係の少ないものはどれか。","bodyImgs":[],"choices":[{"text":"給水設備 ――――― ヒートポンプ"},{"text":"排水設備 ――――― トラップ"},{"text":"電気設備 ――――― バスダクト"},{"text":"空気調和設備 ――― 2重ダクト"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43012","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-18","season":"R1_early","no":18,"sectionId":"seko","field":"建築施工","topicName":"基礎・地盤","topic":"t9","body":"地盤の標準貫入試験に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"貫入量100mmごとの打撃回数を記録し、1回の貫入量が100mmを超えた打撃は、その貫入量を記録した。"},{"text":"本打ちの貫入量200mmに対する打撃回数が30回であったので、その深さのN値を30とした。"},{"text":"本打ちの打撃回数は、特に必要がなかったので、50回を限度として打撃を打ち切った。"},{"text":"本打ちは、ハンマーの落下高さを760mmとし、自由落下させた。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43013","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-19","season":"R1_early","no":19,"sectionId":"seko","field":"建築施工","topicName":"鉄筋のかぶり厚","topic":"t20","body":"鉄筋のかぶり厚さに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"大梁の最小かぶり厚さは、梁主筋の外側表面から確保する。"},{"text":"D29以上の梁主筋のかぶり厚さは、主筋の呼び名に用いた数値の1.5倍以上とする。"},{"text":"直接土に接する梁と布基礎の立上り部のかぶり厚さは、ともに40mm以上とする。"},{"text":"杭基礎におけるベース筋の最小かぶり厚さは、杭頭から確保する。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43014","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-20","season":"R1_early","no":20,"sectionId":"seko","field":"建築施工","topicName":"型枠締付金物","topic":"t22","body":"型枠の締付け金物等に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"独立柱の型枠の組立てには、セパレータやフォームタイが不要なコラムクランプを用いた。"},{"text":"打放し仕上げとなる外壁コンクリートの型枠に使用するセパレータは、コーンを取り付けないものを用いた。"},{"text":"外周梁の側型枠の上部は、コンクリートの側圧による変形防止のため、スラブ引き金物を用いて固定した。"},{"text":"型枠脱型後にコンクリート表面に残るセパレータのねじ部分は、ハンマーでたたいて折り取った。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43015","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-21","season":"R1_early","no":21,"sectionId":"seko","field":"建築施工","topicName":"コンクリートの調合","topic":"t21","body":"コンクリートの調合に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"コンクリートに含まれる塩化物は、原則として塩化物イオン量で0.30kg/m3以下とする。"},{"text":"単位セメント量は、水和熱及び乾燥収縮によるひび割れを防止する観点からは、できるだけ少なくする。"},{"text":"単位水量は、最大値を185kg/m3とし、所定の品質が確保できる範囲内で、できるだけ少なくする。"},{"text":"細骨材率は、乾燥収縮によるひび割れを少なくするためには、高くする。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43016","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-22","season":"R1_early","no":22,"sectionId":"seko","field":"建築施工","topicName":"高力ボルト接合","topic":null,"body":"高力ボルト摩擦接合に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ナット側の座金は、座金の内側面取り部がナットに接する側に取り付ける。"},{"text":"ナット回転法による本締めにおいて、ナットの回転量が不足しているボルトは、所定の回転量まで追締めする。"},{"text":"ナットとボルトが共回りを生じた場合は、新しいボルトセットに取り替える。"},{"text":"ボルトの締付けは、ボルト群ごとに継手の周辺部より中央に向かう順序で行う。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43017","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-23","season":"R1_early","no":23,"sectionId":"seko","field":"建築施工","topicName":"木造在来軸組","topic":"t8","body":"在来軸組構法の木工事における継手の図の名称として、不適当なものはどれか。","bodyImgs":[],"choices":[{"img":"exam_img/R1_early/a23_1.png"},{"img":"exam_img/R1_early/a23_2.png"},{"img":"exam_img/R1_early/a23_3.png"},{"img":"exam_img/R1_early/a23_4.png"}],"answer":[4],"answerMode":"single","hasImage":true,"verified":true,"flags":[],"src":{"text":"kakomonn:43018","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-24","season":"R1_early","no":24,"sectionId":"seko","field":"建築施工","topicName":"RC構造","topic":"t6","body":"鉄筋コンクリート造建築物の解体工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"地上作業による解体は、地上から解体重機で行い、上階から下階へ床、梁、壁、柱の順に解体していく。"},{"text":"階上作業による解体は、屋上に揚重した解体重機で最上階から解体し、解体で発生したコンクリート塊を利用してスロープをつくり、解体重機を下階に移動させながら行う。"},{"text":"外周部の転倒解体工法では、外周部を転倒させる床に、事前にコンクリート塊や鉄筋ダンゴなどをクッション材として積んでおく。"},{"text":"外周部の転倒解体工法では、最初に柱脚部の柱主筋をすべて切断し、次に壁下部の水平方向、壁及び梁端部の垂直方向の縁切りを行った後に転倒させる。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43019","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-25","season":"R1_early","no":25,"sectionId":"seko","field":"建築施工","topicName":"防水工事","topic":"t23","body":"塩化ビニル樹脂系ルーフィングシート防水接着工法に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ルーフィングシート相互の接合部は、重ね面を溶剤溶着とし、端部は液状シール材を用いて処理した。"},{"text":"プライマーは、ALCパネル下地であったため、塗布しなかった。"},{"text":"防水層の立上り末端部は、押え金物で固定し、不定形シール材を用いて処理した。"},{"text":"ルーフィングシートの張付けは、エポキシ樹脂系接着剤を用い、下地面のみに塗布した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43020","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-26","season":"R1_early","no":26,"sectionId":"seko","field":"建築施工","topicName":"RC構造","topic":"t6","body":"鉄筋コンクリート造の外壁乾式工法による張り石工事に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"入隅で石材がのみ込みとなる部分は、目地位置より20mmを表面仕上げと同様に仕上げた。"},{"text":"ファスナー部分は、固定のため、張り石と躯体のすき間に取付け用モルタルを充填した。"},{"text":"石材間の一般目地は、目地幅を10mmとしてシーリング材を充填した。"},{"text":"幅木は、衝撃対策のため、張り石と躯体のすき間に裏込めモルタルを充填した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43021","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-27","season":"R1_early","no":27,"sectionId":"seko","field":"建築施工","topicName":"金属の表面仕上","topic":null,"body":"ステンレス板の表面仕上げの説明として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"No.2Bは、冷間圧延して熱処理、酸洗した後、適度な光沢を与えるために軽い冷間圧延をした仕上げである。"},{"text":"ヘアラインは、冷間圧延して光輝熱処理を行い、さらに光沢を上げるために軽い冷間圧延をした仕上げである。"},{"text":"エッチングは、化学処理により研磨板に図柄や模様を施した仕上げである。"},{"text":"鏡面は、研磨線がなくなるまでバフ仕上げをした最も反射率の高い仕上げである。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43022","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-28","season":"R1_early","no":28,"sectionId":"seko","field":"建築施工","topicName":"仕上塗材仕上げ","topic":null,"body":"仕上塗材仕上げに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"各工程ごとに用いる下塗材、主材及び上塗材は、同一製造所のものとした。"},{"text":"仕上塗材の付着性の確保や目違いの調整のため、下地コンクリート面にセメント系下地調整塗材を使用した。"},{"text":"シーリング面への仕上塗材仕上げは、塗重ね適合性を確認し、シーリング材の硬化後に行った。"},{"text":"複層仕上塗材の仕上げ形状を凹凸状とするため、主材基層、主材模様及び上塗りをローラー塗り工法とした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43023","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-29","season":"R1_early","no":29,"sectionId":"seko","field":"建築施工","topicName":"建具工事","topic":null,"body":"建具金物に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"モノロックは、内外の握り玉の同一線上で施解錠ができる錠で、押しボタンやシリンダーが設けられている。"},{"text":"グラビティヒンジは、扉側と枠側のヒンジ部の勾配を利用し、常時開又は常時閉鎖の設定ができる。"},{"text":"ピボットヒンジは、床に埋め込まれる扉の自閉金物で、自閉速度を調整できる。"},{"text":"ドアクローザは、開き戸の自閉機能と閉鎖速度制御機能を有している。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43024","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-30","season":"R1_early","no":30,"sectionId":"seko","field":"建築施工","topicName":"塗装の素地ごしらえ","topic":"t25","body":"塗装工事の素地ごしらえに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"透明塗料塗りをする木部面に著しい色むらがあったため、着色剤を用いて色むら直しを行った。"},{"text":"けい酸カルシウム板面の吸込み止めは、穴埋めやパテかいの後に塗布した。"},{"text":"ALCパネル面の吸込み止めは、下地調整前に全面に塗布した。"},{"text":"鉄鋼面の錆及び黒皮は、サンドブラストで除去した。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43025","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-31","season":"R1_early","no":31,"sectionId":"seko","field":"建築施工","topicName":"床仕上(カーペット・フローリング)","topic":null,"body":"床のフローリング張りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"体育館の壁とフローリングボードの取合いは、すき間が生じないように突き付けた。"},{"text":"根太張り工法で釘打ちと併用する接着剤は、エポキシ樹脂系接着剤とした。"},{"text":"根太張り用のフローリングボードは、根太上に接着剤を塗布し、雄ざねの付け根から隠し釘留めとした。"},{"text":"張込み完了後の表面に生じた目違いは、養生期間を経過した後、サンディングした。"}],"answer":[1],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43026","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-32","season":"R1_early","no":32,"sectionId":"seko","field":"建築施工","topicName":"押出成形セメント板","topic":null,"body":"外壁の押出成形セメント板張りに関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"パネルの取付け金物（Zクリップ）は、下地鋼材にかかり代（しろ）を30mm以上確保して取り付けた。"},{"text":"パネルの取付け金物（Zクリップ）は、取付けボルトがルーズホールの中心に位置するように取り付けた。"},{"text":"幅600mmのパネルに設ける欠込み幅は、300mm以下とした。"},{"text":"工事現場でのパネルへの取付けボルトの孔あけは、振動ドリルを用いて行った。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43027","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-33","season":"R1_early","no":33,"sectionId":"kanri","field":"施工管理法","topicName":"事前調査","topic":"t26","body":"事前調査や準備作業に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"敷地境界標石があったが、関係者立会いの上、敷地境界の確認のための測量を行うこととした。"},{"text":"地業工事で振動が発生するおそれがあるため、近隣の商店や工場の業種の調査を行うこととした。"},{"text":"相互チェックできるように木杭ベンチマークを複数設けたため、周囲の養生柵を省略することとした。"},{"text":"既存の地下埋設物を記載した図面があったが、位置や規模の確認のための掘削調査を行うこととした。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43028","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-34","season":"R1_early","no":34,"sectionId":"kanri","field":"施工管理法","topicName":"仮設計画","topic":"t27","body":"仮設計画に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"ガスボンベ置場は、小屋の壁の１面は開放とし、他の３面の壁は上部に開口部を設けることとした。"},{"text":"工事現場の敷地周囲の仮囲いに設置する通用口には、内開き扉を設けることとした。"},{"text":"所定の高さを有し、かつ、危害を十分防止し得る既存の塀を、仮囲いとして使用することとした。"},{"text":"工事ゲートの有効高さは、鉄筋コンクリート造の工事のため、最大積載時の生コン車の高さとすることとした。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43029","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-35","season":"R1_early","no":35,"sectionId":"kanri","field":"施工管理法","topicName":"建築工事に係る提出書類とその提出先","topic":null,"body":"建築工事に係る提出書類とその提出先に関する記述として、不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"掘削深さが10m以上である地山の掘削を行うため、建設工事計画届を労働基準監督署長に提出した。"},{"text":"仮設のゴンドラを設置するため、ゴンドラ設置届を労働基準監督署長に提出した。"},{"text":"延べ面積が10m2を超える建築物を除却するため、建築物除却届を労働基準監督署長に提出した。"},{"text":"常時10人の労働者が従事する事業で附属寄宿舎を設置するため、寄宿舎設置届を労働基準監督署長に提出した。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43030","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-36","season":"R1_early","no":36,"sectionId":"kanri","field":"施工管理法","topicName":"工程計画","topic":"t28","body":"建築工事の工程計画及び工程管理に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"工事に必要な実働日数に作業休止日を考慮した日数を、暦日という。"},{"text":"工程計画は、所定の工期内で、所定の品質を確保し、経済的に施工できるよう作成する。"},{"text":"作業員や資機材等の投入量が一定量を超えないように工程を調整することを、山崩しという。"},{"text":"横軸に工期を取り、出来高累計を縦軸とした進捗度グラフは、一般に直線となる。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43031","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-37","season":"R1_early","no":37,"sectionId":"kanri","field":"施工管理法","topicName":"バーチャート/ネットワーク工程表","topic":"t29","body":"バーチャート工程表に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"各作業の全体工期への影響度が把握しにくい。"},{"text":"各作業の開始時期、終了時期及び所要期間を把握しやすい。"},{"text":"工程表に示す作業を増やしたり、作業を細分化すると、工程の内容が把握しやすくなる。"},{"text":"主要な工事の節目をマイルストーンとして工程表に付加すると、工程の進捗状況が把握しやすくなる。"}],"answer":[3],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43032","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-38","season":"R1_early","no":38,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"品質管理の用語に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"見える化は、問題、課題、対象等を、いろいろな手段を使って明確にし、関係者全員が認識できる状態にすることである。"},{"text":"QCDSは、計画、実施、点検、処置のサイクルを確実、かつ、継続的に回してプロセスのレベルアップをはかる考え方である。"},{"text":"特性要因図は、結果の特性と、それに影響を及ぼしている要因との関係を魚の骨のような図に体系的にまとめたものである。"},{"text":"5Sは、職場の管理の前提となる整理、整頓、清掃、清潔、しつけ（躾）について、日本語ローマ字表記で頭文字をとったものである。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43033","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-39","season":"R1_early","no":39,"sectionId":"kanri","field":"施工管理法","topicName":"品質管理","topic":"t30","body":"品質管理のための試験に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"鉄骨工事において、高力ボルト接合の摩擦面の処理状況の確認は、すべり係数試験によって行った。"},{"text":"地業工事において、支持地盤の地耐力の確認は、平板載荷試験によって行った。"},{"text":"鉄筋工事において、鉄筋のガス圧接部の確認は、超音波探傷試験によって行った。"},{"text":"既製コンクリート杭地業工事において、埋込み杭の根固め液の確認は、針入度試験によって行った。"}],"answer":[4],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43034","answer":"answers/R1_early_answers.csv"}},{"id":"R1_early-40","season":"R1_early","no":40,"sectionId":"kanri","field":"施工管理法","topicName":"コンクリート試験・受入","topic":"t21","body":"レディーミクストコンクリートの受入時の試験に関する記述として、最も不適当なものはどれか。","bodyImgs":[],"choices":[{"text":"圧縮強度の試験は、コンクリート打込み日ごと、打込み工区ごと、かつ、150m3以下の単位ごとに行った。"},{"text":"スランプ試験は、1cm単位で測定した。"},{"text":"粗骨材の最大寸法が20mmの高流動コンクリートは、スランプフロー試験を行った。"},{"text":"普通コンクリートの空気量の許容差は、±1.5％とした。"}],"answer":[2],"answerMode":"single","hasImage":false,"verified":true,"flags":[],"src":{"text":"kakomonn:43035","answ
