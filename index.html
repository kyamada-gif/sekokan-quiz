<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2級建築施工管理 第一次検定 穴埋めクイズ（全35論点）</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#2b2d33; --muted:#717784;
    --accent:#6486b4; --accent-dk:#3f5d86; --accent-soft:#eef2f8; --accent-soft2:#e3eaf4;
    --line:#e7e9ee; --ok:#2f9e54; --ok-bg:#e6f4ec; --ng:#cf5a55; --ng-bg:#fbe9e8; --warn-bg:#fbf6ec;
  }
  *{box-sizing:border-box;}
  body{font-family:"Hiragino Sans","Yu Gothic",sans-serif;max-width:880px;margin:0 auto;padding:24px 18px 80px;line-height:1.95;color:var(--ink);background:var(--bg);font-size:15.5px;}
  h1{font-size:clamp(16px,4.6vw,20px);font-weight:600;color:var(--accent-dk);margin:4px 0 16px;line-height:1.4;overflow-wrap:anywhere;}
  h2{font-size:19px;font-weight:600;color:var(--accent-dk);margin:6px 0 4px;}
  h3{font-size:16px;color:#444;margin-top:22px;}
  nav{background:var(--card);padding:12px 14px;border-radius:12px;margin-bottom:22px;box-shadow:0 1px 4px rgba(30,40,60,.07);}
  .mode-toggle{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .mode-label{font-size:12px;color:var(--muted);margin-right:2px;}
  .mode-btn{padding:5px 13px;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;}
  .mode-btn:hover{background:var(--accent-soft);}
  .mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .cat-bar{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .cat-btn{padding:7px 14px;border:none;border-radius:999px;background:transparent;color:var(--muted);font-size:13.5px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;}
  .cat-btn:hover{background:var(--accent-soft);color:var(--accent-dk);}
  .cat-btn.active{background:var(--accent-soft2);color:var(--accent-dk);font-weight:600;}
  .topic-bar{padding-top:10px;}
  .topic-group{display:none;flex-wrap:wrap;gap:6px;}
  .topic-group.active{display:flex;}
  .topic-group button{padding:7px 13px;border:none;border-radius:999px;background:#f1f3f7;color:var(--ink);font-size:13.5px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;}
  .topic-group button:hover{background:var(--accent-soft);}
  .topic-group button.active{background:var(--accent);color:#fff;}
  .content{background:var(--card);padding:26px 30px;border-radius:14px;box-shadow:0 1px 4px rgba(30,40,60,.06);}
  p{margin:13px 0;}
  ul{padding-left:22px;} li{margin-bottom:8px;}
  .intro{background:var(--accent-soft);padding:14px 18px;border-radius:10px;margin-bottom:18px;font-size:13.5px;color:#3b4250;}
  .freq-note{font-size:11.5px;color:var(--muted);margin:2px 0 12px;line-height:1.6;}
  .topic-meta{background:#f3f6fb;border-left:3px solid var(--accent);padding:11px 15px;border-radius:8px;margin:8px 0 20px;color:#46506a;font-size:14px;}
  .meta-label{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:1px;}
  .blank-num{color:var(--accent);font-weight:bold;font-size:11px;vertical-align:super;margin-right:1px;}
  .blank-choice-wrap{display:inline-block;position:relative;vertical-align:middle;margin:0 2px;}
  .blank-placeholder{display:inline-block;min-width:118px;padding:3px 26px 3px 12px;border:1.5px solid #cdd8ea;border-radius:6px;background:#fff;font-size:14px;cursor:pointer;font-family:inherit;line-height:1.5;text-align:center;position:relative;transition:background .15s,border-color .15s;}
  .blank-placeholder:hover{background:var(--accent-soft);border-color:var(--accent);}
  .blank-placeholder::after{content:'\25BC';font-size:9px;color:var(--accent);opacity:.6;position:absolute;right:10px;top:50%;transform:translateY(-50%);transition:transform .2s ease;}
  .blank-choice-wrap.open .blank-placeholder::after{transform:translateY(-50%) rotate(180deg);}
  .blank-placeholder.answered{padding-right:12px;} .blank-placeholder.answered::after{content:'';}
  .blank-placeholder.correct{background:var(--ok-bg);border-color:var(--ok);color:#1f7b34;font-weight:bold;}
  .blank-placeholder.wrong{background:var(--ng-bg);border-color:var(--ng);color:#b02a37;font-weight:bold;}
  .blank-placeholder .ph-text{display:inline-block;min-height:1.2em;min-width:2em;}
  .blank-placeholder.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dk);}
  .blank-choice-btn.selected{background:var(--accent-soft2);border-color:var(--accent);font-weight:600;}
  .blank-choices-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:50;display:flex;gap:6px;flex-wrap:nowrap;align-items:center;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(30,40,60,.16);white-space:nowrap;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .15s ease-out,transform .15s ease-out,visibility .15s;pointer-events:none;}
  .blank-choices-pop.show{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;}
  .blank-choices-pop::before{content:'';position:absolute;top:-7px;left:24px;width:12px;height:12px;background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);}
  .blank-choice-btn{display:inline-block;padding:5px 13px;border:1.5px solid #dbe3ef;border-radius:6px;background:#fbfcfe;font-size:13px;cursor:pointer;transition:background .12s,border-color .12s,transform .08s;font-family:inherit;line-height:1.4;white-space:nowrap;}
  .blank-choice-btn:hover:not(.disabled){background:var(--accent-soft);border-color:var(--accent);transform:translateY(-1px);}
  .blank-choice-btn.correct{background:var(--ok-bg);border-color:var(--ok);color:#1f7b34;font-weight:bold;}
  .blank-choice-btn.wrong{background:var(--ng-bg);border-color:var(--ng);color:#b02a37;}
  .blank-choice-btn.disabled{cursor:default;transform:none;}
  .blank-reset-btn{display:inline-block;padding:3px 8px;border:1px solid #d6dae2;border-radius:6px;background:#f4f5f7;font-size:11px;cursor:pointer;line-height:1.2;margin-left:4px;}
  .blank-reset-btn:hover{background:#e8eaee;}
  /* --- モードUI改善（①暗記→②テスト・マスターバッジ等） --- */
  /* モード切替バーだけスクロール時に上部固定（その下のジャンル/論点選択は固定しない） */
  .mode-toggle{display:flex;align-items:center;gap:7px;flex-wrap:wrap;position:sticky;top:0;z-index:60;background:var(--card);padding:10px 14px;border-radius:12px;margin-bottom:14px;border-bottom:0;box-shadow:0 1px 4px rgba(30,40,60,.07);}
  .mode-arrow{color:#b9c2cf;font-size:15px;font-weight:600;}
  #topic-area{padding-bottom:96px;} /* 浮遊ボタンバーが本文を隠さないよう余白 */
  .guide-start{text-align:center;margin:28px 0 8px;}
  .guide-start button{padding:12px 30px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 10px rgba(30,40,60,.2);}
  .guide-start button:hover{background:var(--accent-dk);}
  .topic-group button.done::after{content:" ✓";color:#2e9e57;font-weight:700;}
  .mastery-count{margin-left:auto;font-size:12.5px;font-weight:600;color:#2e9e57;background:#eef8f1;border:1px solid #d4ecdc;padding:5px 12px;border-radius:999px;white-space:nowrap;}
  .blank-count{display:inline-block;font-size:12px;font-weight:600;color:#5c739a;background:#eef2f9;border:1px solid #dbe4f2;border-radius:999px;padding:4px 12px;margin:2px 0 10px;}
  /* 進捗リング（右下に固定・スクロールしても常時表示・両モード共通） */
  .prog-ring{position:fixed;right:18px;bottom:120px;width:64px;height:64px;border-radius:50%;z-index:45;/* 選択肢ポップアップ(50)より下層に */display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;padding:0;box-shadow:0 2px 10px rgba(30,40,60,.22);background:conic-gradient(var(--accent) 0deg,#e8ebf0 0deg);font-family:inherit;}
  .prog-ring .inner{width:51px;height:51px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#3a5a86;letter-spacing:.02em;}
  .prog-ring.complete .inner{color:#2e9e57;}
  .prog-ring:hover .inner{background:#f6f9ff;}
  .score.perfect{background:#fff6da;color:#9a7b14;animation:scorepop .45s ease;}
  @keyframes scorepop{0%{transform:scale(.92);}55%{transform:scale(1.05);}100%{transform:scale(1);}}
  .blank-input{display:inline-block;width:120px;padding:3px 8px;border:1.5px solid #cdd8ea;border-radius:6px;font-size:14px;margin:0 2px;background:#fff;}
  .blank-input.correct{background:var(--ok-bg);border-color:var(--ok);}
  .blank-input.wrong{background:var(--ng-bg);border-color:var(--ng);}
  .answer-hint{font-size:11px;color:var(--ng);margin-left:4px;display:none;} .answer-hint.show{display:inline;}
  .traps{background:#fbf5f4;border-left:3px solid #d99;border-radius:8px;padding:2px 16px;margin:14px 0;font-size:13.5px;}
  .traps summary{cursor:pointer;color:#9a4a44;font-weight:600;font-size:13.5px;padding:9px 0;list-style:none;user-select:none;}
  .traps summary::-webkit-details-marker{display:none;}
  .traps summary::before{content:'\26A0 ';opacity:.75;}
  .traps ul{padding-left:20px;margin:0 0 8px;} .traps li{color:#6e3a36;margin-bottom:4px;}
  hr{border:0;border-top:1px solid var(--line);margin:24px 0;}
  .pe-wrap{margin:12px 0 18px;}
  .pe-wrap summary{cursor:pointer;padding:10px 14px;background:var(--accent-soft);border-radius:8px;font-size:13.5px;font-weight:600;color:var(--accent-dk);user-select:none;list-style:none;}
  .pe-wrap summary::-webkit-details-marker{display:none;}
  .pe-wrap summary::before{content:'\1F4DD ';}
  .pe-wrap[open] summary{border-radius:8px 8px 0 0;background:var(--accent-soft2);}
  .pe-wrap summary:hover{background:var(--accent-soft2);}
  .past-exam{background:#f8fafd;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:16px 20px;}
  .past-exam .src{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .past-exam .question{font-weight:600;margin-bottom:12px;}
  .past-exam .choices{margin:0;padding:0;list-style:none;}
  .past-exam .choices li{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:7px 0;cursor:pointer;transition:background .15s;}
  .past-exam .choices li:hover{background:var(--accent-soft);}
  .past-exam .choices li.correct{background:var(--ok-bg);border-color:var(--ok);}
  .past-exam .choices li.wrong{background:var(--ng-bg);border-color:var(--ng);}
  .past-exam .choices li.disabled{cursor:default;}
  .past-exam .explanation{display:none;background:var(--warn-bg);border-left:3px solid #e6c45e;padding:12px 16px;margin-top:14px;border-radius:8px;font-size:13.5px;line-height:1.8;}
  .past-exam .explanation.show{display:block;}
  .pe-reset-btn{display:inline-block;margin-top:10px;padding:6px 14px;background:#eef0f3;color:#555;border:none;border-radius:6px;cursor:pointer;font-size:12.5px;}
  .pe-reset-btn:hover{background:#e2e5ea;}
  .pe-close-btn{margin-left:8px;}
  .controls{margin:26px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;position:sticky;bottom:14px;z-index:4;}
  .controls button{padding:10px 22px;font-size:14.5px;border:1.5px solid transparent;border-radius:999px;cursor:pointer;margin:0;box-shadow:0 2px 8px rgba(30,40,60,.16);font-family:inherit;}
  .grade-btn{background:var(--accent);color:#fff;} .grade-btn:hover{background:var(--accent-dk);}
  .grade-btn:disabled{background:#c4ccd8;cursor:not-allowed;}
  .score-note{font-size:11.5px;color:#8a93a3;margin-top:4px;text-align:center;}
  .show-btn{background:#fff;color:var(--accent-dk);border-color:var(--accent);}
  .reset-btn{background:#eef0f3;color:#666;}
  .score{font-size:17px;font-weight:bold;text-align:center;padding:14px;margin:16px 0;border-radius:10px;}
  .score.pass{background:var(--ok-bg);color:#1f7b34;} .score.fail{background:var(--ng-bg);color:#b02a37;}
  u{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px;}
  strong{font-weight:600;}
  .guide-lead{font-size:15px;color:#3b4250;background:var(--accent-soft);padding:15px 18px;border-radius:10px;margin:6px 0 22px;line-height:1.9;}
  .guide-step{display:flex;align-items:center;gap:11px;margin:28px 0 10px;}
  .guide-step .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .guide-step .label{font-size:16.5px;font-weight:600;color:var(--accent-dk);}
  .guide-eg{background:#fff;border:1.5px dashed var(--accent);border-radius:10px;padding:13px 16px;margin:13px 0;text-align:center;font-size:16px;color:var(--accent-dk);font-weight:600;letter-spacing:.02em;}
  .guide-note{background:#f3f6fb;border-left:3px solid var(--accent);border-radius:8px;padding:11px 15px;margin:13px 0;font-size:13.8px;color:#46506a;line-height:1.85;}
  .guide-note .nt{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:1px;}
  @media(max-width:600px){
    body{padding:14px 12px 70px;font-size:15px;}
    .content{padding:18px 16px;overflow-wrap:anywhere;}
    .blank-choices-pop{flex-wrap:wrap;white-space:normal;max-width:82vw;}
    /* タイトル余白のみ調整（サイズはclampで自動調整・PC/スマホ共通表記） */
    h1{margin:2px 0 12px;}
    /* 上部カード（モード／ジャンル）の余白を詰めて本文を早く見せる */
    .mode-toggle{margin-bottom:10px;padding:9px 12px;}
    nav{margin-bottom:14px;padding:10px 12px;}
    /* ジャンルは縦積みにせず、横1行でスワイプできるように */
    .cat-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .cat-bar::-webkit-scrollbar{display:none;}
    .cat-btn{flex:0 0 auto;}
    /* 採点バーのボタンを少し小さく整え、折り返しても窮屈に見せない */
    .controls button{padding:9px 16px;font-size:13.5px;}
    /* 進捗リングは狭幅で小さめに（被り・圧迫を防ぐ） */
    .prog-ring{width:58px;height:58px;bottom:118px;right:14px;}
    .prog-ring .inner{width:46px;height:46px;font-size:11.5px;}
  }
</style>
</head>
<body>

<h1>2級建築施工管理 第一次検定 穴埋めクイズ</h1>

<div class="mode-toggle">
  <span class="mode-label">モード：</span>
  <button class="mode-btn" data-mode="memorize" onclick="setMode('memorize')">① 📖 暗記</button>
  <span class="mode-arrow">→</span>
  <button class="mode-btn" data-mode="test" onclick="setMode('test')">② ✍️ テスト</button>
  <span id="mastery-count" class="mastery-count"></span>
</div>
<nav>
  <div class="cat-bar">
    <button class="cat-btn active" data-cat="guide" onclick="openCategory('guide')">📖 ガイド</button>
    <button class="cat-btn" data-cat="env" onclick="openCategory('env')">環境工学</button>
    <button class="cat-btn" data-cat="str" onclick="openCategory('str')">一般構造</button>
    <button class="cat-btn" data-cat="mat" onclick="openCategory('mat')">建築材料</button>
    <button class="cat-btn" data-cat="set" onclick="openCategory('set')">設備・測量</button>
    <button class="cat-btn" data-cat="con" onclick="openCategory('con')">施工</button>
    <button class="cat-btn" data-cat="qc" onclick="openCategory('qc')">施工管理法</button>
    <button class="cat-btn" data-cat="law" onclick="openCategory('law')">法規</button>
  </div>
  <div class="topic-bar">
    <div class="topic-group active" data-cat="guide">
      <button onclick="showTopic('guide')" id="btn-guide">使い方ガイド</button>
    </div>
    <div class="topic-group" data-cat="env">
      <button onclick="showTopic('t1')" id="btn-t1">換気</button>

      <button onclick="showTopic('t3')" id="btn-t3">採光・照明・日射</button>
      <button onclick="showTopic('t4')" id="btn-t4">音</button>
      <button onclick="showTopic('t5')" id="btn-t5">色</button>
    </div>
    <div class="topic-group" data-cat="str">
      <button onclick="showTopic('t6')" id="btn-t6">RC構造</button>
      <button onclick="showTopic('t7')" id="btn-t7">鉄骨構造</button>
      <button onclick="showTopic('t8')" id="btn-t8">木造軸組</button>
      <button onclick="showTopic('t9')" id="btn-t9">基礎・地盤</button>
      <button onclick="showTopic('t10')" id="btn-t10">荷重・外力</button>
    </div>
    <div class="topic-group" data-cat="mat">
      <button onclick="showTopic('t11')" id="btn-t11">鋼材</button>
      <button onclick="showTopic('t12')" id="btn-t12">木材</button>
      <button onclick="showTopic('t13')" id="btn-t13">コンクリート</button>
      <button onclick="showTopic('t14')" id="btn-t14">シーリング材</button>
    </div>
    <div class="topic-group" data-cat="set">
      <button onclick="showTopic('t15')" id="btn-t15">給排水</button>
      <button onclick="showTopic('t16')" id="btn-t16">空調</button>
      <button onclick="showTopic('t17')" id="btn-t17">測量</button>
    </div>
    <div class="topic-group" data-cat="con">
      <button onclick="showTopic('t18')" id="btn-t18">墨出し・やり方</button>
      <button onclick="showTopic('t19')" id="btn-t19">地業</button>
      <button onclick="showTopic('t20')" id="btn-t20">かぶり厚・継手</button>
      <button onclick="showTopic('t21')" id="btn-t21">コンクリート工事</button>
      <button onclick="showTopic('t22')" id="btn-t22">型枠・支保工</button>
      <button onclick="showTopic('t23')" id="btn-t23">防水</button>
      <button onclick="showTopic('t24')" id="btn-t24">タイル</button>
      <button onclick="showTopic('t25')" id="btn-t25">塗装</button>
    </div>
    <div class="topic-group" data-cat="qc">
      <button onclick="showTopic('t26')" id="btn-t26">事前調査</button>
      <button onclick="showTopic('t27')" id="btn-t27">仮設計画</button>
      <button onclick="showTopic('t28')" id="btn-t28">工程計画</button>
      <button onclick="showTopic('t29')" id="btn-t29">バーチャート</button>
      <button onclick="showTopic('t30')" id="btn-t30">品質管理</button>
      <button onclick="showTopic('t31')" id="btn-t31">足場・安全</button>

    <div class="topic-group" data-cat="law">
      <button onclick="showTopic('t32')" id="btn-t32">用語・採光換気</button>
      <button onclick="showTopic('t33')" id="btn-t33">建築確認</button>
      <button onclick="showTopic('t34')" id="btn-t34">建設業法</button>

<div id="topic-area" class="content"></div>
<button id="prog-ring" class="prog-ring" style="display:none" onclick="jumpNextBlank()" title="次の未回答の穴埋めへ"><span class="inner" id="prog-ring-text"></span></button>

<script>
const TOPICS = {
  guide: {
    guide: true,
    title: '学習ガイド｜毎日30分で合格する進め方',
    lead: ['毎日やることは、ずっと同じです。<strong>「覚える → 解く → テスト」</strong>を繰り返すだけ。<br>机に向かう必要はありません。<strong>毎日30分</strong>、電車の中でもできます。'],
    blocks: [
      { type:'step', n:'1', label:'論点を覚える（暗記）' },
      { type:'p', parts:['まず、その論点を覚えます。全部を読み込む必要はありません。<strong>直前の語句を軸に、ピンポイントで覚えていく</strong>のがコツです。'] },

  t21: {
    title: 'コンクリート工事（調合・養生・受入試験）（出題11回）',
    meta: '調合は水セメント比・単位水量185以下・細骨材率、スランプは荷卸し地点指定。養生は早強で短縮可・せき板取外しと湿潤養生は別。受入検査の必須項目と粒度除外・0.5cm単位が頻出ひっかけ。',
    blocks: [
      {type:'p', parts:['**コンクリートの調合（配合）**とは、セメント・水・骨材（砂＝細骨材、砂利や砕石＝粗骨材）・混和剤を、要求される強度・耐久性・ワーカビリティー（打込みのしやすさ）を満たすように配合する設計です。基本原則は、<u>所定の品質が確保できる範囲で水とセメントをできるだけ少なくする</u>ことです。']},
      {type:'p', parts:['**水セメント比（W/C）**は、<u>耐久性を確保するためには</u>',{b:'①',a:'小さくする',distractors:['大きくする','一定にする','無関係']},'（水が少ないほど緻密で強く、中性化・凍害に強い）。「水量を増やせば強度が上がる」は誤りで、<u>水が多いほど強度は</u>',{b:'②',a:'下がります',distractors:['上がります','変わりません','安定します']},'。']},
      {type:'p', parts:['**単位水量**（コンクリート1m³あたりの水の質量）は、乾燥収縮によるひび割れやブリーディング（打込み後に水が浮く現象）を抑えるため、最大値を',{b:'③',a:'185kg/m³',distractors:['285kg/m³','85kg/m³','385kg/m³']},'とし、できるだけ少なくします。']},
      {type:'p', parts:['**単位セメント量**は、水和熱や乾燥収縮によるひび割れを防止する観点からはできるだけ少なくします。<u>ただし少なすぎると</u>',{b:'④',a:'ワーカビリティーが悪く',distractors:['強度が上がり','収縮が止まり','耐久性が増し']},'なります。**高強度コンクリート**には',{b:'⑤',a:'高性能AE減水剤',distractors:['遅延剤のみ','防錆剤','起泡剤']},'を用いると、所定のスランプを得るのに必要な単位水量を減らせます。']},
      {type:'p', parts:['**細骨材率**（全骨材に占める砂の割合）は、',{b:'⑥',a:'大きすぎる',distractors:['小さすぎる','適正な','ゼロの']},'と所定のスランプを得るための単位水量を多く必要とします。逆にスランプの大きいコンクリートで細骨材率が小さすぎると材料分離しやすくなります。**粗骨材**は、ワーカビリティーを向上させるには扁平なものより',{b:'⑦',a:'球形',distractors:['角張った','針状の','大粒の']},'のものを用います。']},

      {type:'hr'},
      {type:'p', parts:['**養生**とは、打込み後のコンクリートが所定の品質に硬化するよう、適切な温度・湿度を保つ作業です。**普通養生（湿潤養生）**では、直射日光等による急速な乾燥を防ぐため、コンクリートを湿潤状態に保ちます。<u>湿潤養生期間は使用する</u>',{b:'⑧',a:'セメントの種類',distractors:['骨材の種類','水の量','型枠の材質']},'と計画供用期間の級によって決まり、早強ポルトランドセメントは普通ポルトランドセメントより',{b:'⑨',a:'短く',distractors:['長く','同じに','二倍に']},'できます（早強は硬化が速いため）。また、養生温度が高いほど初期の強度発現は速くなりますが、長期材齢における強度の増進はかえって',{b:'㉑',a:'小さく',distractors:['大きく','変わらなく','倍に']},'なります。']},

    blocks: [
      {type:'p', parts:['**防水工事**は、屋根・床・地下などに防水層を設けて雨水や地下水の浸入を防ぐ工事です。代表的な工法に、ルーフィングを積層する**アスファルト防水**、合成ゴム・塩ビのシートを張る**シート防水**、液状の樹脂を塗り重ねる**塗膜（とまく）防水**があります。']},

      {type:'p', parts:['**アスファルト防水（熱工法）**は、溶融釜（とゆうがま）で<u>アスファルトを</u>',{b:'①',a:'210〜220℃',distractors:['100〜120℃','280〜300℃','50〜60℃']},'程度に加熱し、アスファルトルーフィング類を複数層に積層して防水層をつくる工法です。下地コンクリートとの密着をよくするため、最初に',{b:'②',a:'アスファルトプライマー',distractors:['シーリング材','モルタル','エポキシ樹脂']},'を塗布します。これに対し、改質アスファルトシートを用いる常温工法（トーチ工法・自着工法）では、溶融釜での加熱は',{b:'③',a:'不要',distractors:['必要','220℃で必須','倍量必要']},'です。']},
      {type:'p', parts:['防水下地となるコンクリートの入隅（いりずみ）は、ルーフィングが浮かないよう、通りよく',{b:'④',a:'45°の面取り',distractors:['直角','丸面（R面）','段差']},'とします。ルーフィング類は、水が流れ込まないように継目の位置が上下層で同一箇所にならないようにし、<u>低い側である</u>',{b:'⑤',a:'水下（みずしも）側',distractors:['水上（みなかみ）側','中央部','立上り側']},'から張り付けます。']},

      {type:'hr'},
      {type:'p', parts:['保護コンクリートには、温度変化による伸縮を逃がすため**伸縮調整目地**を設けます。目地は中間部の<u>縦横間隔を</u>',{b:'⑨',a:'3m程度',distractors:['10m程度','1m程度','30m程度']},'とし、目地の深さは保護コンクリート厚さの',{b:'⑩',a:'全部（下地まで達する）',distractors:['半分','1/3','表面のみ']},'とします。立上りの入隅部には、保護コンクリートの動きによる防水層の損傷を防ぐため成形緩衝材を取り付けます。']},

      {type:'p', parts:['**塗膜防水**は、ウレタンゴムなどの液状樹脂を塗り重ねて防水層をつくる工法です。下地コンクリートの出隅・入隅の処理がアスファルト防水と異なり、ウレタンゴム系塗膜防水では出隅を',{b:'⑭',a:'面取り（丸面）',distractors:['直角','45°の谷','段差']},'、入隅を',{b:'⑮',a:'直角',distractors:['丸面','面取り','45°']},'に仕上げます。補強布は、突付け張りまたは重ね張りとし、防水材は所定の塗厚を確保するため数回に分けて塗り重ねます。']},

  t34: {
    title: '建設業の許可・請負契約・技術者（出題多数）',
    meta: '許可不要の軽微な工事の閾値、大臣/知事・一般/特定の区分、契約書の必須記載事項、主任/監理技術者と専任要件。閾値と区分の混同が頻出ひっかけ。',
    blocks: [
      {type:'p', parts:['**建設業の許可**は、建設業を営もうとする者が受けるものです。ただし、',{b:'①',a:'軽微な建設工事',distractors:['公共工事','下請工事','解体工事']},'のみを請け負う場合は許可が不要です。軽微な工事とは、建築一式工事以外では<u>請負代金が</u>',{b:'②',a:'500万円',distractors:['1,000万円','1,500万円','4,000万円']},'未満、建築一式工事では請負代金が',{b:'③',a:'1,500万円',distractors:['500万円','3,000万円','5,000万円']},'未満（又は延べ面積150㎡未満の木造住宅）の工事をいいます。<u>下請負人として営もうとする者でも、軽微な工事を超える場合は許可が必要</u>です。']},
      {type:'p', parts:['許可は建設工事の種類ごとに',{b:'④',a:'29業種',distractors:['7業種','15業種','一括']},'に分けて与えられます。同一の営業所で複数の業種（例：建築工事業と内装仕上工事業）の許可を受けることもできます。許可の有効期間は',{b:'⑤',a:'5年',distractors:['3年','10年','無期限']},'で、更新を受けなければ効力を失います。']},
      {type:'p', parts:['許可を出す行政庁は営業所の所在地で決まります。一の都道府県のみに営業所を置く場合は',{b:'⑥',a:'都道府県知事',distractors:['国土交通大臣','市町村長','地方整備局長']},'の許可、二以上の都道府県に営業所を置く場合は',{b:'⑦',a:'国土交通大臣',distractors:['都道府県知事','内閣総理大臣','建設業審議会']},'の許可を受けます。<u>大臣許可か知事許可かは営業所の所在地で決まり、特定・一般の区分とは無関係</u>です。']},
      {type:'pastexam', exam:{

    question:'建設業の許可に関する記述として、「建設業法」上、誤っているものはどれか。',

  }},
      {type:'hr'},
      {type:'p', parts:['**一般建設業**と**特定建設業**の区分は、',{b:'⑧',a:'下請契約',distractors:['元請契約','発注者との契約','請負代金総額']},'に出す金額の大きさで決まります。発注者から直接請け負った（元請の）工事について、<u>下請に出す代金の総額が</u>',{b:'⑨',a:'4,500万円',distractors:['1,500万円','500万円','7,000万円']},'以上（建築一式工事は',{b:'⑩',a:'7,000万円',distractors:['4,500万円','3,500万円','1,500万円']},'以上）となる場合は**特定建設業**の許可が必要です。<u>一般・特定の違いは発注者から直接請け負える金額の違いではない</u>点に注意します（元請として請け負う額に上限はありません）。']},
      {type:'pastexam', exam:{

    answerIndex:2,
    explanation:'特定建設業の許可が必要なのは<strong>元請として下請に出す代金の総額が大きい場合</strong>であり、発注者が国・地方公共団体かどうかは関係ない。「公共工事だから特定建設業」は誤り。今学んだ<strong><u>「特定・一般は下請契約の総額で決まる」</u></strong>で判定可能。'

      {type:'hr'},
      {type:'p', parts:['**建設工事の請負契約書**には、法で定められた事項を記載しなければなりません。主なものは、',{b:'⑪',a:'工事内容',distractors:['会社の年商','従業員数','資本金']},'・請負代金の額、工事着手と完成の時期、請負代金の支払時期及び方法、',{b:'⑫',a:'検査の時期及び方法',distractors:['作業員の名簿','使用機械の一覧','下請業者の住所']},'並びに引渡しの時期、天災等不可抗力による工期変更や損害負担、',{b:'⑬',a:'紛争の解決方法',distractors:['許可番号','年商の報告','株主構成']},'などです。']},

      {type:'hr'},
      {type:'p', parts:['工事現場には技術者を置きます。建設業者は、請け負った工事を施工するとき、元請・下請を問わず、また',{b:'⑯',a:'請負代金の額にかかわらず',distractors:['一定額以上のとき','公共工事のときのみ','元請のときのみ']},'**主任技術者**を置かなければなりません。発注者から直接請け負った元請が、下請に出す代金の総額が4,500万円以上（建築一式7,000万円以上）となる場合は、主任技術者に代えて',{b:'⑰',a:'監理技術者',distractors:['専門技術者','現場代理人','安全管理者']},'を置きます。']},
      {type:'p', parts:['公共性のある重要な工事（請負代金が一定額以上）では、主任技術者・監理技術者は',{b:'⑱',a:'専任',distractors:['兼任','非常勤','派遣']},'の者でなければなりません。ただし、<u>密接な関係のある2以上の工事を同一の建設業者が同一の場所で施工する場合は、これらを同一の主任技術者が</u>',{b:'⑲',a:'管理できる',distractors:['管理できない','別々に置く','監理技術者に委ねる']},'という例外があります。']},
      {type:'pastexam', exam:{

function normalize(s) {
  return s.replace(/[\s　]/g, '').replace(/[（）()「」『』【】［］\[\]・]/g, '').toLowerCase();
}
function checkAnswer(userInput, correct, alts) {
  const u = normalize(userInput);
  if (!u) return false;
  if (normalize(correct) === u) return true;
  if (alts) for (const alt of alts) if (normalize(alt) === u) return true;
  return false;
}
function renderParts(parts, topicId) {
  let html = '';
  for (const part of parts) {
    if (typeof part === 'string') html += part.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    else if (part.b) {
      const id = `blank-${topicId}-${part.b}`;
      if (part.distractors) {
        // 4択モード（クリックで展開）
        const choices = shuffleArray([part.a, ...part.distractors]);
        html += `<span class="blank-num">${part.b}</span>`;
        html += `<span class="blank-choice-wrap" id="${id}" data-correct="${part.a.replace(/"/g,'&quot;')}">`;
        html += `<button type="button" class="blank-placeholder" onclick="toggleBlankChoices('${id}')"><span class="ph-text"></span></button>`;
        html += `<span class="blank-choices-pop">`;
        for (const c of choices) {
          const isCorrect = c === part.a;
          html += `<button type="button" class="blank-choice-btn" onclick="answerBlankChoice('${id}', this, ${isCorrect})">${c.replace(/'/g,'&#39;')}</button>`;
        }
        html += `<button type="button" class="blank-reset-btn" onclick="resetBlankChoice('${id}')" title="もう一度">🔄</button>`;
        html += `</span>`;
        html += `</span>`;
        html += `<span class="answer-hint" id="hint-${id}">正解: ${part.a.replace(/'/g,'&#39;')}</span>`;
      } else {
        // 記述式モード（従来）
        const alts = JSON.stringify(part.alts || []).replace(/'/g, "&#39;").replace(/"/g, '&quot;');
        html += `<span class="blank-num">${part.b}</span>`;
        html += `<input class="blank-input" id="${id}" data-correct="${part.a.replace(/"/g,'&quot;')}" data-alts='${alts}' placeholder="入力" type="text">`;
        html += `<span class="answer-hint" id="hint-${id}">正解: ${part.a}</span>`;
      }
    }
  }
  return html;
}

// 採点ロック：テストモードで答え合わせ後、リセットするまで解答変更・再採点を禁止（ズル防止）。
// 採点結果（赤表示＋横の「正解: …」）を見て復習し、再挑戦はリセットから。
var gradedLock = false;
function toggleBlankChoices(blankId) {
  if (gradedLock) return;
  const wrap = document.getElementById(blankId);
  if (!wrap) return;
  const pop = wrap.querySelector('.blank-choices-pop');
  if (!pop) return;
  const willOpen = !pop.classList.contains('show');
  // 他に開いている選択肢を全部閉じる（重なり防止）
  document.querySelectorAll('.blank-choices-pop.show').forEach(p => {
    if (p !== pop) {
      p.classList.remove('show');
      const w = p.closest('.blank-choice-wrap');
      if (w) w.classList.remove('open');
    }
  });
  pop.classList.toggle('show', willOpen);
  wrap.classList.toggle('open', willOpen);
}

function answerBlankChoice(blankId, btnEl, isCorrect) {
  if (gradedLock) return;
  const wrap = document.getElementById(blankId);
  if (!wrap) return;
  const allBtns = wrap.querySelectorAll('.blank-choice-btn');
  const placeholder = wrap.querySelector('.blank-placeholder');
  const phText = placeholder.querySelector('.ph-text');
  const pop = wrap.querySelector('.blank-choices-pop');
  const correctText = wrap.getAttribute('data-correct') || '';
  wrap.setAttribute('data-chosen-correct', isCorrect ? '1' : '0');
  if (MODE === 'memorize') {
    // 暗記モード：選んだ瞬間に正誤＋正解を表示（改修前の挙動）
    if (Array.from(allBtns).some(b => b.classList.contains('correct') || b.classList.contains('wrong'))) return;
    phText.textContent = btnEl.textContent;
    placeholder.classList.add('answered');
    placeholder.classList.remove('selected');
    if (isCorrect) {
      btnEl.classList.add('correct');
      placeholder.classList.add('correct');
      pop.classList.remove('show'); wrap.classList.remove('open');
    } else {
      btnEl.classList.add('wrong');
      placeholder.classList.add('wrong');
      Array.from(allBtns).forEach(b => { if (b.textContent.trim() === correctText.trim()) b.classList.add('correct'); });
      pop.classList.add('show'); wrap.classList.add('open');
    }
    Array.from(allBtns).forEach(b => { b.classList.add('disabled'); b.disabled = true; });
  } else {
    // テストモード：選択を記録するだけ（答え合わせで判定）
    phText.textContent = btnEl.textContent;
    placeholder.classList.add('answered', 'selected');
    placeholder.classList.remove('correct', 'wrong');
    Array.from(allBtns).forEach(b => b.classList.remove('selected', 'correct', 'wrong'));
    btnEl.classList.add('selected');
    const hint = document.getElementById('hint-' + blankId);
    if (hint) hint.classList.remove('show');
    pop.classList.remove('show'); wrap.classList.remove('open');
  }
  updateProgRing();
}

function resetBlankChoice(blankId) {
  if (gradedLock) return; // 採点後は全体リセットのみ可（reset() が先にロックを解除する）
  const wrap = document.getElementById(blankId);
  if (!wrap) return;
  const placeholder = wrap.querySelector('.blank-placeholder');
  const phText = placeholder.querySelector('.ph-text');
  const pop = wrap.querySelector('.blank-choices-pop');
  const allBtns = Array.from(wrap.querySelectorAll('.blank-choice-btn'));
  // 状態クリア
  placeholder.classList.remove('correct', 'wrong', 'answered', 'selected');
  wrap.removeAttribute('data-chosen-correct');
  const _h = document.getElementById('hint-' + blankId); if (_h) _h.classList.remove('show');
  phText.textContent = '';
  allBtns.forEach(b => { b.classList.remove('correct', 'wrong', 'disabled', 'selected'); b.disabled = false; });
  // 選択肢をシャッフルし直し
  const shuffled = allBtns.slice().sort(() => Math.random() - 0.5);
  const resetBtn = wrap.querySelector('.blank-reset-btn');
  allBtns.forEach(b => b.remove());
  shuffled.forEach(b => pop.insertBefore(b, resetBtn));
  // 選択肢は閉じた状態に戻す
  pop.classList.remove('show');
  wrap.classList.remove('open');
  updateProgRing();
}
function shuffleArray(arr) {
  // Fisher-Yates shuffle
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  html += `</ol>
      <div class="explanation" id="exp-${examId}">
        <strong>解説：</strong> ${exam.explanation}
      </div>
      <button class="pe-reset-btn" onclick="resetPastExam('${examId}')">🔄 もう一度解き直す</button>
      <button class="pe-reset-btn pe-close-btn" onclick="closePastExam('${examId}')">✕ 閉じる</button>
    </div>
  </details>`;
  return html;
}

function resetPastExam(examId) {
  const parent = document.getElementById(examId);
  if (!parent) return;
  const ol = parent.querySelector('.choices');
  if (!ol) return;
  // 全選択肢のクラスをクリア
  const lis = Array.from(ol.children);
  lis.forEach(l => l.classList.remove('correct', 'wrong', 'disabled'));
  // 解説を隠す
  const exp = document.getElementById(`exp-${examId}`);
  if (exp) exp.classList.remove('show');
  // 選択肢を再シャッフル（DOM要素を並べ替え + 番号振り直し）
  const shuffled = lis.slice().sort(() => Math.random() - 0.5);
  ol.innerHTML = '';
  shuffled.forEach((li, i) => {
    li.innerHTML = li.innerHTML.replace(/^\d+\.\s*/, `${i+1}. `);
    ol.appendChild(li);
  });
}

function closePastExam(examId) {
  const parent = document.getElementById(examId);
  if (!parent) return;
  const det = parent.closest('details.pe-wrap');
  if (!det) return;
  det.open = false; // 畳む（解答状態は保持。再度開けば続きから見える）
  const sm = det.querySelector('summary');
  if (sm) sm.scrollIntoView({behavior:'smooth', block:'center'}); // 上スクロール不要で該当見出しに戻る
}
function answerPastExam(examId, liEl, isCorrect) {
  const parent = document.getElementById(examId);
  if (!parent) return;
  const allLi = parent.querySelectorAll('.choices li');
  if (Array.from(allLi).some(l => l.classList.contains('correct') || l.classList.contains('wrong'))) return;
  if (isCorrect) {
    liEl.classList.add('correct');
  } else {
    liEl.classList.add('wrong');
    const correctText = parent.getAttribute('data-correct') || '';
    Array.from(allLi).forEach(l => {
      const text = l.textContent.replace(/^\d+\.\s*/, '').trim();
      if (text === correctText.trim()) l.classList.add('correct');
    });
  }
  Array.from(allLi).forEach(l => l.classList.add('disabled'));
  document.getElementById(`exp-${examId}`).classList.add('show');
}

// 進捗リング（暗記・テスト両モード）：回答済み/総数を常時表示し、タップで次の未回答へジャンプ
function updateProgRing() {
  const el = document.getElementById('prog-ring');
  if (!el) return;
  const topic = TOPICS[currentTopic];
  if (!topic || topic.guide) { el.style.display = 'none'; return; }
  let total = 0, done = 0;
  document.querySelectorAll('.blank-choice-wrap').forEach(w => {
    if (w.id.startsWith(`blank-${currentTopic}-`)) {
      total++;
      const ph = w.querySelector('.blank-placeholder');
      if (ph && ph.classList.contains('answered')) done++;
    }
  });
  document.querySelectorAll('.blank-input').forEach(inp => {
    if (inp.id.startsWith(`blank-${currentTopic}-`)) { total++; if (inp.value.trim()) done++; }
  });
  if (!total) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const deg = Math.round(done / total * 360);
  el.style.background = `conic-gradient(var(--accent) ${deg}deg, #e8ebf0 ${deg}deg)`;
  document.getElementById('prog-ring-text').textContent = `${done}/${total}`;
  el.classList.toggle('complete', done === total);
}
function jumpNextBlank(fromId) {
  // fromId があればその直後から探し、末尾まで無ければ先頭に戻って探す
  const wraps = Array.from(document.querySelectorAll('.blank-choice-wrap'))
    .filter(w => w.id.startsWith(`blank-${currentTopic}-`));
  const isUnanswered = w => {
    const ph = w.querySelector('.blank-placeholder');
    return !(ph && ph.classList.contains('answered'));
  };
  const start = fromId ? wraps.findIndex(w => w.id === fromId) + 1 : 0;
  const ordered = wraps.slice(start).concat(wraps.slice(0, start));
  const next = ordered.find(isUnanswered);
  if (next) next.scrollIntoView({behavior: 'smooth', block: 'center'});
}
// 論点内の穴埋め総数（過去問・ひっかけ集は除く）
function countTopicBlanks(topic) {
  let n = 0;
  const scan = parts => { for (const p of parts || []) if (typeof p === 'object' && p.a !== undefined) n++; };
  for (const b of topic.blocks) {
    if (b.type === 'pastexam' || b.type === 'traps') continue;
    if (b.parts) scan(b.parts);
    if (b.items) for (const it of b.items) if (it.parts) scan(it.parts);
  }
  return n;
}
function render(topicId) {
  currentTopic = topicId;
  const topic = TOPICS[topicId];
  const area = document.getElementById('topic-area');
  pastExamCounter = 0; // リセット
  gradedLock = false; // 再描画で解答も消えるためロック解除
  let html = `<h2>${topic.title}</h2>`;
  if (topic.guide) {
    if (topic.lead) html += `<div class="guide-lead">${renderParts(topic.lead, topicId)}</div>`;
  } else {
    html += `<div class="freq-note">※「出題◯回」＝全14回の過去問（H30〜R7）で問われた回数。同じ年に2問以上のこともあります。</div>`;
    html += `<div class="topic-meta"><span class="meta-label">押さえる要点</span>${topic.meta}</div>`;
  }
  for (const block of topic.blocks) {
    if (block.type === 'p') html += `<p>${renderParts(block.parts, topicId)}</p>`;
    else if (block.type === 'ul') {
      html += '<ul>';
      for (const item of block.items) html += `<li>${renderParts(item.parts, topicId)}</li>`;
      html += '</ul>';
    } else if (block.type === 'traps') {
      html += `<details class="traps"><summary>${block.title}</summary><ul>`;
      for (const it of block.items) {
        if (Array.isArray(it)) html += `<li>${renderParts(it, topicId)}</li>`;
        else html += `<li>${it.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}</li>`;
      }
      html += '</ul></details>';
    } else if (block.type === 'hr') html += '<hr>';
    else if (block.type === 'pastexam') html += renderPastExam(topicId, block.exam);
    else if (block.type === 'step') html += `<div class="guide-step"><span class="num">${block.n}</span><span class="label">${block.label}</span></div>`;
    else if (block.type === 'eg') html += `<div class="guide-eg">${renderParts(block.parts, topicId)}</div>`;
    else if (block.type === 'note') html += `<div class="guide-note"><span class="nt">${block.label || '📱 アプリでは'}</span>${renderParts(block.parts, topicId)}</div>`;
  }
  if (topic.guide) html += `<div class="guide-start"><button onclick="startFirstTopic()">▶ さっそく「換気」からはじめる</button></div>`;
  if (!topic.guide) html += `<div class="controls">
    <button class="grade-btn" onclick="grade('${topicId}')">${MODE === 'memorize' ? '答え合わせ' : '採点する'}</button>
    ${MODE === 'memorize' ? `<button class="show-btn" onclick="showAll('${topicId}')">正解を表示</button>` : ''}
    <button class="reset-btn" onclick="reset('${topicId}')">もう一度解き直す</button>
  </div><div id="score-${topicId}"></div>`;
  area.innerHTML = html;
  document.querySelectorAll('.topic-group button').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${topicId}`).classList.add('active');
  updateProgRing();
}
function grade(topicId) {
  if (gradedLock) return;
  let correct = 0, total = 0;
  // 記述式ブランクの採点
  const inputs = document.querySelectorAll(`.blank-input`);
  for (const inp of inputs) {
    if (inp.id.startsWith(`blank-${topicId}-`)) {
      total++;
      let alts = [];
      try { alts = JSON.parse(inp.dataset.alts.replace(/&#39;/g,"'").replace(/&quot;/g,'"')); } catch(e) {}
      const ok = checkAnswer(inp.value, inp.dataset.correct, alts);
      inp.classList.remove('correct', 'wrong');
      const hint = document.getElementById(`hint-${inp.id}`);
      if (ok) { inp.classList.add('correct'); correct++; if (hint) hint.classList.remove('show'); }
      else { inp.classList.add('wrong'); if (hint) hint.classList.add('show'); }
    }
  }
  // 4択モードブランクの採点（ユーザーが正解を選択していれば加点）
  const wraps = document.querySelectorAll(`.blank-choice-wrap`);
  for (const wrap of wraps) {
    if (wrap.id.startsWith(`blank-${topicId}-`)) {
      total++;
      const placeholder = wrap.querySelector('.blank-placeholder');
      const phText = placeholder.querySelector('.ph-text');
      const correctText = wrap.getAttribute('data-correct') || '';
      const chosen = wrap.getAttribute('data-chosen-correct');
      const allBtns = wrap.querySelectorAll('.blank-choice-btn');
      placeholder.classList.remove('correct', 'wrong', 'selected');
      allBtns.forEach(b => b.classList.remove('selected', 'correct', 'wrong'));
      const hint = document.getElementById('hint-' + wrap.id);
      if (chosen === '1') {
        correct++;
        placeholder.classList.add('correct');
        if (hint) hint.classList.remove('show');
      } else {
        placeholder.classList.add('wrong');
        if (!phText.textContent) phText.textContent = '（未回答）';
        if (hint) hint.classList.add('show'); // 誤答・未回答は正解を表示
      }
    }
  }
  const scoreDiv = document.getElementById(`score-${topicId}`);
  const ratio = total ? (correct / total) : 0;
  const passClass = ratio >= 0.8 ? 'pass' : 'fail';
  const isPerfect = (MODE !== 'memorize' && ratio === 1 && total > 0);
  scoreDiv.innerHTML = `<div class="score ${passClass}${isPerfect ? ' perfect' : ''}">${isPerfect ? '🎉 満点！この論点はマスターです<br>' : ''}スコア: ${correct} / ${total} （${Math.round(ratio*100)}%）</div>`;
  if (isPerfect) {
    MASTERED[topicId] = true;
    try{ localStorage.setItem('quizMastered', JSON.stringify(MASTERED)); }catch(e){}
    updateTopicBadges();
  }
  if (MODE !== 'memorize') {
    // テストモード：採点したらリセットまで解答変更・再採点を禁止
    gradedLock = true;
    const gb = document.querySelector('.grade-btn');
    if (gb) gb.disabled = true;
    scoreDiv.innerHTML += '<div class="score-note">採点済みです。赤い箇所の横に正解が表示されています。再挑戦するには「もう一度解き直す」を押してください。</div>';
  }
  scoreDiv.scrollIntoView({behavior:'smooth', block:'center'});
  updateProgRing();
}
function showAll(topicId) {
  document.querySelectorAll(`.blank-input`).forEach(inp => {
    if (inp.id.startsWith(`blank-${topicId}-`)) {
      inp.value = inp.dataset.correct;
      inp.classList.remove('wrong'); inp.classList.add('correct');
      const hint = document.getElementById(`hint-${inp.id}`);
      if (hint) hint.classList.remove('show');
    }
  });
  // 4択モード：placeholder に正解を入れて緑表示
  document.querySelectorAll(`.blank-choice-wrap`).forEach(wrap => {
    if (wrap.id.startsWith(`blank-${topicId}-`)) {
      const correctText = wrap.getAttribute('data-correct') || '';
      const placeholder = wrap.querySelector('.blank-placeholder');
      const phText = placeholder.querySelector('.ph-text');
      placeholder.classList.remove('wrong', 'selected');
      placeholder.classList.add('correct', 'answered');
      phText.textContent = correctText;
      const _h2 = document.getElementById('hint-' + wrap.id); if (_h2) _h2.classList.remove('show');
      wrap.querySelectorAll('.blank-choice-btn').forEach(b => {
        b.classList.remove('wrong', 'selected');
        if (b.textContent.trim() === correctText.trim()) b.classList.add('correct');
        b.classList.add('disabled');
        b.disabled = true;
      });
      // 選択肢は閉じておく
      wrap.querySelector('.blank-choices-pop').classList.remove('show');
      wrap.classList.remove('open');
    }
  });
  updateProgRing();
}
function reset(topicId) {
  gradedLock = false; // 採点ロック解除（リセットのみが解除手段）
  const gb = document.querySelector('.grade-btn');
  if (gb) gb.disabled = false;
  document.querySelectorAll(`.blank-input`).forEach(inp => {
    if (inp.id.startsWith(`blank-${topicId}-`)) {
      inp.value = ''; inp.classList.remove('correct', 'wrong');
      const hint = document.getElementById(`hint-${inp.id}`);
      if (hint) hint.classList.remove('show');
    }
  });
  // 4択モード：選択をリセット
  document.querySelectorAll(`.blank-choice-wrap`).forEach(wrap => {
    if (wrap.id.startsWith(`blank-${topicId}-`)) {
      resetBlankChoice(wrap.id);
    }
  });
  // 過去問チャレンジ：解答をクリアし、折りたたみを既定（閉）に戻す
  document.querySelectorAll(`.past-exam`).forEach(pe => {
    if (pe.id.startsWith(`${topicId}-pe`)) {
      resetPastExam(pe.id);
      const det = pe.closest('details.pe-wrap');
      if (det) det.open = false;
    }
  });
  const sc = document.getElementById(`score-${topicId}`);
  if (sc) sc.innerHTML = '';
  updateProgRing();
  window.scrollTo({top: 0, behavior: 'smooth'}); // 解き直しは論点の先頭から（両モード共通）
}
var TOPIC_CAT={};
[['env',1,5],['str',6,10],['mat',11,14],['set',15,17],['con',18,25],['qc',26,31],['law',32,35]].forEach(function(x){for(var i=x[1];i<=x[2];i++)TOPIC_CAT['t'+i]=x[0];});
TOPIC_CAT['guide']='guide';
function showCategory(cat){
  document.querySelectorAll('.topic-group').forEach(function(g){g.classList.toggle('active', g.dataset.cat===cat);});
  document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.toggle('active', b.dataset.cat===cat);});
}
// 別の論点へ切り替えるときは暗記モードに戻す（学習は必ず暗記から。同じ論点の再クリックでは維持）
function ensureMemorizeFor(id){
  if (id !== currentTopic && MODE !== 'memorize') {
    MODE = 'memorize';
    try{ localStorage.setItem('quizMode', 'memorize'); }catch(e){}
    document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.mode === 'memorize'); });
  }
}
function showTopic(id){ ensureMemorizeFor(id); showCategory(TOPIC_CAT[id]); render(id); }
// カテゴリタップで先頭論点を自動表示（既にそのカテゴリの論点を開いている場合は維持）
var CAT_FIRST = {guide:'guide', env:'t1', str:'t6', mat:'t11', set:'t15', con:'t18', qc:'t26', law:'t32'};
function openCategory(cat){
  showCategory(cat);
  if (TOPIC_CAT[currentTopic] !== cat) { ensureMemorizeFor(CAT_FIRST[cat]); render(CAT_FIRST[cat]); }
}
function startFirstTopic(){ showTopic('t1'); window.scrollTo({top:0, behavior:'smooth'}); }
// マスター済みバッジ（テストモードで満点を取った論点に✓・localStorage保存・自分にだけ見える）
var MASTERED = {};
try{ MASTERED = JSON.parse(localStorage.getItem('quizMastered') || '{}'); }catch(e){}
function updateTopicBadges(){
  let count = 0;
  for (const k in TOPICS) {
    if (k === 'guide') continue;
    if (MASTERED[k]) count++;
    const b = document.getElementById('btn-' + k);
    if (b) b.classList.toggle('done', !!MASTERED[k]);
  }
  // マスター数（積み上げ表示。0個のうちは出さない＝「残り35」に見せない）
  const mc = document.getElementById('mastery-count');
  if (mc) {
    mc.textContent = count > 0 ? `✓ マスター ${count} / 35` : '';
    mc.style.display = count > 0 ? '' : 'none';
  }
}
var MODE = 'memorize';
var currentTopic = 'guide';
function setMode(m){
  MODE = m;
  try{ localStorage.setItem('quizMode', m); }catch(e){}
  document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.mode===m); });
  if(currentTopic) render(currentTopic);
}
try{ MODE = localStorage.getItem('quizMode') || 'memorize'; }catch(e){}
document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.mode===MODE); });
showCategory('guide');
render('guide');
updateTopicBadges();

// 外側クリックで開いている選択肢を閉じる
document.addEventListener('click', function(ev) {
  if (ev.target.closest('.blank-choice-wrap')) return;
  document.querySelectorAll('.blank-choices-pop.show').forEach(p => {
    p.classList.remove('show');
    const w = p.closest('.blank-choice-wrap');
    if (w) w.classList.remove('open');
  });
});
